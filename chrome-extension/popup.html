<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	:root { color-scheme: light dark; --muted: #888; --accent: #7c5cff; --line: rgba(128, 128, 128, 0.3); }
	body { font: 13px system-ui, sans-serif; width: 420px; margin: 0; padding: 10px 12px; }
	h1 { font-size: 14px; margin: 0 0 8px; }
	h2 { font-size: 12px; margin: 12px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
	.record { border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 8px; }
	.record .title { font-weight: 600; }
	.meta { color: var(--muted); font-size: 12px; }
	button { font: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 4px; background: transparent; padding: 3px 8px; margin: 3px 3px 0 0; }
	button:hover { border-color: var(--accent); }
	button.primary { background: var(--accent); border-color: var(--accent); color: white; }
	.row { display: flex; align-items: center; gap: 4px; }
	.row .label { flex: 1; }
	select, textarea { font: inherit; width: 100%; box-sizing: border-box; margin-top: 4px; }
	textarea { height: 180px; font: 12px ui-monospace, monospace; }
	#status { margin-top: 8px; white-space: pre-wrap; font-size: 12px; }
	#status.error { color: #e5484d; }
</style>
</head>
<body>
<div id="app">Loading…</div>
<div id="status"></div>
<script src="dist/popup.js"></script>
</body>
</html>
