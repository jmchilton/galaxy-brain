# Open-requirements ledger: dengueseq-denv3-galaxy
# Started by workflow-brief-to-galaxy-interface (first design Mold; no inherited ledger).
# basis: all brief open-question decisions use the note's enum value `brief-proposal`;
# `review` records the expert review outcome (accepted-proposal | expert-edited) per ../review.md.

entries:
  - id: depth-table-row-and-column-shape
    status: resolved
    raised_by: workflow-brief-to-galaxy-interface
    step: per_base_depth
    unmet: "Public output `per_base_depth` must have exactly one row per reference position (10,707 for NC_001475.2), zero-depth positions included, per brief acceptance criterion and tests/scripts/unit_tests_results.py."
    missing: "Column layout not settled: source runs `bedtools genomecov -d` (chrom, pos, depth; all positions incl. zero) then reduces to a headed 2-column position/depth TSV. Whether the Galaxy output keeps the 3-column headerless form or reproduces the 2-column headed table (and how a header affects the row-count assertion) is for data-flow/test-plan."
    resolved_by: workflow-brief-to-galaxy-data-flow
    note: "Resolved by decision depth-table-keep-genomecov-d-layout: keep native `bedtools genomecov -d` 3-column headerless layout (chrom, 1-based pos, depth); exactly 10,707 lines, no header. Test-plan asserts line count 10,707 and column 2 spans 1..10707."
  - id: low-coverage-and-empty-bam-behavior
    status: open
    raised_by: workflow-brief-to-galaxy-interface
    unmet: "Accepted answer: always emit consensus, variants, depth (and trimmed BAM) for every sample, including low or zero coverage."
    missing: "Source writes placeholder files (make_empty_files.py) when the trimmed BAM is empty and skips later steps; Galaxy tool behavior on an empty BAM (consensus/variants/depth) is unknown. Data-flow/implementation must confirm outputs are still produced or record the gap."
    resolved_by: null
    note: "consensus iteration (discovery consensus-variants-pileup-parity-probe, header-only BAM probe in the wrapper container): source consensus chain (`mpileup -aa --reference`) emits header + 10,707 N; IUC ivar_consensus chain (`mpileup -a`, no reference) emits a header-only FASTA with an EMPTY sequence (iVar 'Reference length: 0'), exit 0. Both variants chains emit a header-only TSV, exit 0. `-a` vs `-aa` only matters for a sample with zero reads on the contig: with any read mapped, `-a` already gives all 10,707 positions (2,596 zero-depth on the fixture). So outputs are still emitted (oq-always-emit-outputs holds), but a zero-read sample's consensus is an empty-sequence record, not all-N. per_base_depth iteration (discovery bedtools-genomecov-wrapper-collected): rendered wrapper command on the same header-only BAM emits 10,707 rows of depth 0, exit 0, identical to source `genomecov -d` -> depth output satisfies always-emit with the full row count. The consensus_header sed on an empty-sequence record is not yet checked; stays open. variants iteration: bound IUC ivar_variants wrapper chain emits a header-only TSV on a header-only BAM (exit 0; probe chain (b) = rendered wrapper command), so variant_calls satisfies always-emit; its missing -a/-aa is moot for ivar variants. consensus_header iteration (discovery tp-sed-wrapper-collected): the bound sed on the wrapper's zero-read consensus record (`>Consensus_<id>_threshold_0.75_quality_20` + one empty line) exits 0 and emits `>{id}.DENV3` + the same empty line, so consensus_genome is still emitted for a zero-read sample, as a header-only/empty-sequence FASTA (source: 10,707 N). Remaining open: (a) that empty-vs-all-N gap is a recorded difference for test-plan/expert (assert record presence/header, not length, for zero-read samples); (b) map_reads/filter_mapped_primary/primer_trim on a zero-read sample (trimmed BAM always-emit) were not exercised end-to-end in Galaxy; test/run phases should confirm, or accept as a known gap."
  - id: two-pileup-settings
    status: resolved
    raised_by: workflow-brief-to-galaxy-interface
    unmet: "Source uses two distinct pileups on the sorted trimmed BAM: consensus `samtools mpileup -aa -A -d 10000 -Q 0`, variants `-aa -A -d 0 -Q 0`."
    missing: "Whether chosen Galaxy iVar consensus/variants wrappers expose or internally fix these mpileup settings is unknown; data-flow must map each or record deviation."
    resolved_by: advance-galaxy-draft-step
    note: "Consensus half decided (decision consensus-ivar-consensus-pin, discovery consensus-variants-pileup-parity-probe): IUC ivar_consensus runs `-A -a -d 0 -Q 0` (no reference/BAQ off); deviation accepted and quantified. Variants half left to the variants iteration, which must read consensus-variants-pileup-parity-probe (variants comparison already run) rather than re-probe. Stays open until variants binds. [variants iteration] Variants half decided (decision variants-ivar-variants-pin): IUC ivar_variants runs `-A -d 0 --reference REF -B -Q 0` (BAQ forced off, no -aa); deviation accepted and quantified from the existing probe, not re-probed. Both halves decided -> resolved; residual expert judgment carried by brief-change recommendations consensus-pileup-baq-off and variants-pileup-baq-off, residual test-sample checks by consensus-baq-deviation-check-on-test-sample and variants-baq-deviation-check-on-test-sample."
  - id: samtools-view-flag-semantics
    status: resolved
    raised_by: workflow-brief-to-galaxy-interface
    unmet: "Mapped-read filter `samtools view -bS -F 4 -F 2048` recorded as written in brief; intent is removal of unmapped and supplementary records."
    missing: "How samtools combines repeated -F flags is not interpreted by the brief or summary; data-flow must choose an exclusion flag setting (e.g. combined 2052) and cite the reasoning."
    resolved_by: workflow-brief-to-galaxy-data-flow
    note: "Resolved by discovery samtools-repeated-F-flags-are-ORed (samtools 1.17 empirically ORs repeated -F; source effective mask = 2052) and decision mapping-filter-exclude-2052."
  - id: srr25366733-fixture-acquisition
    status: resolved
    raised_by: workflow-brief-to-galaxy-interface
    unmet: "Primary test sample SRR25366733 (expert-confirmed, MiSeq 2x251 paired, 183,398 read pairs) must be supplied as a one-element `list:paired` fixture with element identifier `SRR25366733`, forward/reverse fastqsanger.gz."
    missing: "No fetch attempted; no URL/checksum yet. Test-data phase must resolve ENA/SRA FASTQ URLs and hashes."
    resolved_by: find-test-data
    note: "test-data-refs.json element SRR25366733: ENA https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR253/033/SRR25366733/SRR25366733_{1,2}.fastq.gz; SHA-1 a41c8351.../09e1cc0c...; md5 matches ENA filereport; 10,477,526 / 11,262,585 bytes. See discovery srr25366733-ena-files-verified."
  - id: published-consensus-accession-unknown
    status: resolved
    raised_by: workflow-brief-to-galaxy-interface
    unmet: "Accepted (low-confidence) answer: compare produced consensus with a published GenBank consensus for FL-BPHL-0001 if one can be located."
    missing: "No accession in local sources; depth threshold (10 vs 20) used for published Florida genomes unknown. Test-plan must locate it or fall back to structural criteria only."
    resolved_by: find-test-data
    note: "Found GenBank OR150748.1 (isolate DENV-3/USA/FL-BPHL-0001/2023, PRJNA973096, 10,537 bp, 8 N, assembly bwa 0.7.17 + ivar 1.3.1, BPHL submitter). Caveat: its BioSample is SAMN35803652, not the run's SAMN35803653 (same isolate name; no nuccore record links SAMN35803653). Depth threshold used still unknown. Test-plan decides whether to use it (loose identity/length comparison only) or stay structural. See discovery or150748-published-consensus-candidate."
  - id: galaxy-wrapper-availability-unverified
    status: resolved
    raised_by: workflow-brief-to-galaxy-interface
    unmet: "Steps need wrappers for BWA-MEM, samtools view/sort, iVar trim/consensus/variants, samtools mpileup (if separate), bedtools genomecov."
    missing: "Expert requirement: wrapper availability must be collected from the environment (Tool Shed / gxwf), not inferred from paper or code. Not yet probed; discovery belongs to template/draft-step phases."
    resolved_by: advance-galaxy-draft-step
    note: "Per-step progress (advance-galaxy-draft-step): map_reads collected 2026-10-20 via gxwf tool-search/tool-versions/tool-revisions -> devteam/bwa/bwa_mem 0.7.19+galaxy1 @ c598cbb8b019 (discovery bwa-mem-wrapper-collected). filter_mapped_primary collected 2026-10-20 via gxwf tool-search (owner-scoped)/tool-versions/tool-revisions -> iuc/samtools_view 1.22+galaxy2 @ 5cf9fcc93508 (discovery samtools-view-wrapper-collected). primer_trim collected 2026-10-20 via gxwf tool-search/tool-versions/tool-revisions -> iuc/ivar_trim 1.4.4+galaxy1 @ 6606a8c97889 (discovery ivar-trim-wrapper-collected). Stays open until every step's wrapper is collected. consensus collected 2026-10-20 via gxwf tool-search/tool-versions/tool-revisions -> iuc/ivar_consensus 1.4.4+galaxy0 @ 1c5448133894 (discovery ivar-consensus-wrapper-collected). per_base_depth collected 2026-10-20 via gxwf tool-search/tool-versions/tool-revisions -> iuc/bedtools/bedtools_genomecoveragebed 2.31.1+galaxy0 @ d57471728f7b (discovery bedtools-genomecov-wrapper-collected). variants collected 2026-10-20 via gxwf tool-search/tool-versions/tool-revisions -> iuc/ivar_variants 1.4.4+galaxy0 @ 5e5dfc9e71e2 (discovery ivar-variants-wrapper-collected). consensus_header collected 2026-10-20 via gxwf tool-search/tool-versions/tool-revisions -> bgruening/text_processing/tp_sed_tool 9.11+galaxy0 @ 30b60202d990 (discovery tp-sed-wrapper-collected). All seven tool steps now collected from the environment -> resolved."
  - id: serotype-coverage-plane-not-carried
    status: open
    kind: dropped
    raised_by: workflow-brief-to-galaxy-interface
    units: "consensus-to-reference alignment (Nextalign/MAFFT), serotype_caller.py coverage_untrimmed/coverage_trimmed, DENV3.trim.bed coverage-window input, 50% call gate"
    because: "Brief Scope/Excluded removes serotype calling and summary tables; accepted brief open-question answer 'Should a genome completeness/coverage metric be produced?' = no separate metric by default (workflow-brief.md, Open questions)."
    unmet: "Paper's main QC metric (genome completeness over coding window) is not produced."
    missing: "Completeness is inferable only from consensus N content and depth outputs; expert may add a metric later."
    resolved_by: null
    note: "Deliberate cut per reviewed brief, not a capability gap."
  - id: filtered-variant-frequency-table-not-carried
    status: open
    kind: dropped
    raised_by: workflow-brief-to-galaxy-interface
    units: "make_summary_files.py::sort_variant_files output <sample>.<ref>.10.variants_frequency.tsv (PASS, 0.2<AF<0.8, renamed columns) and variants_summary.tsv variant_count"
    because: "Accepted brief open-question answer: expose the full iVar variants table as the variant calls; co-infection analysis excluded (workflow-brief.md, Scope/Excluded and Open questions)."
    unmet: "Source's filtered/renamed variant table and variant_count are not reproduced; repository unit test's variant_count assertion cannot be reused."
    missing: ""
    resolved_by: null
    note: "Deliberate cut per reviewed brief."
  - id: wrapper-mpileup-settings-parity
    status: resolved
    raised_by: workflow-brief-to-galaxy-data-flow
    step: consensus, variants
    unmet: "Consensus branch pileup must equal `samtools mpileup -aa --reference REF -A -d 10000 -Q 0`; variants branch pileup must equal `-aa --reference REF -A -d 0 -Q 0` (0 assumed = no depth cap; samtools 1.17 help shows only default 8000, not confirmed). Source passes no -B, so BAQ stays at samtools default (on); default skip flags unchanged."
    missing: "Chosen consensus/variants wrappers (fused pileup+caller or separate mpileup) not yet discovered; implementation must confirm each flag (-aa, -A, -d, -Q 0, --reference, BAQ) is settable or internally fixed to the same value, and record any deviation (e.g. a wrapper that cannot pass -d 0 or forces -B)."
    resolved_by: advance-galaxy-draft-step
    note: "Wrapper-level split of two-pileup-settings; that entry stays open until this closes. Consensus branch: -A, -Q 0 match; -a (not -aa) differs only for zero-read samples; -d 0 (unlimited, confirmed) vs 10000 has no effect on calls on the fixture despite being exercised (max depth 246,366); BAQ off (no --reference) changes 1 called position of 10,707 (decision consensus-ivar-consensus-pin, discovery consensus-variants-pileup-parity-probe). Variants branch pending its iteration. [variants iteration] Variants branch (decision variants-ivar-variants-pin, discovery consensus-variants-pileup-parity-probe): -A, -Q 0, --reference, -d 0 (unlimited, confirmed) match the source; -aa absent is moot for ivar variants (zero-depth positions never yield rows; header-only TSV on an empty BAM either way); -B forces BAQ off vs source BAQ on -> all 346 source rows present, +6 wrapper-only rows (2 PASS: 3137 A>G AF 0.24, 5591 G>T AF 0.91), 0 PASS flips, ALT_FREQ shifts on 177 shared rows (max 0.124). Every flag now settled or recorded as an accepted deviation -> resolved."
  - id: wrapper-defaults-vs-ivar-defaults
    status: resolved
    raised_by: workflow-brief-to-galaxy-data-flow
    step: primer_trim, consensus, variants
    unmet: "Source leaves iVar options at iVar's own (v1.4 per paper) defaults: trim -m/-q/-s/-x (no -f), consensus -q and -n (N), variants -m and other non -q/-t options. Brief: 'iVar consensus options other than -t/-m stay at iVar's defaults'."
    missing: "Galaxy wrappers commonly set their own default values (e.g. an explicit trim min length) that may differ from the binary defaults; implementation must compare each wrapper default with the iVar binary default and set state to match, or record the deviation. Do not assume parity."
    resolved_by: compare-against-iwc-exemplar
    note: "Resolved by discovery ivar-1-4-4-binary-defaults-match-wrappers: iVar 1.4.4 binary -h defaults equal IUC wrapper defaults (trim -m auto/-1, -q 20, -s 4, -x 0; consensus -q 20, -c 0.8, -n N); variants wrapper passes only -q/-t (+ -r only with GTF, tracked separately as ivar-variants-no-r-without-gtf). Template keeps trimmed_length.filter auto, amplicons.filter_by '' (no -f). Paper's iVar 1.4 vs 1.4.4 not compared (versions are evidence only per brief). Conditional: holds for iuc ivar_* 1.4.4 wrappers; reopen if discovery selects another wrapper."
  - id: ivar-trim-e-explicit
    status: resolved
    raised_by: workflow-brief-to-galaxy-data-flow
    step: primer_trim
    unmet: "Primer trim must keep reads in which no primer was found (`ivar trim -e`), as source does."
    missing: "Wrapper option name/default for -e unknown; implementation must set it explicitly in step state, not rely on a default."
    resolved_by: advance-galaxy-draft-step
    note: "Resolved: primer_trim (iuc ivar_trim 1.4.4+galaxy1) state sets inc_primers: true explicitly (truevalue `-e`, wrapper default false). Docker probe on full denv3_test fixture: wrapper log 'Since the -e flag was given, these reads were written to file' (1,361,380 reads outside primer regions kept), same counts as source verbatim chain (discovery ivar-trim-wrapper-collected)."
  - id: consensus-fasta-header-naming
    status: resolved
    raised_by: workflow-brief-to-galaxy-data-flow
    step: consensus
    unmet: "Source consensus FASTA header is `<sample>.DENV3` (ivar consensus -i), i.e. derived from the sample identifier."
    missing: "Whether the consensus wrapper can set the header from the collection element identifier is unverified. Implementation should prefer an element-identifier-derived header; if not possible, accept the wrapper's header and tell test-plan not to assert the exact header (assert single record instead)."
    resolved_by: advance-galaxy-draft-step
    note: "IUC ivar_consensus 1.4.4+galaxy0 header confirmed empirically (discovery consensus-variants-pileup-parity-probe): `>Consensus_denv3_test_threshold_0.75_quality_20` for element id denv3_test (wrapper seds the first lowercase `consensus` in consensus.fa to the sanitized element id), so the planned consensus_header expression `/^>/s/Consensus_(.*)_threshold_.*/\\1.DENV3/` yields `>denv3_test.DENV3`, equal to the source header. [consensus_header iteration] Resolved (decision consensus-header-tp-sed-pin, discovery tp-sed-wrapper-collected): consensus_header = bgruening tp_sed_tool 9.11+galaxy0 with code `/^>/s/Consensus_(.*)_threshold_.*/\\1.DENV3/`; Docker probe in quay.io/biocontainers/sed:4.9 with the wrapper's exact `sed --sandbox -r -f <configfile>` invocation turns the real wrapper header `>Consensus_denv3_test_threshold_0.75_quality_20` into `>denv3_test.DENV3` (byte-equal to the source chain header) and `>Consensus_SRR25366733_threshold_0.75_quality_20` into `>SRR25366733.DENV3`; sequence lines byte-identical. Test-plan may assert the exact header `>{element_id}.DENV3`."
  - id: consensus-params-connectable
    status: resolved
    raised_by: workflow-brief-to-galaxy-data-flow
    step: consensus
    unmet: "Workflow parameters `Consensus frequency threshold` (float) and `Consensus minimum depth` (int) must drive the consensus step's -t and -m."
    missing: "Requires consensus wrapper -t/-m to be plain float/int params connectable from workflow parameter inputs; unverified until discovery."
    resolved_by: compare-against-iwc-exemplar
    note: "Corpus settles connectability: IWC pe-wgs-ivar-analysis 0.4 step _unlabeled_step_17 (ivar_consensus 1.4.4+galaxy0) wires float workflow param to min_freq and int param to min_qual; wrapper min_depth (-m) is a plain integer param of the same kind (ivar_consensus.xml). Template connects min_freq <- Consensus frequency threshold, min_depth <- Consensus minimum depth. Conditional: holds for iuc ivar_consensus 1.4.4+galaxy0; reopen if discovery selects another wrapper."
  - id: ivar-wrapper-pileup-deviation-choice
    status: resolved
    raised_by: compare-against-iwc-exemplar
    step: consensus, variants
    unmet: "Brief/data-flow pileups: consensus `mpileup -aa --reference REF -A -d 10000 -Q 0` (BAQ on); variants `-aa --reference REF -A -d 0 -Q 0` (BAQ on)."
    missing: "Only corpus wrappers (iuc ivar_consensus/ivar_variants 1.4.4+galaxy0) hard-code `-A -a -d 0 -Q 0` (no reference, so no BAQ) and `-A -d 0 --reference -B -Q 0` (BAQ forced off, no -aa); no IUC iVar wrapper accepts a pileup dataset (per tools-iuc b9b16be49 tools/ivar/ listing; Tool Shed not searched). Template/discovery must choose: accept recorded deviation, find/author a wrapper exposing the flags, or a split pileup->caller path. See discoveries iuc-ivar-consensus-pileup-flags, iuc-ivar-variants-pileup-flags-and-r."
    resolved_by: advance-galaxy-draft-step
    note: "Concrete instance of wrapper-mpileup-settings-parity; that entry and two-pileup-settings stay open until this is decided. Consensus: choice = accept recorded deviation with iuc ivar_consensus 1.4.4+galaxy0; the `DENV3 reference genome` -> consensus edge is dropped (wrapper has no reference port) and that drop IS this deviation (decision consensus-ivar-consensus-pin). Calls differ at 1 position, so brief-change recommendation consensus-pileup-baq-off is proposed for the expert. Variants half open; its data is already in consensus-variants-pileup-parity-probe. [variants iteration] Variants: choice = accept recorded deviation with iuc ivar_variants 1.4.4+galaxy0 @ 5e5dfc9e71e2 (decision variants-ivar-variants-pin); the `DENV3 reference genome` -> variants edge is kept (wrapper `ref` port feeds mpileup --reference). Variant table differs (6 extra rows, 2 PASS), so sibling brief-change recommendation variants-pileup-baq-off is proposed. Both halves decided -> resolved."
  - id: ivar-variants-no-r-without-gtf
    status: resolved
    raised_by: compare-against-iwc-exemplar
    step: variants
    unmet: "Source runs `ivar variants -q 20 -t 0.03 -r REF` with no GFF."
    missing: "iuc ivar_variants 1.4.4+galaxy0 passes `-r ref.fa` only when a GTF is supplied (ivar_variants.xml, tools-iuc b9b16be49); without GTF ivar runs without -r (mpileup still gets --reference, so REF column likely from pileup). Effect on table content (REF/ALT, codon columns) not verified; implementation/test must check or record deviation."
    resolved_by: advance-galaxy-draft-step
    note: "Evidence for the variants iteration (discovery consensus-variants-pileup-parity-probe): with no GFF, `ivar variants` output is byte-identical with and without `-r REF`, for both the source pileup and the IUC wrapper pileup; REF column is A/C/G/T from the pileup either way. Left open for the variants iteration to close. [variants iteration] Closed (decision variants-ivar-variants-pin): step state output_format.choice tabular with no gtf, so the wrapper omits `-r`; probe showed -r is byte-neutral without a GFF for both pileups -> no deviation from omitting -r. GFF_FEATURE/codon/AA columns empty either way."
  - id: primer-bed-scheme-convert-compat
    status: resolved
    raised_by: compare-against-iwc-exemplar
    step: primer_trim
    unmet: "Primer trim must consume pinned 6-column DENV3.bed (pool col 5, strand col 6; 70 records)."
    missing: "iuc ivar_trim 1.4.4+galaxy1 first runs `scheme-convert --to bed --bed-type ivar` (viramp-hub 0.1.0) on the BED; DENV3.bed's naming/pool convention not checked against its parser (ARTIC BEDs pass in IWC tests). Implementation/test must confirm."
    resolved_by: advance-galaxy-draft-step
    note: "Resolved empirically (discovery ivar-trim-wrapper-collected): in the wrapper's own mulled container, scheme-convert parses DENV3.bed (both raw CRLF and LF forms) into 70 records with identical chrom/start/end/name/strand (records re-sorted by start; col 5 pool -> score 60). ivar trim reports 'Found 70 primers'; on the full denv3_test fixture the wrapper chain and the source verbatim chain give identical per-primer counts and identical alignments (SAM cols 1-11 and all tags except iVar's XA:i primer-index tag, which shifts only because the converted BED is re-ordered; not read by mpileup/consensus/variants/genomecov)."

  - id: consensus-baq-deviation-check-on-test-sample
    status: open
    raised_by: advance-galaxy-draft-step
    step: consensus
    unmet: The accepted BAQ-off consensus deviation (decision consensus-ivar-consensus-pin) was measured only on the repo denv3_test fixture (1 differing position of 10,707).
    missing: "Size of the deviation on the expert's test sample SRR25366733 is unknown. Test/run phases should run the source verbatim mapper.sh L46 chain alongside the workflow consensus on SRR25366733 (or its fixture) and report differing called positions, so the expert can judge brief-change recommendation consensus-pileup-baq-off against the published-consensus acceptance criterion. Depth cap need NOT be re-checked there: -d 10000 vs unlimited was exercised on the fixture (max depth 246,366) with no effect on calls."
    resolved_by: null
    note: ''
  - id: variants-baq-deviation-check-on-test-sample
    status: open
    raised_by: advance-galaxy-draft-step
    step: variants
    unmet: "The accepted BAQ-off variants deviation (decision variants-ivar-variants-pin) was measured only on the repo denv3_test fixture (+6 wrapper-only rows of 352, 2 of them PASS; 0 PASS flips on the 346 shared rows)."
    missing: "Size of the deviation on the expert's test sample SRR25366733 is unknown. Test/run phases should run the source verbatim mapper.sh L68 chain alongside the workflow variants on SRR25366733 and report row-set and PASS differences (keyed on POS/REF/ALT), so the expert can judge brief-change recommendation variants-pileup-baq-off. Test-plan should not assert exact variant row counts copied from a source run without this check. Depth cap and -r need no re-check (-d 0 both sides; -r byte-neutral without GFF)."
    resolved_by: null
    note: ''
discoveries:
  - id: repo-bed-and-fasta-identical-to-test-refs
    raised_by: workflow-brief-to-galaxy-interface
    evidence: "sources/DENV_pipeline/tests/test_refs/DENV3.{bed,fasta} are byte-identical (diff) to denv_pipeline/DENV_primers_and_refs/DENV3.{bed,fasta} at the v1.0 pin; DENV3.bed has 70 records, 6 columns (chrom NC_001475.2, start, end, name, pool, strand)."
    impact: "One reference FASTA and one primer BED fixture serve both the SRR25366733 and denv3_test tests."
  - id: repo-denv3-test-fixture-is-large
    raised_by: workflow-brief-to-galaxy-interface
    evidence: "tests/test_inputs/denv3_test/denv3_test_S30_L003_R1_001.fastq.gz is ~91.5 MB and R2 ~87.0 MB (~178 MB pair)."
    impact: "The brief's 'additional or smaller test' fixture is not small; treat as secondary test only, possibly subsampled or run as a non-default/CI-optional test. Not a brief change: accepted answer says 'secondary test'."
  - id: reference-not-a-builtin-genome
    raised_by: workflow-brief-to-galaxy-interface
    evidence: "Source builds/ships its own BWA index for DENV3.fasta (NC_001475.2, 10,707 bp); no Galaxy built-in index is implied by any source."
    impact: "Reference is supplied as a history FASTA dataset; mapping step must index from history."
  - id: source-sample-layout-is-directory-convention
    raised_by: workflow-brief-to-galaxy-interface
    evidence: "Source finds reads by *R1*/*R2* globs in one directory per sample; brief: 'That layout is a source convention, not a requirement'. No sample sheet or per-sample metadata columns in source."
    impact: "A plain list:paired collection suffices; no sample_sheet input."
  - id: samtools-repeated-F-flags-are-ORed
    raised_by: workflow-brief-to-galaxy-data-flow
    evidence: "Docker probe 2026-10-20, quay.io/biocontainers/samtools:1.17--hd87286a_2 (amd64 emulation): 3-record SAM (r1 mapped primary, r2 flag 4, r3 flag 2048); `samtools view -F 4 -F 2048`, `-F 2048 -F 4` and `-F 2052` each output only r1."
    impact: "Source `-F 4 -F 2048` (as written) is effectively exclude-mask 2052 at the paper's samtools version; intended and actual semantics agree."

  - id: iuc-ivar-consensus-pileup-flags
    raised_by: compare-against-iwc-exemplar
    evidence: "tools-iuc b9b16be49 tools/ivar/ivar_consensus.xml:13 `samtools mpileup -A -a -d 0 -Q 0 sorted.bam | ivar consensus -p consensus -q -t -c -m <depth_action>`; @TOOL_VERSION@ 1.4.4, wrapper +galaxy0 (matches IWC pins; Tool Shed changeset not cross-checked)."
    impact: "Consensus pileup differs from brief (-aa, --reference/BAQ, -d 10000). See ivar-wrapper-pileup-deviation-choice; -a vs -aa also bears on low-coverage-and-empty-bam-behavior (a no-read reference may yield no pileup rows)."
  - id: iuc-ivar-variants-pileup-flags-and-r
    raised_by: compare-against-iwc-exemplar
    evidence: "tools-iuc b9b16be49 tools/ivar/ivar_variants.xml:12 `samtools mpileup -A -d 0 --reference ref.fa -B -Q 0`; `-r ref.fa -g gtf` emitted only when gtf set."
    impact: "Variants pileup forces -B (BAQ off) and lacks -aa vs source; ivar runs without -r absent a GTF. See ivar-wrapper-pileup-deviation-choice, ivar-variants-no-r-without-gtf."
  - id: iuc-ivar-trim-sorts-output
    raised_by: compare-against-iwc-exemplar
    evidence: "ivar_trim.xml:45 pipes `ivar trim` into `samtools sort -o trimmed.sorted.bam`; output_bam format bam. Input linked with metadata.bam_index (must be indexed Galaxy bam)."
    impact: "Data-flow N5 sort_trimmed is absorbed by the trim wrapper (contrary to data-flow assumption that trim output is unsorted); N3 absorbed by bwa_mem output_sort: coordinate. ivar_trim/output_bam is the fan-out point and primer_trimmed_bam producer, as in IWC pe-wgs-ivar-analysis."
  - id: iuc-ivar-consensus-header-from-element-id
    raised_by: compare-against-iwc-exemplar
    evidence: "ivar_consensus.xml:10,21 sanitizes element_identifier (re.sub [^\\w\\-] -> _) and seds it into the iVar header; IWC pe-wgs-ivar-analysis step 'Consensus genome (masked for depth)' (tp_sed) then applies `/^>/s/Consensus_(.*)_threshold_.*/\\1/`, test asserts `>ERR4970105`."
    impact: "consensus-fasta-header-naming: element-id-derived header is available; a tp_sed step with replacement `\\1.DENV3` would reproduce the source header. Template decides whether to add the node."
  - id: ivar-trim-e-is-inc-primers
    raised_by: compare-against-iwc-exemplar
    evidence: "ivar_trim.xml:83 `inc_primers` argument -e, boolean, checked=false; IWC exemplars set inc_primers: true."
    impact: "ivar-trim-e-explicit: step state must set inc_primers: true (default false)."
  - id: ivar-1-4-4-binary-defaults-match-wrappers
    raised_by: compare-against-iwc-exemplar
    evidence: "Docker 2026-10-20 quay.io/biocontainers/ivar:1.4.4--h077b44d_0 (amd64 emulation): `ivar trim -h` -x 0, -m 50% avg length of first 1000 reads, -q 20, -s 4, -e off; `ivar consensus` -q 20, -t 0, -c 0.8, -m 10, -n N."
    impact: "IUC wrapper defaults equal binary defaults for every option the brief leaves at default; closes wrapper-defaults-vs-ivar-defaults."
  - id: bedtools-genomecov-wrapper-d-requires-hist-mode
    raised_by: compare-against-iwc-exemplar
    evidence: "tools-iuc bedtools/genomeCoverageBed.xml emits -bg when report_select==bg and zero_regions false, -max $max in hist mode, plus $d. Docker probe bedtools:2.31.1--h13024bc_3: `-bg -d` errors 'Use -d/-dz or -bg, not both'; `-max 0 -d` gives per-base chrom/pos/depth incl. zero rows, same as `-d`."
    impact: "N6c state for bedtools_genomecoveragebed 2.31.1+galaxy0: input_type_select bam, report.report_select hist, d true."
  - id: iwc-corpus-tool-pins
    raised_by: compare-against-iwc-exemplar
    evidence: "IWC 7ba89fa: bwa_mem 0.7.19(+galaxy1), samtools_view 1.22+galaxy1/+galaxy2, ivar_trim 1.4.4+galaxy1, ivar_variants 1.4.4+galaxy0, ivar_consensus 1.4.4+galaxy0, bedtools_genomecoveragebed 2.31.1+galaxy0, tp_sed_tool 9.11+galaxy0 (full table in iwc-comparison-notes.md)."
