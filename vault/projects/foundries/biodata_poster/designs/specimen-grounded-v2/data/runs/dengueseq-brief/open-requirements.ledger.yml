  - id: consensus-variants-pileup-parity-probe
    raised_by: advance-galaxy-draft-step
    step: consensus, variants
    evidence: "Docker 2026-10-20, all chains in the IUC ivar_consensus/ivar_variants wrapper container mulled-v2-4f658947...:3173a8c8...-0 (samtools 1.22.1, iVar 1.4.4; amd64 emulation), FULL repo fixture tests/test_inputs/denv3_test, repo DENV3.fasta, reusing the primer_trim probe BAMs (source-verbatim trimmed+sorted BAM; IUC ivar_trim-rendered BAM, SAM cols 1-11 identical). CONSENSUS: (a) mapper.sh L46 verbatim `mpileup -aa --reference REF -A -d 10000 -Q 0 | ivar consensus -t 0.75 -m 10` -> 10,709 bp, 3,141 N; (b) IUC-rendered `mpileup -A -a -d 0 -Q 0 | ivar consensus -q 20 -t 0.75 -c 0.8 -m 10 -n N` -> 10,708 bp, 3,141 N, header `Consensus_denv3_test_threshold_0.75_quality_20`. Identical N mask (0 N-only positions either side); ONE called-base difference, at ref 5591 (G; context ...ACG[G]TGTGG): (b) calls T (G>T, 848/929 reads, ivar variants AF 0.913 BAQ-off), (a) keeps G and inserts +T (BAQ demotes the T bases below q20, leaving ~81 quality bases of which 79 carry +T, over the 0.8 indel threshold) -> source consensus 1 bp longer. (b)'s pileup on the source-trimmed BAM gives the identical consensus to (b) -> trim chain contributes nothing. Attribution: source flags + `-B` (BAQ off, -d 10000) == (b); source flags with `-d 0` (BAQ on) == (a) -> the difference is entirely BAQ; depth cap and -a/-aa contribute nothing. VARIANTS: (a) mapper.sh L68 verbatim `mpileup -aa --reference REF -A -d 0 -Q 0 | ivar variants -q 20 -t 0.03 -r REF` -> 346 rows (324 PASS); (b) IUC-rendered tabular, no GTF `mpileup -A -d 0 --reference REF -B -Q 0 | ivar variants -q 20 -t 0.03` (no -r) -> 352 rows (326 PASS). Keyed on POS/REF/ALT: all 346 (a) rows present in (b); 6 (b)-only rows (PASS: 3137 A>G AF 0.24, 5591 G>T AF 0.91; non-PASS: 1843 C>T, 8085 A>G, 8300 C>G, 8321 A>T); 0 PASS flips on shared rows; 177 shared rows differ in ALT_FREQ (max |dAF| 0.124 at 2491 T>C), depth/qual columns differ (BAQ). Source-style summary filter (PASS, 0.2<AF<0.8; not carried, see filtered-variant-frequency-table-not-carried): 2 vs 3 rows. `-r REF` with vs without: byte-identical for both pileups (no GFF; REF from pileup). DEPTH: `-d 0` confirmed unlimited (samtools logs 'Max depth set to maximum value (2147483647)'); max pileup depth 246,366 (pos 7295); 3,468 positions > 10,000; `-d 10000` caps max at 10,074 and alters depth at 3,838 positions (default 8000: 3,948) -> the -d 10000 vs 0 difference WAS exercised on this fixture. EMPTY BAM (header-only): see low-coverage-and-empty-bam-behavior. WALL-CLOCK (amd64 emulation): consensus 3 chains 163 s, variants 4 chains 328 s, depth pileups 214 s, attribution + empty-BAM 105 s; ~13.5 min total. Scratch: _scratch/consensus/ (probe.sh, probe2.sh, scripts/cdiff.py, scripts/vdiff.py, out/)."
    impact: 'Consensus: IUC wrapper deviation = BAQ only, 1 of 10,707 positions on the fixture (SNV vs +1 insertion at 5591); accepted by decision consensus-ivar-consensus-pin with brief-change recommendation consensus-pileup-baq-off. Variants: the variants iteration can rely on this comparison without re-probing - IUC ivar_variants deviation is BAQ-forced-off (+6 low-frequency/new rows, ALT_FREQ shifts, no PASS flips), -r irrelevant without a GFF. Depth cap needs no SRR25366733 re-check.'
