    raised_by: workflow-brief-to-galaxy-template
    evidence: "Template computability review of all 7 steps: each declared output is computable from its wired inputs (reads+reference -> BAM; BAM -> filtered BAM; BAM+BED -> trimmed BAM; trimmed BAM+reference+2 params -> consensus; consensus -> renamed FASTA; trimmed BAM+reference -> variants; trimmed BAM -> per-base depth, reference length carried in BAM header)."
    impact: "No blocking entries appended. Non-blocking risks stay tracked: sort folds conditional on wrapper (template-fold-sort-nodes-into-wrappers), pileup parity (ivar-wrapper-pileup-deviation-choice), empty-BAM behavior (low-coverage-and-empty-bam-behavior)."

