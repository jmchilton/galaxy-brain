decisions:
  # --- Workflow Brief open questions (all ten, in brief order) ---
  - id: oq-primer-scheme-for-trimming
    decided_by: workflow-brief-to-galaxy-interface
    open_question: "Which primer scheme amplified the test sample SRR25366733: DENV3-only or pan-serotype?"
    basis: brief-proposal
    review: accepted-proposal
    confidence: low
    decision: "Treat as DENV3 primers for trimming; trim with the DENV3 primer BED only, as the source does per reference."
    rationale: "Brief proposal accepted unedited at expert review; paper suggests Florida validated the pan-serotype scheme but SRA metadata confirming pools is missing."
  - id: oq-test-sample-metadata
    decided_by: workflow-brief-to-galaxy-interface
    open_question: "Is the test sample's metadata correct (DENV-3/USA/FL-BPHL-0001/2023, MiSeq 2×251, PRJNA973096)?"
    basis: brief-proposal
    review: expert-edited
    decision: "Yes. Use SRR25366733 as the primary test sample (ENA: Illumina MiSeq, paired, BioSample SAMN35803653 alias DENV-3/USA/FL-BPHL-0001/2023, 183,398 read pairs, PRJNA973096)."
    rationale: "Expert checked the ENA record 2026-10-20 and replaced the proposal with a confirmed answer; sample record authoritative over SRA file names (FL-BPHL-0005)."
  - id: oq-published-consensus-comparison
    decided_by: workflow-brief-to-galaxy-interface
    open_question: "Should the produced consensus be compared against a published consensus genome for the test sample?"
    basis: brief-proposal
    review: accepted-proposal
    confidence: low
    decision: "Yes if a GenBank consensus for FL-BPHL-0001 can be located; otherwise structural criteria only."
    rationale: "Brief proposal accepted unedited; accession not in local sources (see entry published-consensus-accession-unknown)."
  - id: oq-reference-and-bed-source
    decided_by: workflow-brief-to-galaxy-interface
    open_question: "Which primer BED and reference copy are authoritative: the pinned repository files or the protocols.io release?"
    basis: brief-proposal
    review: accepted-proposal
    confidence: low
    decision: "Pinned repository files DENV3.fasta and DENV3.bed at v1.0."
    rationale: "Brief proposal accepted unedited; exactly what the published pipeline used; protocols.io copy not compared."
  - id: oq-completeness-metric
    decided_by: workflow-brief-to-galaxy-interface
    open_question: "Should a genome completeness/coverage metric be produced?"
    basis: brief-proposal
    review: accepted-proposal
    confidence: low
    decision: "No separate metric by default; consensus and depth outputs show completeness."
    rationale: "Brief proposal accepted unedited; source computes it only for excluded serotype calling (see dropped entry serotype-coverage-plane-not-carried)."
  - id: oq-consensus-min-depth
    decided_by: workflow-brief-to-galaxy-interface
    open_question: "What consensus minimum depth should be used: 10 or 20?"
    basis: brief-proposal
    review: accepted-proposal
    decision: "10, adjustable (public integer workflow parameter, default 10)."
    rationale: "Brief proposal accepted unedited; paper Methods, code default and Fig. S1 all say 10."
  - id: oq-variant-output
    decided_by: workflow-brief-to-galaxy-interface
    open_question: "Which variant output should be produced: iVar's full variant table, or the pipeline's filtered and renamed table?"
    basis: brief-proposal
    review: accepted-proposal
    decision: "Full iVar variants table (min quality 20, min frequency 0.03) as the variant calls."
    rationale: "Brief proposal accepted unedited; filtered table serves excluded co-infection analysis."
  - id: oq-always-emit-outputs
    decided_by: workflow-brief-to-galaxy-interface
    open_question: "Should outputs be produced regardless of how much of the genome is covered?"
    basis: brief-proposal
    review: accepted-proposal
    decision: "Yes. Always emit consensus, variants and depth for DENV3, including low-coverage results; no 50% gate."
    rationale: "Brief proposal accepted unedited; serotype known, serotype calling excluded (see entry low-coverage-and-empty-bam-behavior)."
  - id: oq-trimmed-bam-output
    decided_by: workflow-brief-to-galaxy-interface
    open_question: "Should the primer-trimmed, sorted alignment be a workflow output?"
    basis: brief-proposal
    review: accepted-proposal
    decision: "Yes, as a secondary public output `primer_trimmed_bam`."
    rationale: "Brief proposal accepted unedited; source publishes it in results/bam_files."
  - id: oq-repo-test-fixture
    decided_by: workflow-brief-to-galaxy-interface
    open_question: "Is the repository's DENV3 test fixture useful as an additional or smaller test?"
    basis: brief-proposal
    review: accepted-proposal
    decision: "Yes, as a secondary test alongside SRR25366733."
    rationale: "Brief proposal accepted unedited; note discovery repo-denv3-test-fixture-is-large (~178 MB, not smaller)."

  # --- Interface decisions ---
  - id: reads-as-list-paired
    decided_by: workflow-brief-to-galaxy-interface
    decision: "Workflow input `Paired-end reads`: collection type list:paired, element identifiers = sample IDs, forward/reverse members fastqsanger.gz (fastqsanger also acceptable)."
    rationale: "Brief: per sample, forward and reverse FASTQ; per-sample outputs; mapping-over a list:paired gives sample-keyed outputs. Single test sample = one-element list."
    evidence: [source-sample-layout-is-directory-convention]
  - id: reference-as-history-fasta
    decided_by: workflow-brief-to-galaxy-interface
    decision: "Workflow input `DENV3 reference genome`: single dataset, fasta; used for mapping (index from history), consensus/variant pileups and iVar variants -r."
    rationale: "Accepted answer: pinned repository DENV3.fasta; not a built-in genome."
    evidence: [reference-not-a-builtin-genome, repo-bed-and-fasta-identical-to-test-refs]
  - id: primer-bed-input
    decided_by: workflow-brief-to-galaxy-interface
    decision: "Workflow input `DENV3 primer BED`: single dataset, bed (6 columns, pool in col 5, strand col 6)."
    rationale: "Brief input role DENV3 primer positions; accepted answer uses repository DENV3.bed."
    evidence: [repo-bed-and-fasta-identical-to-test-refs]
  - id: public-consensus-parameters-only
    decided_by: workflow-brief-to-galaxy-interface
    decision: "Expose only `Consensus frequency threshold` (float, default 0.75) and `Consensus minimum depth` (int, default 10) as workflow parameters. Variant calling (-q 20, -t 0.03), trim -e, mpileup and mapping filter settings are fixed in-step."
    rationale: "Brief Inputs list only these two as consensus parameters; paper says only these 'can be changed by the user'. Other settings are source behavior to follow."
  - id: per-sample-list-outputs
    decided_by: workflow-brief-to-galaxy-interface
    decision: "Public outputs, each a list keyed by sample ID: `consensus_genome` (fasta), `variant_calls` (tabular iVar TSV), `per_base_depth` (tabular), `primer_trimmed_bam` (bam, secondary). No separate BAI output (Galaxy bam datatype carries its index). No serotype, summary, alignment, completeness or plot outputs."
    rationale: "Brief Outputs and acceptance criteria; accepted answers oq-variant-output, oq-trimmed-bam-output, oq-completeness-metric; Scope/Excluded."
  - id: no-extra-checkpoint-outputs
    decided_by: workflow-brief-to-galaxy-interface
    decision: "No additional checkpoint outputs promoted; the four public outputs already give content-level assertions (depth row count, consensus length/N masking, variant table header and rows)."
    rationale: "Testability note: promote selectively; untrimmed BAM / pileups add interface noise without a stronger assertion."

  # --- Data-flow decisions ---
  - id: per-sample-map-over-topology
    decided_by: workflow-brief-to-galaxy-data-flow
    decision: "Linear per-sample map-over: map (list:paired -> list) -> filter -> sort -> ivar trim -> sort/index (fan-out, primer_trimmed_bam) -> {consensus, variants, per-base depth}. Reference and BED broadcast; no reductions, Apply Rules, cleanup or cross-sample steps."
    rationale: "Source per-reference path in mapper.sh collapsed to DENV3; paper Methods and Fig. S1 agree on order."
  - id: mapping-filter-exclude-2052
    decided_by: workflow-brief-to-galaxy-data-flow
    decision: "Post-mapping filter excludes flags 4 and 2048 (mask 2052) only; secondary (256) kept, no MAPQ filter."
    rationale: "Brief intent (remove unmapped and supplementary) and source behavior at samtools 1.17 coincide."
    evidence: [samtools-repeated-F-flags-are-ORed]
  - id: two-independent-pileup-branches
    decided_by: workflow-brief-to-galaxy-data-flow
    decision: "Consensus and variants each get their own pileup from the sorted trimmed BAM (consensus -d 10000, variants -d 0); no shared pileup node. Fused pileup+caller wrappers or split pileup->caller are both acceptable if flags match."
    rationale: "Brief acceptance criterion: variant calling 'on its own pileup'; source runs two mpileups with different -d."
  - id: depth-table-keep-genomecov-d-layout
    decided_by: workflow-brief-to-galaxy-data-flow
    decision: "per_base_depth is native `bedtools genomecov -d -ibam` output: 3 columns (chrom, 1-based pos, depth), headerless, 10,707 lines; no cut/header transform."
    rationale: "Brief requires one row per reference base covering every position, not the source's post-processed 2-column headed form; native layout makes the row-count assertion exact and avoids a placeholder transform. Reproducing the 2-column table is a single optional tabular transform if the expert wants it."
  - id: no-coverage-gate-or-conditional
    decided_by: workflow-brief-to-galaxy-data-flow
    decision: "No conditional/when, filter-empty or 50% coverage gate; every sample flows to all four outputs."
    rationale: "Accepted answer oq-always-emit-outputs; serotype calling excluded. Empty-BAM tool behavior remains open (low-coverage-and-empty-bam-behavior)."
  - id: bwa-verbosity-threads-not-carried
    decided_by: workflow-brief-to-galaxy-data-flow
    decision: "BWA-MEM `-v 1 -t 2` not carried as step state; default BWA-MEM scoring in paired mode."
    rationale: "Verbosity and thread count do not change alignments' scientific content; Galaxy manages threads."

  # --- Template decisions ---
  - id: template-fold-sort-nodes-into-wrappers
    decided_by: workflow-brief-to-galaxy-template
    decision: "Data-flow N3 sort_mapped folds into map_reads (coordinate-sorted BAM output required) and N5 sort_trimmed folds into primer_trim (sorted, indexed output required). Draft steps: map_reads -> filter_mapped_primary -> primer_trim -> {consensus -> consensus_header, variants, per_base_depth}."
    rationale: "Data-flow brief allows folding N3; IUC ivar_trim sorts internally (contrary to the data-flow 'unsorted' assumption, which holds for the binary only). Conditional on those wrappers: if phase 5 selects a mapper or trimmer that does not sort, a sort step is a repair-galaxy-draft-topology escalation, as recorded in each step's _plan_out."
    evidence: [iuc-ivar-trim-sorts-output]
  - id: fused-pileup-caller-node-per-branch
    decided_by: workflow-brief-to-galaxy-template
    decision: "Consensus and variants are each one pileup+caller node fed directly by primer_trim (no separate pileup node). The pileup-flag parity choice (ivar-wrapper-pileup-deviation-choice) is left to the per-step loop and must be recorded there."
    rationale: "Fits every parity outcome except a split pileup->caller path (accept recorded deviation, authored wrapper exposing flags, other discovered fused wrapper); no known wrapper takes a pileup dataset, so a split path would be a repair escalation. Topology half of two-pileup-settings is settled (two independent branches); wrapper-flag half stays open."
    evidence: [iuc-ivar-consensus-pileup-flags, iuc-ivar-variants-pileup-flags-and-r]
  - id: reference-wired-to-consensus-and-variants
    decided_by: workflow-brief-to-galaxy-template
    decision: "`DENV3 reference genome` is wired into consensus as well as variants (and map_reads)."
    rationale: "Source consensus pileup uses `--reference` (BAQ on). The IUC ivar_consensus wrapper has no reference port; choosing it means dropping this edge, which is itself the deviation decision and must be recorded under ivar-wrapper-pileup-deviation-choice, not done silently."
  - id: consensus-header-sed-node
    decided_by: workflow-brief-to-galaxy-template
    decision: "Add step consensus_header (header normalization) after consensus; `consensus_genome` is promoted from it. Target header `>{element_id}.DENV3`, e.g. IUC header form via `/^>/s/Consensus_(.*)_threshold_.*/\\1.DENV3/`."
    rationale: "Reproduces source `-i ${fname}.DENV3` header and gives test-plan a stable exact-header assertion; same idiom as IWC pe-wgs-ivar-analysis 'Consensus genome (masked for depth)'. Harmless no-op if the chosen consensus wrapper already emits `<sample>.DENV3`. Topology half of consensus-fasta-header-naming; entry stays open until phase 5 binds the expression to the chosen consensus wrapper's header."
    evidence: [iuc-ivar-consensus-header-from-element-id]
  - id: template-wrapper-tiers
    decided_by: workflow-brief-to-galaxy-template
    decision: "Identity-pinned (versionless repo tool_id, tool_version TODO): map_reads (devteam bwa_mem), filter_mapped_primary (iuc samtools_view), primer_trim (iuc ivar_trim), consensus_header (bgruening tp_sed_tool), per_base_depth (iuc bedtools_genomecoveragebed). Deferred (tool_id TODO): consensus, variants."
    rationale: "Pins rest on corpus use of the same wrapper for the same operation (iwc-corpus-tool-pins), not on environment availability, which remains unverified (galaxy-wrapper-availability-unverified stays open). consensus/variants deferred because wrapper choice is coupled to the open pileup-parity decision; IUC ivar_consensus/ivar_variants are named in _plan_context as candidates only. Exemplar confidence Medium; genomecov pin from rank-3 pattern-only exemplar (state probe-verified)."
    confidence: low
  - id: map-reads-bwa-mem-pin
    decided_by: advance-galaxy-draft-step
    step: map_reads
    decision: "map_reads = devteam/bwa/bwa_mem 0.7.19+galaxy1 (changeset c598cbb8b019). State: reference_source history (index_a auto), fastq_input paired_collection fed by `Paired-end reads` (list:paired map-over -> one BAM per sample element), rg do_not_set, analysis_type illumina, output_sort coordinate. Output bam_output (hidden) feeds filter_mapped_primary."
    rationale: "Identity pin confirmed by Tool Shed discovery; newest wrapper revision chosen over the exemplar's 0.7.19 (same bwa binary, one wrapper revision newer). Exemplar idiom reused minus fastp upstream (brief: no trimming before mapping)."
    evidence: [bwa-mem-wrapper-collected, iwc-corpus-tool-pins]

  - id: filter-mapped-primary-samtools-view-pin
    decided_by: advance-galaxy-draft-step
    step: filter_mapped_primary
    decision: "filter_mapped_primary = iuc/samtools_view 1.22+galaxy2 (changeset 5cf9fcc93508). State: mode.outtype selected_reads; filter_config exclusive_filter ['4','2048'] (-F 2052), inclusive_filter / exclusive_filter_all unset (-f 0 / -G 0), quality / cigarcons unset, no region/RG/expression/tag/qname filters; subsample fraction factor 1 (off); output_options retained, complementary_output false, oformat bam; addref no. Input `input` <- map_reads/bam_output; output `outputsam` (hidden) feeds primer_trim."
    rationale: "Identity pin confirmed by Tool Shed discovery; newest wrapper revision (exemplar used 1.22+galaxy1). Exemplar inclusive_filter ['1','2'] and quality 20 deliberately not copied (decision mapping-filter-exclude-2052)."
    evidence: [samtools-view-wrapper-collected, samtools-repeated-F-flags-are-ORed, iwc-corpus-tool-pins]

  - id: primer-trim-ivar-trim-pin
    decided_by: advance-galaxy-draft-step
    step: primer_trim
    decision: "primer_trim = iuc/ivar_trim 1.4.4+galaxy1 (changeset 6606a8c97889). State: primer.source history (input_bed <- `DENV3 primer BED`), amplicons.filter_by '' (no -f), primer_pos_wiggle 0, inc_primers true (-e), min_qual 20, window_width 4, trimmed_length.filter auto (-m -1). Input input_bam <- filter_mapped_primary/outputsam; output output_bam (visible) is the public primer_trimmed_bam and feeds consensus, variants, per_base_depth."
    rationale: "Identity pin confirmed by Tool Shed discovery at the newest version (= exemplar). Every option set explicitly at the iVar binary default the source relies on; exemplar amplicons yes_compute not copied. Empirical parity with the source trim chain on the full repo fixture."
    evidence: [ivar-trim-wrapper-collected, ivar-trim-e-is-inc-primers, ivar-1-4-4-binary-defaults-match-wrappers, iwc-corpus-tool-pins]
  - id: consensus-ivar-consensus-pin
    decided_by: advance-galaxy-draft-step
    step: consensus
    decision: "consensus = iuc/ivar_consensus 1.4.4+galaxy0 (changeset 1c5448133894), accepting a recorded, quantified pileup deviation. State: input_bam <- primer_trim/output_bam; min_freq <- `Consensus frequency threshold` and min_depth <- `Consensus minimum depth` (ConnectedValue); min_qual 20, min_indel_freq 0.8, depth_action '-n N' set explicitly (iVar defaults). Output consensus (hidden) -> consensus_header. The planned `DENV3 reference genome` -> consensus edge is DROPPED: the wrapper has no reference port, so its pileup runs without --reference (BAQ off), -a instead of -aa, -d 0 instead of 10000."
    rationale: 'Only Tool Shed wrapper for iVar consensus; no shed tool feeds iVar from a pileup dataset (split path would need repair plus an authored caller). Brief lists the pileup flags as source behavior preferred unless overridden and names only -aa -A -d 10000 -Q 0 (not --reference/BAQ); acceptance criteria (0.75/10, low-depth masking) are met. Probe on the full fixture: identical N mask, 1 called-position difference of 10,707, attributable entirely to BAQ; -d cap and -a/-aa have no effect on calls (aside from a zero-read sample yielding an empty-sequence record). Because calls do differ, the choice is surfaced to the expert as brief-change recommendation consensus-pileup-baq-off rather than settled silently; authoring a BAQ-on wrapper remains the alternative if the expert rejects it.'
    evidence:
      - ivar-consensus-wrapper-collected
      - consensus-variants-pileup-parity-probe
      - iuc-ivar-consensus-pileup-flags

  - id: per-base-depth-bedtools-genomecov-pin
    decided_by: advance-galaxy-draft-step
    step: per_base_depth
    decision: "per_base_depth = iuc/bedtools/bedtools_genomecoveragebed 2.31.1+galaxy0 (changeset d57471728f7b). State: input_type.input_type_select bam (input <- primer_trim/output_bam), report.report_select hist with max 0, d true; split false, strand '' (both), dz/five/three false. Output `output` (tabular, visible) is the public per_base_depth."
    rationale: "Identity pin confirmed by Tool Shed discovery at the newest version (= corpus pin). hist mode needed because the bg branch emits -bg, which bedtools rejects with -d (discovery bedtools-genomecov-wrapper-d-requires-hist-mode); max 0 set explicitly to match the probed command. Empirical byte parity with source on the full repo fixture and on an empty BAM; no transform step needed."
    evidence: [bedtools-genomecov-wrapper-collected, bedtools-genomecov-wrapper-d-requires-hist-mode, iwc-corpus-tool-pins]

  - id: variants-ivar-variants-pin
    decided_by: advance-galaxy-draft-step
    step: variants
    decision: "variants = iuc/ivar_variants 1.4.4+galaxy0 (changeset 5e5dfc9e71e2), accepting a recorded, quantified pileup deviation. State: input_bam <- primer_trim/output_bam; ref <- `DENV3 reference genome`; min_qual 20, min_freq 0.03 set explicitly (= source -q 20 -t 0.03, not exposed; decision public-consensus-parameters-only); output_format.choice tabular, no gtf (full unfiltered native table; no VCF, no pass_only - decision oq-variant-output). Output output_variants_tabular (visible) is the public variant_calls. Wrapper pileup is `-A -d 0 --reference REF -B -Q 0` vs source `-aa --reference REF -A -d 0 -Q 0`: BAQ forced off (-B) and no -aa; ivar -r omitted without a GTF."
    rationale: "Only Tool Shed iVar variants wrapper; no shed iVar caller consumes a pileup dataset, so exact BAQ-on parity needs an authored wrapper or a split path with an authored caller. The brief fixes `-q 20 -t 0.03` on its own pileup (met) and names the pileup flags only as source behavior preferred unless overridden. Existing probe (not re-run; rendered command equals probe chain b): all 346 source rows reproduced, 6 extra wrapper rows (2 PASS: 3137 A>G AF 0.24, 5591 G>T AF 0.91 - the same BAQ site as the consensus difference), 0 PASS flips, ALT_FREQ shifts up to 0.124; -aa moot for variant rows; -r byte-neutral without GFF. Because the table differs, the choice is surfaced to the expert as brief-change recommendation variants-pileup-baq-off rather than settled silently; authoring a BAQ-on variants wrapper is the alternative if rejected."
    evidence:
      - ivar-variants-wrapper-collected
      - consensus-variants-pileup-parity-probe
      - iuc-ivar-variants-pileup-flags-and-r

  - id: consensus-header-tp-sed-pin
    decided_by: advance-galaxy-draft-step
    step: consensus_header
    decision: "consensus_header = bgruening/text_processing/tp_sed_tool 9.11+galaxy0 (changeset 30b60202d990). State: infile <- consensus/consensus (ConnectedValue); code `/^>/s/Consensus_(.*)_threshold_.*/\\1.DENV3/`; adv_opts.adv_opts_selector basic. Output `output` (visible) is workflow output consensus_genome."
    rationale: "Template identity pin confirmed by environment discovery; newest version chosen over the IWC 9.5+galaxy3 pin (same command shape). Greedy `(.*)` captures the full sanitized element id up to the last `_threshold_`, so element ids with underscores survive. Empirically yields the source header `<sample>.DENV3` on real wrapper output and leaves sequence (or an empty sequence line) untouched."
    evidence:
      - tp-sed-wrapper-collected
      - consensus-variants-pileup-parity-probe

brief_change_recommendations:
  - id: consensus-pileup-baq-off
    raised_by: advance-galaxy-draft-step
    proposed_change: "Under Requirements and preferences, consensus pileup: accept the IUC ivar_consensus pileup `samtools mpileup -A -a -d 0 -Q 0` without a reference (BAQ off) in place of the source's `-aa --reference REF -A -d 10000 -Q 0` (BAQ on); or, if BAQ-on parity is required, say so explicitly (which would require authoring a consensus wrapper)."
    reason: 'Consensus calls differ: on the full denv3_test fixture the BAQ-off wrapper calls G>T at ref 5591 where the source keeps G and inserts T (+1 bp length); every other position and the whole N mask agree. The current brief text names -aa/-d 10000 but not BAQ, so it neither requires nor forbids this.'
    evidence:
      - consensus-variants-pileup-parity-probe
      - consensus-ivar-consensus-pin
    status: proposed
  - id: variants-pileup-baq-off
    raised_by: advance-galaxy-draft-step
    proposed_change: "Under Requirements and preferences, variants pileup (sibling of consensus-pileup-baq-off): accept the IUC ivar_variants pileup `samtools mpileup -A -d 0 --reference REF -B -Q 0` (BAQ forced off, no -aa) and `ivar variants -q 20 -t 0.03` without `-r` (no GFF) in place of the source's `-aa --reference REF -A -d 0 -Q 0 | ivar variants -q 20 -t 0.03 -r REF` (BAQ on); or, if BAQ-on parity is required, say so explicitly (which would require authoring a variants wrapper). The expert may decide both recommendations together: one BAQ policy for both pileups."
    reason: "Variant table differs: on the full denv3_test fixture the BAQ-off wrapper reproduces all 346 source rows and adds 6 (2 PASS: 3137 A>G AF 0.24, 5591 G>T AF 0.91; 4 non-PASS), with no PASS flips and ALT_FREQ shifts up to 0.124 on 177 shared rows. Under the source's own downstream summary filter (PASS, 0.2<AF<0.8; not carried) that is 3 rows vs 2. Dropping `-r` has no effect without a GFF. The brief text neither requires nor forbids BAQ."
    evidence:
      - consensus-variants-pileup-parity-probe
      - variants-ivar-variants-pin
    status: proposed
