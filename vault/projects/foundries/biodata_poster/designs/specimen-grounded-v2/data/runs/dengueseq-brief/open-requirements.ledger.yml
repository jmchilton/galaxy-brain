    raised_by: advance-galaxy-draft-step
    step: map_reads
    evidence: "2026-10-20 gxwf tool-search 'bwa mem' hits devteam~bwa~bwa_mem (higher scores are bwa-mem2 indexers/data managers); tool-versions newest 0.7.19+galaxy1; tool-revisions --latest -> changeset c598cbb8b019 (0.7.19 -> 1dfc975b48d5, the exemplar pin). Wrapper command (tools-iuc b9b16be49 tools/bwa/bwa-mem.xml, TOOL_VERSION 0.7.19, suffix 1): `bwa index -a auto` on history FASTA; `bwa mem -t ${GALAXY_SLOTS} -v 1 REF R1 R2 | samtools sort -O bam` (output_sort coordinate; samtools 1.21 requirement); illumina mode adds no scoring flags; rg do_not_set adds no -R."
