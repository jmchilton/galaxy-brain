    step: primer_trim
    evidence: "2026-10-20 gxwf tool-search 'ivar trim' top hit iuc~ivar_trim~ivar_trim (score 47.7; next iuc ivar_removereads); tool-versions newest 1.4.4+galaxy1; tool-revisions --latest -> sole changeset 6606a8c97889 (= IWC pe-wgs-ivar-analysis 0.4 pin). Wrapper command (tools-iuc b9b16be49 tools/ivar/ivar_trim.xml, TOOL_VERSION 1.4.4, suffix 1; requirements ivar 1.4.4, samtools 1.22, python 3.12, sed 4.9, viramp-hub 0.1.0 -> mulled-v2-dad95157f1e6ebaffc641a09503d0100710a1765:4dccdbb26cdfad6bb44e3adebe06dce653024d66-0 via galaxy-tool-util mulled-hash): `ln -s input_bed bed.bed && scheme-convert --to bed --bed-type ivar -o ivar.bed bed.bed && ln -s input_bam sorted.bam && ln -s bam_index sorted.bam.bai && ivar trim -i sorted.bam -b ivar.bed -x 0 -e -m -1 -q 20 -s 4 | samtools sort -o trimmed.sorted.bam -`. Docker probe (amd64 emulation) on the FULL repo fixture tests/test_inputs/denv3_test with repo DENV3.fasta/DENV3.bed: mapped with bwa 0.7.19 + `samtools view -bS -F 4 -F 2048 | samtools sort` (2,432,412 records, ~41 s); (a) source verbatim mapper.sh L29 `ivar trim -e -i X.bam -b DENV3.bed -p X.trimmed` + samtools sort/index on the raw CRLF BED vs (b) the rendered wrapper chain on LF and CRLF BEDs, all in the wrapper container (~33 s for all three). Results: 'Found 70 primers', auto min length 75 bp, identical per-primer read counts and summary stats (32.51% primer-trimmed; 24.08% dropped below 75 bp; 55.97% outside primer regions kept via -e); 1,846,698 records in each output, coordinate-sorted; SAM cols 1-11 md5-identical; only diff is XA:i (iVar primer index into the BED) because scheme-convert re-sorts records by start. DENV3.bed has CRLF line endings; wrapper output identical for CRLF and LF input. Scratch (full-fixture mapped.bam, src/wrapper trimmed BAMs reusable by the consensus parity probe): _scratch/primer_trim/out/."
