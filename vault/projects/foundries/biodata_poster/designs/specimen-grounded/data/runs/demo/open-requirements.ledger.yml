  - id: pin-source-tool-versions
    decided_by: workflow-brief-to-galaxy-template
    decision: "fastqc = devteam/fastqc 0.74+galaxy1 @ 2c64fded1286 (FastQC 0.12.1; state nogroup false, kmers 7; text_file hidden, unexposed); trim_reads = iuc/seqtk seqtk_trimfq 1.4+galaxy0 @ a019807f4e67 (seqtk 1.4; mode quality q 0.05 l 30) rather than the newer 1.5+galaxy0."
    rationale: "Brief: reproduce source behaviour; source tool versions are evidence (FastQC 0.12.1, seqtk 1.4). Matching them maximizes agreement with the source snapshot. FastQC state copied from the nearest IWC exemplar matches FastQC defaults and the source's --quiet-only call."
    evidence:
