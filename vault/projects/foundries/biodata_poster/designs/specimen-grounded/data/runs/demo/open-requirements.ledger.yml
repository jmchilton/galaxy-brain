  - id: guard-when-gate-blocks-consumers-unverified
    status: resolved
    blocking: false
    raised_by: workflow-brief-to-galaxy-template
    step: guard_ok
    unmet: "when validate_endedness exits non-zero, guard_ok, invert_skip_trim, fastqc and trim_reads never run, no fastqc_html / trimmed_reads datasets are produced, and the invocation ends in a state planemo reports as failed (source error() fails the whole run)"
    missing: "end-to-end Galaxy behaviour unverified: (a) a failed upstream job blocking a parameter-producing step (param_value_from_file) and the `when`-connected consumers; (b) whether planemo treats the resulting invocation (errored job, paused/unscheduled dependents) as a failure for expect_failure; (c) gating map_param_value itself with `when` (invert_skip_trim) is not IWC-observed (IWC gates analysis steps, not the boolean mapper). Fallbacks if (c) fails: trim_reads `when: $(inputs.when && inputs.guard)` with two connected booleans (not corpus-observed), or an explicit boolean-AND step. Verify with the phase-10 negative job."
    resolved_by: advance-galaxy-draft-step
    note: "Carries forward the obligation of fail-guard-gate-unverified-no-corpus-precedent after N3 removal. Resolved by the phase 5 iter 2 guard spike (evidence/guard-spike/, planemo 0.75.47, Galaxy master 26.1). (a) With the mixed sheet the errored validate_endedness leaves guard_ok (param_value_from_file) paused. invert_skip_trim and both `when`-gated consumers are never scheduled (no jobs, no outputs), and Galaxy fails the invocation with FailureReason.dataset_failed. (b) planemo reports that test as status `error`. It never reports success, because planemo has no workflow `expect_failure` support; the residual moved to mixed-endedness-expect-failure-test. (c) With the valid sheet, `when` on map_param_value itself works: invert_skip_trim ran under guard_ok, and its output gated trim_stand_in, which ran. No fallback (two-boolean `when` / AND step) is needed. The spike used tp_awk_tool stand-ins for fastqc and trim_reads."

  - id: mixed-endedness-expect-failure-test
    status: open
    blocking: false
    raised_by: workflow-brief-to-galaxy-template
    step: validate_endedness
    unmet: "orchestrator constraint 3: mixed SE/PE rejection must be assertable in phases 7/8 via a gxwf/planemo test job with `expect_failure: true` whose samplesheet has one sample with both an {unpaired} and a {forward,reverse} run (rows share the sample value)"
    missing: "test plan and test file not yet written. Keep the failing path assertable: do not convert the guard to a soft skip, and keep validate_endedness as the only failing step. Planemo discovers tests only as <workflow>.gxwf-tests.yml (spike README). The source has no mixed-endedness fixture; the negative fixture must be synthesized (e.g. reuse source test reads under one sample value). [iter 2] planemo 0.75.47 (latest PyPI; also planemo main @ d171869b) ignores `expect_failure` in workflow tests. Any unsuccessful invocation becomes status `error` (planemo/runnable.py structured_data), so this job can never report passed under planemo, even though gxwf validate-tests accepts it (it requires an `outputs:` key, `outputs: {}` works). Phases 7/8/10 must choose: keep the expect_failure job, which documents and gxwf-validates but is expected to show as 1 error in planemo and must be interpreted, not counted as a pass, OR assert rejection outside planemo (e.g. a Galaxy API/bioblend check that the invocation fails and only validate_endedness errors), OR wait for planemo support. Do not soften the guard to make it pass."
    resolved_by: null
    note: "Rejection behaviour itself is verified at runtime (mixed-endedness-rejection resolved, evidence/guard-spike/). This entry now tracks only assertability inside the phase 7/8 test file / phase 10 runner (orchestrator constraint 3). [phase 7 workflow-brief-to-galaxy-test-plan] Plan keeps the case as mixed_endedness_rejection__NOT_PLANEMO_RUNNABLE (expect_failure: true, outputs: {}, fixture test-data-refs proposed_fixtures.mixed_endedness_rejection) and routes it to a separate non-discovered file (suggested galaxy-workflow.mixed-endedness-rejection.expect-failure.yml; planemo auto-discovers only galaxy-workflow.gxwf{-tests,_tests,-test,_test}.{yml,yaml,json}), gxwf validate-tests only. Runtime coverage = evidence/guard-spike/ (awk code byte-identical to shipped validate_endedness). A green planemo run does not cover this criterion. Stays open: no passing automated assertion exists."

