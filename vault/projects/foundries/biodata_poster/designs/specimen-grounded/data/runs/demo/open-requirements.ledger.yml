    status: resolved
    blocking: false
    raised_by: workflow-brief-to-galaxy-template
    step: regroup_by_sample
    unmet: "regroup_by_sample (__APPLY_RULES__, Identity-pinned) turns samplesheet (sample_sheet:paired_or_unpaired) into list:list:paired_or_unpaired keyed sample/run/role via add_column_metadata identifier0, identifier1, add_column_from_sample_sheet_index 0, mapping list_identifiers [2, 0] + paired_or_unpaired_identifier [1], no sort"
