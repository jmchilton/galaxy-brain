  - id: planemo-workflow-tests-ignore-expect-failure
    raised_by: advance-galaxy-draft-step
    evidence: "planemo 0.75.47 site-packages: no reference to expect_failure under planemo/ (only galaxy/tool_util/verify/interactor.py, which serves tool tests). planemo/runnable.py RunResponse.structured_data sets status 'error' whenever was_successful is false. Planemo main @ d171869b (2026-10-11) is the same: the only hits are docs and tool-test XML, and 0.75.47 is the latest PyPI release. Spike test 1 with expect_failure: true -> 'guard.gxwf.yml_1: failed', summary num_errors 1. gxwf validate-tests 1.13.1 accepts expect_failure but rejects a test without `outputs:` (`outputs: {}` passes)."
    impact: "Orchestrator constraint 3 (assert mixed SE/PE rejection via an expect_failure job) cannot produce a green planemo result. Phase 7/8/10 must treat that job's error as the expected outcome or assert outside planemo (obligation mixed-endedness-expect-failure-test)."

decisions:
  - id: samplesheet-input-shape
    decided_by: workflow-brief-to-galaxy-interface
    decision: "Input `samplesheet` = collection sample_sheet:paired_or_unpaired, one element per sheet row (run), inner {forward,reverse} or {unpaired}, element datatype fastqsanger.gz, column_definitions [{name: sample, type: string, optional: false, validators: [{type: regex, expression: '^\\S+$'}]}]."
    rationale: "Keeps source sample-sheet semantics in-workflow (expert review: merge multi-row samples, reject mixed endedness, no whitespace in names); paired_or_unpaired carries per-row endedness. Fallback list:list:paired_or_unpaired only on recorded toolchain failure."
    evidence:
      - sheet-rows-are-runs-grouped-by-sample
      - source-test-data-shape

  - id: gzip-name-constraint-as-datatype
    decided_by: workflow-brief-to-galaxy-interface
    decision: "Express the source's *.fastq.gz / *.fq.gz filename constraint as element datatype fastqsanger.gz."
    rationale: "Galaxy element identifiers carry no file extension; datatype is the Galaxy-native gzip-FASTQ restriction."
    evidence:
      - quality-encoding-unstated

  - id: skip-trim-boolean-input
    decided_by: workflow-brief-to-galaxy-interface
    decision: "Input `skip_trim` = boolean, default false; true suppresses trimming and leaves fastqc_html unchanged."
    rationale: "Brief: keep the trim switch (expert review); source params.skip_trim default false."
    evidence: []

  - id: outputs-sample-keyed-nested
    decided_by: workflow-brief-to-galaxy-interface
    decision: "Outputs `fastqc_html` (html) and `trimmed_reads` (fastqsanger.gz), both list:list:paired_or_unpaired keyed <sample>/<run id>/<forward|reverse|unpaired>; no flatten to source <sample>_<n> naming."
    rationale: "Brief treats publish layout as reference only; nested map-over shape keeps pairing, avoids a relabel step, gives addressable element_tests. Source correspondence: n-th leaf in run-then-mate order <-> <sample>_<n>."
    evidence:
      - analyses-are-per-file

  - id: no-extra-checkpoints
    decided_by: workflow-brief-to-galaxy-interface
    decision: "Promote no checkpoint outputs beyond fastqc_html and trimmed_reads; FastQC zip/raw data stays unexposed."
    rationale: "Expert: reports and trimmed reads only; HTML carries assertable content; trimmed reads compare to snapshot after decompression."
    evidence:
      - snapshot-pins-trimmed-md5-not-reports

  - id: regroup-via-apply-rules-sample-sheet-column
    decided_by: workflow-brief-to-galaxy-data-flow
    decision: "Node N1 regroup_by_sample: Apply Rules over samplesheet, outer = sample column, middle = run identifier, inner = paired_or_unpaired role; no sort rule. Removed (identity) under the list:list:paired_or_unpaired fallback input."
    rationale: "Implements the brief's multi-row merge in-workflow with one built-in step; row order preserved matches source groupTuple order."
    evidence:
      - apply-rules-reads-sample-sheet-columns
      - sheet-rows-are-runs-grouped-by-sample

  - id: validate-after-regroup-with-dependency-gate
    decided_by: workflow-brief-to-galaxy-data-flow
    decision: "Mixed-endedness rejection = N2 validate_endedness, a single whole-collection reduction over the regrouped collection that fails the job; N3 gate_on_validation passes the regrouped collection through only via a data dependency on N2's output, and both fastqc and trim_reads consume N3's output. No per-sample mapping, no filtering of bad samples."
    rationale: "Source validateInputSamplesheet error()s the entire run; per-sample checks or filters would leave partial outputs or silently improve the source. Works unchanged on the fallback input shape."
    evidence:
      - split-paired-unpaired-rejects-nested-and-sample-sheet

  - id: qc-and-trim-parallel-mapover
    decided_by: workflow-brief-to-galaxy-data-flow
    decision: "fastqc and trim_reads map independently over the gated regrouped collection; no edge from trimming to QC; FastQC zip/raw outputs left unconnected; no flatten or relabel to source <sample>_<n> names."
    rationale: "Brief: QC on untrimmed reads only, trimming does not feed QC, not pair-aware; interface decision outputs-sample-keyed-nested."
    evidence:
      - analyses-are-per-file

  - id: skip-trim-when-gate
    decided_by: workflow-brief-to-galaxy-data-flow
    decision: "trim_reads (and the conditional compress placeholder, if emitted) is gated by a step `when` derived from NOT skip_trim; fastqc is unconditional; no pick_value merge (nothing downstream consumes trimmed_reads)."
    rationale: "Source `if (!params.skip_trim) SEQTK_TRIM(...)`; conditional-run-optional-step pattern. Inversion mechanism left to skip-trim-boolean-inversion."
    evidence:
      - skipped-mapped-step-yields-null-elements

  - id: nearest-iwc-exemplar-mgnify-qc-se
    decided_by: compare-against-iwc-exemplar
    decision: "Nearest IWC exemplar = amplicon/amplicon-mgnify/mgnify-amplicon-pipeline-v5-quality-control-single-end, confidence Medium (read-QC domain, FastQC family, parallel raw-QC + trim motif; differs in input topology list vs mixed sample sheet and trimmer). Relevant subgraph (native steps 0, 8, 9) emitted as iwc-exemplar.gxwf.yml. Cross-domain pattern excerpts: sra-manifest-to-concatenated-fastqs (multi-run regroup), rnaseq-pe (skip inversion). No High exemplar exists."
    rationale: "Feature hierarchy: domain and DAG motif match beat short-read-qc-trimming, whose single fastp step merges QC and trim and has no parallel QC branch."
    evidence:
      - iwc-parallel-raw-qc-and-trim-motif

  - id: skip-trim-invert-via-map-param-value
    decided_by: compare-against-iwc-exemplar
    decision: "N6 invert_skip_trim = explicit map_param_value boolean->boolean step (true->false, false->true) feeding trim_reads `when` input; trim_reads uses when: $(inputs.when). $(!inputs.when) is fallback only."
    rationale: "Corpus-observed idiom; negated when expressions never appear in IWC. Chooses between the data-flow brief's options; no scope change."
    evidence:
      - iwc-skip-boolean-inversion-idiom
      - gxwf-validate-accepts-when-connection-and-negation

  - id: keep-design-over-iwc-idioms
    decided_by: compare-against-iwc-exemplar
    decision: "Do not adopt these IWC idioms that conflict with the brief: per-sample concatenation of runs (sra-manifest cat_multi_datasets), SE/PE split into separate workflows or branches, when-derived soft skip in place of the fail guard, post-trim FastQC, MultiQC, exposed trimmer thresholds."
    rationale: "Brief requires source behavior: per-file QC/trim with per-run files kept, one mixed sheet, error() on mixed endedness, QC on untrimmed only, seqtk defaults not exposed, MultiQC excluded (expert)."
    evidence:
      - iwc-multi-run-regroup-via-apply-rules
      - iwc-endedness-handled-by-split-not-mixed
      - iwc-no-invocation-fail-guard

  - id: guard-via-stock-awk-and-when-gating
    decided_by: workflow-brief-to-galaxy-template
    decision: "Realize data-flow N2 as four stock/built-in steps: flatten_for_guard (__FLATTEN__, ':') -> guard_identifiers (collection_element_identifiers) -> validate_endedness (tp_awk_tool; exit 1 naming the sample on mixed endedness, else print `true`) -> guard_ok (param_value_from_file boolean). Drop data-flow N3 (pass-through gate). guard_ok/boolean_param feeds `when` of fastqc and of invert_skip_trim; fastqc and trim_reads consume regroup_by_sample/output directly."
    rationale: "Orchestrator constraints 1 and 2: no custom tool re-emitting the nested collection; prefer stock wrappers runnable in planemo-managed Galaxy. A failed guard job leaves its consumers unschedulable, so the guard still fails the invocation (unlike the IWC derived-boolean soft skip, the awk step exits non-zero rather than emitting false). Refines decision validate-after-regroup-with-dependency-gate (same placement and whole-collection reduction; dependency via `when` instead of a pass-through)."
    evidence:
      - tp-awk-tool-fails-on-nonzero-exit
      - guard-chain-wrappers-corpus-observed
      - split-paired-unpaired-rejects-nested-and-sample-sheet

  - id: trim-gate-via-guarded-map-param-value
    decided_by: workflow-brief-to-galaxy-template
    decision: "Combine 'guard passed' with NOT skip_trim by gating invert_skip_trim (map_param_value true->'false', false->'true', on_unmapped fail) on guard_ok with `when: $(inputs.when)`; trim_reads `when` <- invert_skip_trim/output_param_boolean with `when: $(inputs.when)`. No separate boolean-AND or expression step (extra steps for trim gating: 0 beyond the map_param_value already decided)."
    rationale: "Orchestrator constraint 1 (IWC idiom: map_param_value inversion + `when: $(inputs.when)`, count extra expression steps). Keeps every `when` literally $(inputs.when) as in all 155 IWC uses; trim still transitively depends on the guard."
    evidence:
      - iwc-skip-boolean-inversion-idiom
      - gxwf-validate-accepts-when-connection-and-negation

  - id: no-compress-step
