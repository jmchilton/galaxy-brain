      - iwc-parallel-raw-qc-and-trim-motif

  - id: orchestrator-template-constraints-honoured
    decided_by: workflow-brief-to-galaxy-template
    decision: "All four orchestrator constraints are honoured in the draft: (1) no pass-through of the nested collection, guard boolean drives `when`, trim via guarded map_param_value; (2) stock tp_awk_tool guard, no user-defined tool; (3) failing path kept assertable (validate_endedness is the single failing step; obligation mixed-endedness-expect-failure-test); (4) no per-sample concatenation (runs remain separate leaves)."
