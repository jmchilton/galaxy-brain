  - id: endedness-guard-fails-invocation-before-consumers
    raised_by: advance-galaxy-draft-step
    evidence: "evidence/guard-spike/ test 1 (mixed S1 = paired S1_T1 + unpaired S1_T2) jobs: __APPLY_RULES__ ok, __FLATTEN__ ok, collection_element_identifiers ok, tp_awk_tool error (exit 1, empty job stdout/stderr, so not a conda-activation failure), param_value_from_file paused. invert_skip_trim, qc_stand_in and trim_stand_in were in step state new with no jobs. planemo-excerpt.log shows 'Failed to schedule WorkflowInvocation ... on invert_skip_trim ... reason=FailureReason.dataset_failed' after planemo's last poll (out.json still says invocation_state ready). Test 0 (valid) ran all 16 jobs ok, and both gated consumers produced outputs. The guard message (in the errored outfile, since awk --sandbox forbids stderr) is 'Error: Multiple runs of a sample must be of the same datatype i.e. single-end or paired-end: S1' (awkcheck/ with biocontainers gawk 5.3.1 and the wrapper flags)."
