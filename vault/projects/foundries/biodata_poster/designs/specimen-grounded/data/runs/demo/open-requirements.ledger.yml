  - id: validate-endedness-awk-strict-three-field
    decided_by: advance-galaxy-draft-step
    decision: "validate_endedness = bgruening/text_processing tp_awk_tool 9.11+galaxy0 @ 30b60202d990 (latest installable revision; identity pin confirmed against Tool Shed get_repository_revision_install_info). state.variables = []. state.code: split each line on ':'; require exactly 3 fields else print 'Error: unexpected identifier (want sample:run:role)' and fail; role forward/reverse -> paired set, unpaired -> single set, any other role -> error. In END, for each sample in both sets print the source validateInputSamplesheet message naming the sample; exit 1 if any error, else print exactly `true`. No single quotes in code."
    rationale: "Implements the _plan_state with the 2-field fallback removed, because the flatten keeps the role level (discovery flatten-paired-or-unpaired-keeps-role-level). Strict parsing fails loudly instead of mis-grouping when a name contains ':'. Code is byte-identical to the passing spike."
