    resolved_by: advance-galaxy-draft-step
    note: "Narrowed residual of sample-sheet-support-in-toolchain. Resolved by advance-galaxy-draft-step (phase 5 iter 1): regroup_by_sample bound to __APPLY_RULES__ 1.1.0 with exactly the planned rules/mapping; runtime spike evidence/apply-rules-spike/README.md (planemo 0.75.47, Galaxy master 26.1) passed 1/1 regrouping a sample_sheet:paired_or_unpaired (S1 two paired runs, S2 one unpaired run, interleaved rows) into list:list:paired_or_unpaired S1/{S1_T1,S1_T2}/{forward,reverse}, S2/S2_T1/unpaired with correct leaf contents (discovery apply-rules-sample-sheet-regroup-runs). The list:list:paired_or_unpaired input fallback is not needed. gxwf 1.13.1 also validates this step's tool state once tool_version is pinned (discovery gxwf-validates-apply-rules-when-version-pinned), so the 'Tool Shed 404' part of `missing` applied only to the unpinned TODO version. Residual not checked at runtime: within-sample/outer element order (no test-schema ordering assertion); rests on Galaxy source (row-order dict build). [iter 2: status corrected open -> resolved; iter 1 set resolved_by and this note but left status open.]"

