    resolved_by: null
    note: "[phase 7 workflow-brief-to-galaxy-test-plan] Correction to `missing`: snapshot md5s are of DECOMPRESSED content (phase 6 reproduction, test-data-refs.json checksum_semantics). Galaxy/planemo `checksum:` hashes raw output bytes and ignores `decompress`, so galaxy-test-plan.yml plans per-leaf compare:diff + decompress: true against evidence/seqtk-reproduction/trimmed_*.fastq.gz (decompressed md5 == snapshot), plus decompressed has_n_lines and a trimmed-only has_line. Stays open until phase 10 runs the wrapper."

discoveries:
  - id: sheet-rows-are-runs-grouped-by-sample
    raised_by: workflow-brief-to-galaxy-interface
    evidence: "subworkflows/local/utils_nfcore_demo_pipeline/main.nf L102-120: samplesheetToList -> per-row [meta.id, meta+single_end, files] -> groupTuple() -> validateInputSamplesheet -> fastqs.flatten()"
    impact: "Galaxy input must be one element per row with a sample grouping key; a regroup step realizes the merge."

  - id: analyses-are-per-file
    raised_by: workflow-brief-to-galaxy-interface
    evidence: "modules/nf-core/fastqc/main.nf renames each file to <sample>_<n> and emits one html per file; modules/nf-core/seqtk/trim/main.nf loops `seqtk trimfq $f | gzip --no-name > <sample>_$(basename $f)`"
    impact: "Per-dataset map-over is computationally equivalent; per-sample grouping affects organization/naming only."

  - id: snapshot-pins-trimmed-md5-not-reports
    raised_by: workflow-brief-to-galaxy-interface
    evidence: "tests/default.nf.test.snap lists md5 for 6 trimmed .fastq.gz (gzip --no-name); tests/.nftignore excludes fastqc/**/*_fastqc.{html,zip}"
    impact: "Report content has no source expected value; trimmed reads compare by decompressed content (expert review)."

  - id: source-test-data-shape
    raised_by: workflow-brief-to-galaxy-interface
