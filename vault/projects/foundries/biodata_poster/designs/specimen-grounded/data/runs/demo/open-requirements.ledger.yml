  - id: regroup-rules-bound-as-planned
    decided_by: advance-galaxy-draft-step
    decision: "regroup_by_sample = __APPLY_RULES__ 1.1.0, state.rules = {rules: [add_column_metadata identifier0, add_column_metadata identifier1, add_column_from_sample_sheet_index 0], mapping: [list_identifiers [2, 0], paired_or_unpaired_identifier [1]]}, no sort rule. tool_version 1.1.0 from the populated tool cache (~/.galaxy/tool_info_cache entry __APPLY_RULES__ 1.1.0) and Galaxy dev apply_rules.xml."
