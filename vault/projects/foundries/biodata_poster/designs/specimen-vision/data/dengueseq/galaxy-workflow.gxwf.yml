class: GalaxyWorkflow
label: DengueSeq DENV3 Illumina amplicon consensus
doc: |
  Per-sample DENV3 reference-based consensus, iVar variant calls and per-base depth from
  DengueSeq amplicon Illumina paired-end reads (Vogels et al. 2024; DENV_pipeline v1.0,
  mapper.sh, single known serotype DENV3). Map (BWA-MEM) -> drop unmapped/supplementary
  -> iVar primer trim -> {consensus, variants, per-base depth}. No read trimming before
  mapping; no serotype calling, multi-reference loop, coverage gate or plots.
inputs:
  Paired-end reads:
    type: collection
    collection_type: list:paired
    format: fastqsanger.gz
    doc: One list:paired element per sample; element identifier = sample ID (e.g. SRR25366733). Forward/reverse Illumina FASTQ (fastqsanger.gz; fastqsanger also accepted).
  DENV3 reference genome:
    type: data
    format: fasta
    doc: DENV3 reference FASTA (GenBank NC_001475.2, 10,707 bp); pinned DENV_pipeline v1.0 DENV3.fasta.
  DENV3 primer BED:
    type: data
    format: bed
    doc: DengueSeq DENV3 primer positions on NC_001475.2 (35 pairs, 70 records; 6 columns, pool in col 5). Must match the wet-lab scheme and the reference.
  Consensus frequency threshold:
    type: float
    default: 0.75
    doc: "iVar consensus -t: minimum allele frequency to call a consensus base (source default 0.75)."
  Consensus minimum depth:
    type: int
    default: 10
    doc: "iVar consensus -m: minimum depth to call a consensus base; lower-depth positions are masked with N (source default 10)."
outputs:
  primer_trimmed_bam:
    outputSource: primer_trim/output_bam
  consensus_genome:
    outputSource: consensus_header/output
  variant_calls:
    outputSource: variants/output_variants_tabular
  per_base_depth:
    outputSource: per_base_depth/output
steps:
  map_reads:
    label: map_reads
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/bwa/bwa_mem/0.7.19+galaxy1
    tool_version: 0.7.19+galaxy1
    tool_shed_repository:
      changeset_revision: c598cbb8b019
      name: bwa
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      fastq_input|fastq_input1: Paired-end reads
      reference_source|ref_file: DENV3 reference genome
    out:
      - id: bam_output
        hide: true
    state:
      reference_source:
        reference_source_selector: history
        ref_file:
          __class__: ConnectedValue
        index_a: auto
      fastq_input:
        fastq_input_selector: paired_collection
        fastq_input1:
          __class__: ConnectedValue
        iset_stats: ""
      rg:
        rg_selector: do_not_set
      analysis_type:
        analysis_type_selector: illumina
      output_sort: coordinate
  filter_mapped_primary:
    label: filter_mapped_primary
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: map_reads/bam_output
    out:
      - id: outputsam
        hide: true
    state:
      input:
        __class__: ConnectedValue
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: "no"
          cond_rg:
            select_rg: "no"
          cond_expr:
            select_expr: "no"
          quality: null
          library: ""
          cigarcons: null
          inclusive_filter: null
          exclusive_filter:
            - "4"
            - "2048"
          exclusive_filter_all: null
          tag: ""
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1
            seed: null
        output_options:
          reads_report_type: retained
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: "no"
  primer_trim:
    label: primer_trim
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ivar_trim/ivar_trim/1.4.4+galaxy1
    tool_version: 1.4.4+galaxy1
    tool_shed_repository:
      changeset_revision: 6606a8c97889
      name: ivar_trim
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_bam: filter_mapped_primary/outputsam
      primer|input_bed: DENV3 primer BED
    out:
      - id: output_bam
    state:
      input_bam:
        __class__: ConnectedValue
      primer:
        source: history
        input_bed:
          __class__: ConnectedValue
      amplicons:
        filter_by: ""
      primer_pos_wiggle: 0
      inc_primers: true
      min_qual: 20
      window_width: 4
      trimmed_length:
        filter: auto
  consensus:
    label: consensus
    doc: |
      iVar consensus on its own pileup of the primer-trimmed BAM (-t / -m from workflow parameters;
      -q 20, -c 0.8, low-depth positions as N). The IUC wrapper runs `samtools mpileup -A -a -d 0 -Q 0`
      without a reference (BAQ off), unlike the source's `-aa --reference REF -A -d 10000 -Q 0` (BAQ on).
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ivar_consensus/ivar_consensus/1.4.4+galaxy0
    tool_version: 1.4.4+galaxy0
    tool_shed_repository:
      changeset_revision: 1c5448133894
      name: ivar_consensus
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_bam: primer_trim/output_bam
      min_freq: Consensus frequency threshold
      min_depth: Consensus minimum depth
    out:
      - id: consensus
        hide: true
    state:
      input_bam:
        __class__: ConnectedValue
      min_qual: 20
      min_freq:
        __class__: ConnectedValue
      min_indel_freq: 0.8
      min_depth:
        __class__: ConnectedValue
      depth_action: -n N
  consensus_header:
    label: consensus_header
    doc: |
      Rename the consensus FASTA header from the IUC ivar_consensus form
      `>Consensus_<element_id>_threshold_<t>_quality_<q>` to the source's `>{element_id}.DENV3`
      (mapper.sh `ivar consensus -i ${fname}.DENV3`). Sequence lines pass through unchanged; a zero-read
      sample's empty-sequence record is renamed the same way. Output format follows the input (fasta).
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_sed_tool/9.11+galaxy0
    tool_version: 9.11+galaxy0
    tool_shed_repository:
      changeset_revision: 30b60202d990
      name: text_processing
      owner: bgruening
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      infile: consensus/consensus
    out:
      - id: output
    state:
      infile:
        __class__: ConnectedValue
      code: /^>/s/Consensus_(.*)_threshold_.*/\1.DENV3/
      adv_opts:
        adv_opts_selector: basic
  variants:
    label: variants
    doc: |
      iVar variants on its own pileup of the primer-trimmed BAM (-q 20, -t 0.03; tabular only, full unfiltered
      table, no GTF). The IUC wrapper runs `samtools mpileup -A -d 0 --reference REF -B -Q 0` (BAQ forced off,
      -a not set) and passes ivar -r only with a GTF, unlike the source's `-aa --reference REF -A -d 0 -Q 0`
      (BAQ on) with -r REF. -r has no effect without a GFF.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ivar_variants/ivar_variants/1.4.4+galaxy0
    tool_version: 1.4.4+galaxy0
    tool_shed_repository:
      changeset_revision: 5e5dfc9e71e2
      name: ivar_variants
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_bam: primer_trim/output_bam
      ref: DENV3 reference genome
    out:
      - id: output_variants_tabular
    state:
      input_bam:
        __class__: ConnectedValue
      ref:
        __class__: ConnectedValue
      min_qual: 20
      min_freq: 0.03
      output_format:
        choice: tabular
  per_base_depth:
    label: per_base_depth
    doc: |
      bedtools genomecov per-base depth of the primer-trimmed BAM at every reference position, zero depth
      included (chrom, 1-based pos, depth; headerless). Wrapper renders `bedtools genomecov -ibam X -max 0 -d`;
      `report_select hist` is required because the bg branch emits -bg, which bedtools rejects with -d.
      Output format is tabular (wrapper change_format on hist).
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_genomecoveragebed/2.31.1+galaxy0
    tool_version: 2.31.1+galaxy0
    tool_shed_repository:
      changeset_revision: d57471728f7b
      name: bedtools
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_type|input: primer_trim/output_bam
    out:
      - id: output
    state:
      input_type:
        input_type_select: bam
        input:
          __class__: ConnectedValue
      report:
        report_select: hist
        max: 0
      split: false
      strand: ""
      d: true
      dz: false
      five: false
      three: false
