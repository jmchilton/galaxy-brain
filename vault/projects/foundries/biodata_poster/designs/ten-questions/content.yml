form:
  label: "Workflow brief · open questions, low confidence first"
  cols: ["No.", "Question · what it proposed", "You"]
  source: "DengueSeq DENV3 (dengue virus) [2]: the paper and its linked code (DENV_pipeline v1.0), chosen after the skills were built."
  low_key: "thin evidence"
  footer: >-
    *9 accepted as proposed · 1 corrected* · 5 LOW · brief as proposed #h8("560f0bfa") #arr as reviewed #h8("e52aca4e")
  legend: "“You” was one of us, an author (J.C.), on one paper. One run, not a sample."

# Shortened questions (≤ 70 characters). Originals: data/run.json `questions[].question`; table in README.
questions:
  1:
    q: "Which primer scheme amplified the test sample?"
    p: "DENV3 only: trim with the DENV3 primer BED, as the pipeline does."
    e: "You said “DENV3 DengueSeq primer scheme”; the paper says Florida validated pan-serotype."
  2:
    q: "Is the test sample's metadata correct?"
    p: "Take your word for it; check SRA when fetching data."
    fix: "yes. You checked ENA: MiSeq, paired, 183,398 read pairs."
  3:
    q: "Compare the consensus with a published genome?"
    p: "Yes, if one exists; else structural checks only."
  4:
    q: "Which primer BED and reference are authoritative?"
    p: "The pinned DENV_pipeline v1.0 files."
  5:
    q: "Produce a genome-completeness metric?"
    p: "No; consensus and depth already show it."
    mark: cut
  6:
    q: "Consensus minimum depth: 10 or 20?"
    p: "10, adjustable."
    e: "Methods, code and Fig. S1: 10. Results report coverage at 20#times."
    tag: "Which applies is your call, not a model's."
  7:
    q: "Full iVar variant table, or the pipeline's filtered one?"
    p: "The full table (minimum quality 20, frequency 0.03)."
    mark: cut
  8:
    q: "Emit outputs however little of the genome is covered?"
    p: "Yes: always emit all outputs."
    mark: open
  9:
    q: "Keep the primer-trimmed alignment (BAM) as an output?"
    p: "Yes, as a secondary output."
  10:
    q: "Use the repository's DENV3 fixture as a second test?"
    p: "Yes, alongside SRR25366733; not yet run."

wiki:
  label: "Where the proposals came from"
  chain: ["420 notes", "56 Molds", "69 skills"]
  body: >-
    Galaxy changes faster than training data, so that knowledge lives in a wiki [3]
    of Molds (one per action), compiled into skills. One rule, copied verbatim:
  hashline: >-
    `workflow-brief-design` #h8("88237d66") = skill copy #h8("88237d66") · build #h8("f275059e") · compiling runs no model

tools:
  heading: "Then the tools decided."
  rows:
    - name: "Tool Shed"
      stamp: "7/7 FOUND"
      detail: "Galaxy's tool registry: every step pinned to a revision"
    - name: "gxwf"
      stamp: "PASS"
      detail: "workflow validator: tool state 7/7, connections valid"
    - name: "Planemo"
      stamp: "PASS"
      detail: "test runner: 7/7 jobs ok, Galaxy #h8(\"b18269a1\") (not pinned)"
  why: >-
    *Why tools, not instructions?* In the companion Orbit study (open-weight models), a rule given
    only in the prompt was followed in 0 of 15 graded runs [1, p. 18].
  provenance: "The Foundry records which knowledge built each skill; Galaxy records what ran."
  ask: >-
    Also being checked: nf-core/rnaseq and nf-core/atacseq rebuilds (Nekrutenko lab),
    Foundry-validated; atacseq partial.

open:
  heading: "Five things stayed open."
  items:
    - kind: open
      ref: 8
      text: "A zero-read sample gets an empty consensus, not 10,707 N."
    - kind: open
      ref: new
      text: "Consensus: Galaxy's wrapper skips BAQ (base alignment quality); the paper's code doesn't."
    - kind: open
      ref: new
      text: "Variants: the same BAQ difference."
    - kind: cut
      ref: 5
      text: "Completeness metric: cut by your answer."
    - kind: cut
      ref: 7
      text: "Filtered variant table: cut by your answer."
  new_key: "changes the build proposed to you"
  tally: "19 raised; 14 resolved, 5 written down."
  notyet: "Not yet: replicating the paper's results; the second test (#q(10))."

recompile:
