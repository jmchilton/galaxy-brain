# All poster prose. Strings are Typst markup: *bold*, _italic_, `code`, and these helpers:
#   #arr (arrow), #times (multiplication sign), #h8("hash") (8-char hash in mono), #q(n) (question pill)
# Escape a literal hash sign as \# (use single YAML quotes then).
# Word budget (build.py): 550 words, not counting `meta`, `board` and the non-printed keys mark/kind/ref.
# Run facts that also live in data/run.json are cross-checked by build.py (ledger counts, hashes, LOW count).

