    - "**PR #701:** one test-assertion defect in 3 runs; one note fixed, 8 skills regenerated."
    - "**Upstream fixes forced:** IUC #8808 and usegalaxy-tools #1791 (merged); galaxy #24435 (open); galaxy-tool-util-ts #204/#205, shipped in gxwf 1.15.0."
  coda: Learning happens in the wiki, not in model weights.
