    ask: true
    title: "[[ASK]] nf-core/rnaseq + atacseq"
    body: Foundry-validated rebuilds on pinned IUC / Tool Shed tools. Results pending sign-off.

whyTools:
  title: Why the interchanges decide
  stat: "0 of 15"
  statText: graded runs in the Orbit study followed a rule given only in the prompt. “Skills are guidance, not enforcement.”
  cite: Baker et al. 2026, pp. 16, 18
  ci: "**30** pattern workflows run `planemo test` against Galaxy 26.1 in CI: green."

journey:
  title: "Journey record: DengueSeq DENV3"
  cite: Vogels et al. 2024, BMC Genomics · dengue virus serotype-3 amplicon sequencing
  heldOut: The paper was chosen **after** the skills were built, so it is genuinely held out.
  route: [Paper, Workflow brief, Expert review, Galaxy workflow]
  stamps:
    - { k: Tool Shed, v: 7 tools pinned }
    - { k: gxwf validate, v: "`--strict`: pass" }
    - { k: planemo test, v: green }
  notYet:
    - A second, larger test case is defined but not run.
    - No replication of the paper's results yet.
  ledgerTitle: "Service notice: open-requirements ledger"
  gloss:
    low-coverage-and-empty-bam-behavior: "zero-read sample: empty consensus"
    serotype-coverage-plane-not-carried: serotype + completeness metric cut
    filtered-variant-frequency-table-not-carried: filtered variant table cut
    consensus-baq-deviation-check-on-test-sample: deviation unchecked on test sample
    variants-baq-deviation-check-on-test-sample: same, for variant calls
  alsoTitle: "Also on this line: *A. fumigatus* RNA-seq"
  also: >-
    Hokken et al. About 60 steps compiled from methods text and run on public Galaxy; fold changes
    agree with the paper. Already published: Baker et al. 2026, Fig. 6A.
  # Build fails if the ledger file disagrees, so the text above stays true.
  expect: { entries: 19, open: 5, dropped: 2 }

key:
  title: Map key
  items:
    - sym: lines
      text: "**Lines are source types.** 13 pipelines; their routes share the downstream stations."
    - sym: station
      text: "**A station is a Mold:** an action-sized note declaring the schemas, patterns and command contracts it needs, compiled into a skill."
    - sym: interchange
      text: "**An interchange is a deterministic tool.** The model interprets and repairs; the tools judge."
    - sym: track
      text: "**Solid:** a public demo cleared this stage. **Dashed:** none has yet. **Hollow:** planned."
    - sym: notice
      text: "**A notice is the ledger:** what the workflow doesn't yet reproduce, written down."

depot:
  title: The depot
  body: >-
    Karpathy's “LLM wiki” is a markdown knowledge base an LLM maintains. In the Foundry, notes
    declare what they are, and each Mold compiles into a skill with a **provenance record**: a hash of every source note.
  counts:
    - [420, notes]
    - [56, Molds]
    - [13, pipelines]
    - [54, patterns]
    - [36, CLI pages]
    - [16, schemas]
    - [69, skills]
    - [51, eval oracles]
    - [46, scenarios]
  footnote: "Counts at galaxyproject/foundry origin/main, 2026-10-24. 27 of the 56 Molds reviewed."
  plugin: "Ships as one plugin, `foundry-skills`, for Claude Code, Codex and Antigravity."

