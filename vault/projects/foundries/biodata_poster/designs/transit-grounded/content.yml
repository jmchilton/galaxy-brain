# All poster text lives here. Edit, then run `npm run build`.
# Inline markup: **bold**, `mono`, [[ASK]] / [[QR: ...]] placeholders render highlighted.

title:
  - From Papers and Conversations
  - to Runnable Galaxy Workflows
brand: Galaxy Workflow Foundry
authors: John Chilton¹, Marius van den Beek¹, Dannon Baker², Danielle Callan³, Anton Nekrutenko¹
affiliations:
  - ¹ The Pennsylvania State University, University Park, PA, USA
  - ² Johns Hopkins University, Baltimore, MD, USA
  - ³ Temple University, Philadelphia, PA, USA
venue: CSHL Biological Data Science · Nov 4–7, 2026

hero:
  headline: A correct workflow is a knowledge problem, not a syntax problem.
  body: >-
    Galaxy practice changes faster than model training data. The **Galaxy Workflow Foundry** keeps
    that knowledge in an inspectable wiki, compiles it into agent skills, and lets deterministic
    tools, not the model, decide when a workflow is correct. What can't be resolved is written
    down, not hidden. Agent-built, tool-verified.

# Map lines (source types). Order = top to bottom on the map.
lines:
  M: { name: Methods text, desc: a published methods section, entry: summarize-paper }
  E: { name: Expert specification, desc: a free-form written spec, entry: interview-to-freeform-summary }
  N: { name: Nextflow, desc: nf-core and ad-hoc pipelines, with ground truth to check against, entry: summarize-nextflow }
  C: { name: CWL, desc: "planned: route defined, nothing demo-grade yet", entry: summarize-cwl }

stations:
  brief: Workflow brief + expert review
  interface: Galaxy interface
  dataflow: Data flow
  iwc: IWC exemplar
  template: Template
  draft: Draft loop
  testdata: Test data
  testplan: Test plan
interchanges:
  toolshed: { name: Tool Shed, states: hit | weak | miss }
  gxwf: { name: gxwf, states: pass | fail }
  planemo: { name: Planemo, states: pass | fail }
terminal:
  name: [Galaxy, workflow]
  desc: Native Galaxy tools pinned to Tool Shed revisions, with Galaxy collection semantics.
returnTrack: "fail: diagnose, repair the step, re-validate"

notices:
  - line: E
    at: gxwf
    title: MRSA + ATAC expert specs
    body: June 2026. Built from a written spec, not a live interview; both pass gxwf. **Planemo never ran.**
  - line: N
    at: draft
    title: NCBI EGAPx · partial
    body: Step-by-step translation gave an **empty workflow that gxwf accepted** (validator blind spot, fix on a branch). A one-tool wrapper exists.
  - line: N
    at: draft
    title: nf-core/sarek · in progress
    body: A run exists. The result isn't in hand yet.
  - line: N
