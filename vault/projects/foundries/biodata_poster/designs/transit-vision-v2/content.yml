ticket:
  tag: Journey · DengueSeq DENV3 · 20–21 Oct 2026
  text: >-
    **Vogels et al. 2024 [3]:** dengue virus serotype-3 amplicon sequencing, from the paper
    and its linked code. **Chosen after the skills were built,** so held out. The brief came back with
    10 open questions; the expert reviewer (one of us) edited one answer.
  earlier_tag: Earlier on this line
  earlier: >-
    A roughly 60-step *A. fumigatus* RNA-seq workflow (Hokken et al.), compiled from methods text and
    run on UseGalaxy.org. Checking it against the authors’ data surfaced a modelling choice the
    methods never stated ([1], Fig. S4A).
  arrived_tag: Arrived
  arrived_head: 7 tools, each pinned to a Tool Shed changeset

why:
  tag: Why methods text isn’t enough
  stat: 30{arrow}18
  text: >-
    Companion Orbit study: 30 coding agents planning to replicate one RNA-seq paper proposed
    **18 distinct pipelines**; 29 of 30 diverged from the published one [1].

oracle:
  tag: Why tools decide
  stat: 0/15
  text: >-
    Companion Orbit study (open-weight models): a rule given only in the prompt was followed in
    **0&nbsp;of&nbsp;15** graded runs [1].

