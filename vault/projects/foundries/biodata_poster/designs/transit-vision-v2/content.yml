# ---------- key strip ----------
key:
  title: Map key = how the Foundry works
  items:
    - sym: line
      term: Lines are routes
      text: >-
        A line is a pipeline of Molds; **13** are on `main`.* Routes share the downstream stations.
        **Route {ne} journey:** the pale band is one real run, not a success rate.
    - sym: station
      term: Stations are compiled skills
      text: >-
        Karpathy’s LLM wiki [2], extended: **420** typed notes and **56** Molds compile into **69**
        skills.* Casting runs no model and hashes every source note.
      prov: true
    - sym: interchange
      term: Interchanges are tools that decide
      text: >-
        **Tool Shed** pins each tool, **gxwf** checks real tool schemas, **Planemo** runs the tests.
        The model drafts and repairs. “Skills are guidance, not enforcement” [1].
    - sym: notice
      term: Notices are the gaps
      text: >-
        Every run writes an open-requirements ledger. Methods omit result-changing choices, so gaps
        are expected. Writing them down is the output.
    - sym: depot
      term: The depot recompiles
      text: >-
        A failure is traced to a knowledge defect, fixed in the wiki, and recompiled. Learning happens
        where anyone can read it, not in model weights.
    - sym: terminal
      term: The terminal is native Galaxy
      text: >-
        Galaxy’s own tools and collections, pinned to Tool Shed revisions. The Foundry records which
        knowledge built each skill; Galaxy records what ran.

