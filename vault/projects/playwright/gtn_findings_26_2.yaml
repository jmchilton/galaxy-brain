  fix: 'Show `wget --header "x-api-key: KEY" ''<link>''` and `curl -L -H "x-api-key: KEY" -o outfile ''<link>''` for private data; step 4''s collection `?key=` commands still work. See privacy-default-private.'

- label: cli-wget-output-flag
  faqs: [faqs/galaxy/datasets_download_using_command_line.md]
  target: main
  summary: '`wget -O ''<link>''` and `wget -O --no-check-certificate ''<link>''` fail with "missing URL" because `-O` takes the output file name; plain `wget ''<link>''` saves as `download?to_ext=txt`.'
  fix: Use `wget -O outfile '<link>'` (or `--content-disposition`).

