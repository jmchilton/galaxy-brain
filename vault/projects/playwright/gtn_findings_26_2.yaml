- label: regex-python-re-replacement
  faqs: [faqs/galaxy/analysis_regular_expressions.md]
  target: main
  summary: '`&` and `\U`/`\L` are sed/Perl only; Regex Find and Replace (used by data-manipulation-olympics, Manage_AB1_Sanger, neoantigen-fusion-database-generation) is Python `re`, where `&` is literal and `\U` errors.'
  fix: Say those work in sed-based tools, and use `\g<0>` for the whole match in Regex Find and Replace (no case conversion).

