# =============================================================================
# OPTIONAL DATA INPUTS
# =============================================================================

- test: test_workflows.py::test_run_with_optional_data_specified_to_multi_data
  fact: Optional data input when provided is consumed normally by multi-data tool.
  context: Positive baseline example for optional data input behavior.

- test: test_workflows.py::test_run_with_optional_data_unspecified_to_multi_data
  fact: Optional data input when omitted causes tool to receive empty input and produce default "No input selected" output.
  context: Key example - defines what tools see when optional data is absent.

- test: test_workflows.py::test_run_with_optional_data_unspecified_survives_delayed_step
  fact: Omitted optional data input survives delayed scheduling ($link) without causing failure.
  context: Edge case example - interaction between optional inputs and delayed scheduling.

- test: test_workflows.py::test_run_with_non_optional_data_unspecified_fails_invocation
  fact: Required (non-optional) data input that is unspecified fails invocation with 400 error.
  context: Counter-example to optional behavior - documents the required-input contract.

- test: test_workflows.py::test_run_with_optional_collection_specified
  fact: Optional collection input when provided executes normally.
  context: Positive baseline for optional collections - parallel to optional data.

- test: test_workflows.py::test_run_with_optional_collection_unspecified
  fact: Optional collection input when omitted produces default placeholder output.
  context: Parallel to unspecified optional data - extends pattern to collections.

- test: test_workflows.py::test_run_with_non_optional_collection_unspecified_fails_invocation
  fact: Required collection input that is unspecified fails invocation.
  context: Counter-example - required collection contract mirrors required data contract.

