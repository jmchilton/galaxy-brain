# JOB CACHE MECHANISM (Q19)
# =============================================================================

- evidence: Code analysis of lib/galaxy/managers/jobs.py::JobSearch (JobSearch.by_tool_input and __search), lib/galaxy/tools/actions/__init__.py::DefaultToolAction.execute (cache reuse creates new job with copied_from_job_id)
  fact: Job cache uses DB-based parameter matching. Cache hit requires exact match on tool ID+version, user ID, job state (OK), input dataset IDs, and all non-ignored tool parameters (JSON-serialized, sorted keys, byte-for-byte). Ignored params include __use_cached_job__, __workflow_invocation_uuid__, __when_value__, __input_ext, chromInfo, dbkey, and *|__identifier__. On cache hit, a new job is created with copied_from_job_id pointing to the original and output datasets reference the same underlying dataset objects. No explicit invalidation mechanism exists - entries are immutable DB records.
  context: Answers Q19. Only way to get a cache miss is to change an input parameter or dataset.

