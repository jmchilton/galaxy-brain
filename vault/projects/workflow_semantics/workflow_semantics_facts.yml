- evidence: lib/galaxy/model/__init__.py::DatasetInstance.is_skipped; lib/galaxy/workflow/modules.py::PickValueModule._is_null_or_skipped
  fact: A dataset instance counts as skipped when extension == "expression.json" AND blurb == "skipped" - both, not either. The predicate sits on DatasetInstance rather than on HistoryDatasetAssociation alone, so it applies to collection elements too.
  context: Names the skip sentinel. Worth knowing it is a heuristic over two string fields and not a state flag - a genuine expression.json output is distinguished only by its blurb.

