  fact: For a dynamic (discovered) collection the elements do not exist yet, so the action defers - a PostJobActionAssociation is persisted and consumed at discovery as ext_override, keyed by output name. Job.get_change_datatype_actions filters on action_type only, not on ActionBox.immediate_actions, which is what lets the association survive that far.
