  fact: The two no-job call sites differ in what they dispatch. ToolModule pre-filters to mapped_over_output_actions (Rename, Hide, Tag, RemoveTag - all supported), so an unsupported action can never reach it. PickValueModule dispatches every PJA on the step with no allowlist, so it is the only path on which the silent no-op was reachable.
