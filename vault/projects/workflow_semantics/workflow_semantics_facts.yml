# =============================================================================
# EXPRESSION.JSON VS REGULAR DATASETS
# =============================================================================

- evidence: lib/galaxy/workflow/modules.py::to_cwl
  fact: Datasets with extension "expression.json" are deserialized as JSON values in CWL context, while regular datasets become File objects with location/format/path properties.
  context: Fundamental distinction - this is the fork point for how datasets enter expression evaluation. Core doc material.

- evidence: lib/galaxy/workflow/modules.py::to_cwl
  fact: Before deserializing expression.json, datasets are checked for ready state, ok status, and purged status. Not-ready raises DelayedWorkflowEvaluation, failed/purged raises FailWorkflowEvaluation.
  context: Documents the pre-conditions for expression evaluation - important for understanding failure modes.

- evidence: lib/galaxy/workflow/modules.py::to_cwl
  fact: Collections are converted to CWL as arrays (list type) or dicts (record type) recursively, with element identifiers as keys for records.
  context: Documents collection->CWL conversion rules. Useful reference material.

- evidence: lib/galaxy/workflow/modules.py::from_cwl
  fact: CWL File objects with "step_input://" locations are resolved back to original HDA references.
  context: Documents the round-trip conversion path. Complements to_cwl docs.

- test: test_workflows.py::test_expression_tool_output_in_format_source
  fact: expression.json outputs from conditional skipped steps create null expression.json datasets; pick_value filters these; format_source on the result still works.
  context: Complex interaction example - expression.json + conditional skip + pick_value + format_source.

- evidence: lib/galaxy/workflow/modules.py::ToolModule.execute
  fact: When a non-data tool parameter receives an expression.json dataset, it is deserialized from JSON rather than treated as file reference.
  context: Documents how expression.json flows into tool parameters vs data inputs differently.

