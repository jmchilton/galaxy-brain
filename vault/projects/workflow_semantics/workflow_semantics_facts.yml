# DEFAULT VALUES
# =============================================================================

- test: default_values.gxwf-tests.yml (test 1)
  fact: Required parameter with default value uses the default when input is omitted from invocation.
  context: Baseline positive example for default value behavior.

- test: default_values.gxwf-tests.yml (test 2)
  fact: Explicit null for a required parameter with default does NOT trigger the default - it overrides it and causes failure.
  context: Critical distinction - default applies only when omitted, not when explicitly null. Counter-example.

- test: default_values.gxwf-tests.yml (test 3)
  fact: Empty string for a required parameter with default does NOT trigger the default - it overrides it and causes failure.
  context: Parallel to explicit null case - empty string is a value, not an omission. Counter-example.

- test: default_values_optional.gxwf-tests.yml (test 1)
  fact: Optional parameter with default value uses the default when input is omitted.
  context: Shows optional+default behaves same as required+default for the omission case.

- test: default_values_optional.gxwf-tests.yml (test 2)
  fact: Explicit null on optional parameter with default overrides the default and causes failure.
  context: Potentially surprising - optional+default still fails on explicit null. Documents that "optional" doesn't mean "null-safe".

- test: default_values_optional.gxwf-tests.yml (test 3)
  fact: Empty string on optional parameter with default overrides the default and causes failure.
  context: Same as above for empty string. Reinforces that defaults only apply on omission.

- test: test_workflows.py::test_run_replace_params_over_default
  fact: Step parameters specified in invocation override tool default values.
  context: Documents the override precedence - invocation params > tool defaults.

- test: test_workflows.py::test_run_replace_params_over_default_delayed
  fact: Step parameter override works correctly even with delayed scheduling after pause step.
  context: Edge case - override precedence holds through delayed scheduling.

- test: test_workflows.py::test_run_subworkflow_with_required_input_with_default_unconnected
  fact: Subworkflow with unconnected required parameter that has a default value uses the default automatically.
  context: Useful example - disconnected required input with default doesn't fail, it uses the default.

