  fact: A pick_value step has no job, so its PJAs dispatch through ActionBox.execute_on_mapped_over rather than the job-finish path. An action that does not implement execute_on_mapped_over inherits DefaultJobAction's pass and does nothing. Supported - Rename, ChangeDatatype, ColumnSet, Hide, Delete, Tag, RemoveTag. Unsupported - Email, DeleteIntermediates, ValidateOutputs, SetMetadata. Of the unsupported set only Email and DeleteIntermediates are in public_actions, so exactly those two were configurable in the editor and silently inert.
