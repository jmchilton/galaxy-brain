# =============================================================================
# PARAMETER CONNECTION TYPE HANDLING (Q9)
# =============================================================================

- evidence: Code analysis of lib/galaxy/workflow/run.py::WorkflowProgress.replacement_for_input (replacement_for_input), lib/galaxy/workflow/run.py::WorkflowProgress.replacement_for_connection (replacement_for_connection), lib/galaxy/workflow/modules.py::ToolModule.execute (parameter replacement)
  fact: Parameter connections have NO type validation or coercion. Values flow through unchanged from source to destination. The from_json() methods on parameter types (which DO coerce - e.g. int(), float(), string_as_bool) are NOT called for connected values. The only special handling is expression.json deserialization (lib/galaxy/workflow/modules.py::ToolModule.execute) and the bool() cast for ConditionalStepWhen (lib/galaxy/workflow/modules.py::ToolModule.execute).
  context: Answers Q9. No type matrix exists because there's no type checking. Cross-type connections (integer output -> text input) are untested and could behave unexpectedly since the tool receives a Python int instead of a string.

- evidence: Code analysis of lib/galaxy/tools/parameters/basic.py::IntegerToolParameter.from_json (IntegerToolParameter.from_json), lib/galaxy/tools/parameters/basic.py::BooleanToolParameter.from_json (BooleanToolParameter.from_json via string_as_bool)
  fact: Tool parameter from_json() methods DO perform coercion (int() for integers, string_as_bool() for booleans where "true"/"yes"/"on"/"1" -> True, everything else -> False). But these are only called during tool parameter deserialization from JSON, NOT during workflow connection resolution. This means the coercion rules differ depending on whether a value comes from a connection vs from step state.
  context: Important nuance - same tool input behaves differently depending on value source. Could be a source of subtle bugs.

# =============================================================================
# JOB FAILURE PROPAGATION (Q1)
# =============================================================================

- evidence: Code analysis of lib/galaxy/workflow/run.py::WorkflowInvoker.__check_implicitly_dependent_steps (__check_implicitly_dependent_steps iterates non_data_connection inputs only), lib/galaxy/workflow/run.py::WorkflowInvoker.__check_implicitly_dependent_step (__check_implicitly_dependent_step checks job.state, raises InvocationFailureJobFailed), lib/galaxy/workflow/run.py::WorkflowProgress.replacement_for_connection (replacement_for_connection checks dataset.is_ok for non-data inputs)
  fact: Job failure propagates via two distinct paths. Non-data connections (parameters) trigger __check_implicitly_dependent_step() which checks job.state BEFORE inputs are evaluated - if job.state != OK, raises FailWorkflowEvaluation with InvocationFailureJobFailed. Data-only connections never trigger the job state check - instead downstream fails when replacement_for_connection() finds dataset in ERROR state, raising InvocationFailureDatasetFailed.
  context: Answers Q1. The failure reason differs by connection type (JobFailed vs DatasetFailed) even though both result in workflow failure. A step with only data connections to a failed upstream will fail on dataset state, not job state.

# =============================================================================
# PAUSE STEP DEPENDENCIES (Q2)
# =============================================================================

- evidence: Code analysis of lib/galaxy/workflow/run.py::WorkflowInvoker.__check_implicitly_dependent_steps (implicit dep check only iterates non_data_connection), lib/galaxy/workflow/run.py::WorkflowProgress.replacement_for_connection (STEP_OUTPUT_DELAYED raises DelayedWorkflowEvaluation), lib/galaxy/workflow/modules.py::PauseModule.execute (PauseModule.execute marks output delayed), lib/galaxy/workflow/run.py::WorkflowInvoker.__check_implicitly_dependent_step TODO comment context
  fact: Pause steps do NOT create implicit dependencies. The implicit dependency check (lib/galaxy/workflow/run.py::WorkflowInvoker.__check_implicitly_dependent_steps) only checks non_data_connection inputs. Pause steps use data connections, so they're never checked. Downstream steps that consume pause output are blocked because replacement_for_connection() finds STEP_OUTPUT_DELAYED and raises DelayedWorkflowEvaluation. Steps NOT connected to the pause step run immediately. The TODO at lib/galaxy/workflow/run.py::WorkflowInvoker.__check_implicitly_dependent_step is about job-finished checking for pause steps (which have no jobs), not about adding new implicit ordering.
  context: Answers Q2. Blocking is connection-based, not type-based. Unconnected steps run freely regardless of pause state.

# =============================================================================
# SCHEDULING ITERATION STATE PERSISTENCE (Q14)
# =============================================================================

- evidence: Code analysis of lib/galaxy/workflow/run.py::WorkflowInvoker.__init__ (new WorkflowProgress each iteration), lib/galaxy/workflow/run.py::WorkflowProgress.remaining_steps (remaining_steps rebuilds state), lib/galaxy/workflow/run.py::WorkflowProgress.remaining_steps (inject_all reloads tools), lib/galaxy/workflow/run.py::WorkflowProgress.remaining_steps (compute_runtime_state from persisted JSON), lib/galaxy/workflow/run.py::WorkflowProgress.remaining_steps (recover_mapping for completed steps), lib/galaxy/workflow/modules.py::WorkflowModule.recover_mapping (recover_mapping reads output_datasets/output_dataset_collections from DB)
  fact: Scheduling uses hybrid state persistence. Persisted in DB between iterations - InvocationStep records (state, job_id), step output dataset/collection associations, workflow inputs, parameter inputs, tool input runtime state as JSON. Rebuilt fresh each iteration - WorkflowProgress instance (outputs dict starts empty), tool info (inject_all), runtime state (compute_runtime_state from persisted JSON). Completed step outputs are recovered from DB via recover_mapping(), not re-executed. Parameter evaluations are effectively recomputed each iteration.
  context: Answers Q14. Key implication - completed steps are never re-executed, but delayed steps are re-evaluated from scratch with recovered upstream outputs.

