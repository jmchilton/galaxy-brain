# =============================================================================
# PJA BEHAVIOR ON SKIPPED STEPS
# =============================================================================

- evidence: Code analysis of lib/galaxy/workflow/modules.py::ToolModule.execute (job_callback), lib/galaxy/tools/actions/__init__.py::DefaultToolAction.execute (skip handling), lib/galaxy/job_execution/actions/post.py::ChangeDatatypeAction (ChangeDatatypeAction skip check)
  fact: PJAs DO execute on skipped steps. When a step is skipped, a job is still created (state=SKIPPED) with placeholder datasets (extension=expression.json, content="null", visible=False via set_skipped()). The job_callback that runs PJAs fires unconditionally. Most PJAs (Hide, Delete, Tag, Rename) operate on the placeholder datasets harmlessly. Only ChangeDatatypeAction has explicit skip-awareness - it returns early to preserve expression.json extension.
  context: Answers Q5, but scoped to the job path only. A step with no job (pick_value, mapped-over tool outputs) dispatches through ActionBox.execute_on_mapped_over instead, where the supported set and the skip guard are both different - see PJA DISPATCH ON STEPS WITH NO JOB below. ChangeDatatypeAction is no longer the only action with explicit skip-awareness.

# =============================================================================
# DATASET "READY" STATE DEFINITION
# =============================================================================

- evidence: Code analysis of lib/galaxy/workflow/modules.py::to_cwl (to_cwl checks), lib/galaxy/model/__init__.py::Dataset (ready_states), lib/galaxy/model/__init__.py::DatasetInstance (is_ok/is_pending), lib/galaxy/schema/schema.py::DatasetState (DatasetState enum)
  fact: >-
    "Ready" for expression evaluation is a two-tier check. Tier 1 - Dataset.in_ready_state() means NOT in {NEW, UPLOAD, QUEUED, RUNNING, SETTING_METADATA}. Ready states include OK, EMPTY, ERROR, PAUSED, FAILED_METADATA, DEFERRED, DISCARDED. Tier 2 - is_ok requires state == OK specifically. In to_cwl(), not-ready -> DelayedWorkflowEvaluation (retry later), ready-but-not-ok -> FailWorkflowEvaluation (hard fail), purged -> FailWorkflowEvaluation. So "ready" means "stop waiting, we have an answer" while "ok" means "the answer is good."
  context: Answers Q21. The two-tier distinction is important - ERROR is "ready" (don't delay) but not "ok" (fail the workflow).

