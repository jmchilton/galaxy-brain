# =============================================================================
# RESUME VS RERUN SEMANTICS (Q7)
# =============================================================================

- evidence: Code analysis of lib/galaxy/tools/actions/__init__.py::DefaultToolAction.execute (rerun_remap_job_id trigger), lib/galaxy/tools/actions/__init__.py::DefaultToolAction._remap_job_on_rerun (_remap_job_on_rerun), lib/galaxy/model/__init__.py::Job.resume (job.resume() PAUSED->NEW), test_workflows.py::test_workflow_resume_from_failed_step (test_workflow_resume_from_failed_step)
  fact: >-
    "Resume from failed step" is NOT a first-class workflow concept. It's an implicit side effect of re-running a failed tool with rerun_remap_job_id parameter on /api/tools. The _remap_job_on_rerun() method creates a new job, hides old failed outputs, updates all downstream jobs' parameters to reference new outputs via __remap_parameters(), then calls job.resume() on each downstream paused job (PAUSED -> NEW). The SAME invocation continues - same ID, stays in "scheduled" state. Downstream jobs re-execute with remapped inputs.
  context: >-
    Answers Q7 resume path. Key: resume is continuation of an existing invocation, not a new one.

- evidence: Code analysis of lib/galaxy/tools/actions/__init__.py::DefaultToolAction.__remap_data_inputs (__remap_data_inputs, __remap_parameters), lib/galaxy/tools/actions/__init__.py::DefaultToolAction._remap_job_on_rerun (collection element remapping via replace_failed_elements)
  fact: Job remapping builds a mapping of old failed output HDAs to new successful output HDAs, then updates downstream job parameters to reference the new datasets. For dataset collections, replace_failed_elements() updates collection elements. Old failed outputs are marked invisible. Authorization check ensures only jobs belonging to the current user are remapped.
  context: Implementation detail of the remapping mechanism. Collection support and authorization are important guarantees.

- evidence: Code analysis contrasting rerun_remap_job_id path (same invocation, lib/galaxy/tools/actions/__init__.py::DefaultToolAction.execute) with new invocation path (POST /api/workflows/{id}/invocations, fresh invocation ID)
  fact: >-
    "Rerun" (re-invoke) creates a completely new workflow invocation with a new ID and fresh state. All steps execute from scratch or use cached jobs if use_cached_job=True. No relationship to previous invocation exists. This is fundamentally different from resume - resume continues the same invocation, rerun starts a new one.
  context: Answers Q7 rerun path. The two mechanisms are orthogonal - resume fixes a failure in-place, rerun starts fresh.

- evidence: Code analysis of lib/galaxy/model/__init__.py::Job.resume (job.resume recursively resumes dependent jobs via unpause_dependent_jobs)
  fact: job.resume() is recursive - it changes the job's state from PAUSED to NEW, then iterates output_datasets and calls unpause_dependent_jobs() which collects all transitively dependent paused jobs and resumes them too. This means a single rerun_remap_job_id call can cascade resume through an arbitrarily deep dependency chain.
  context: Important behavioral guarantee - resume cascades through the full downstream chain, not just immediate dependents.

