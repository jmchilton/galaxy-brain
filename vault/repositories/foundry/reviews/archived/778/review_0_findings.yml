    pr_title: Fold into drafty consumers, give the fold an oracle, and commit a STAR fixture
    description: |
      `pr_778_round_0_rev_0` builds on `4e4df029`. It lets repair fold into drafty consumers through `_plan_state`, says a fold isn't a narrowing, records its per-job cost as a ledger decision, and gives the fold an eval property. It commits a synthetic `star-index-fold` fixture that the implement, advance and repair STAR cases now name, and adds an advance case for the found-wrapper skip. Smaller commits fix the advance authoring property for a rejected `weak` candidate, record a dropped wrapper parameter as `kind: dropped` with a property for it, exempt data managers from discover's never-a-miss rule, cut rationale clauses from the Mold bodies, trim the discover STAR case, and narrow implement's failure-ownership oracle. Casts are regenerated in each commit.
    commits:
      - sha: 5ba816c7
        subject: Fold into drafty consumers through _plan_state
        detail: has the fold rewire into the consumer ports the entry quotes and select the mode in `state` on a realized consumer or `_plan_state` on a drafty one, only into a consumer pinned to the quoted wrapper, and makes the scenario's consumers identity-pinned.
        findings: [P2 1]
      - sha: 8425bb0d
        subject: Give repair's fold an eval property and exempt it from narrowing
        detail: "says in the Mold that a fold appends no `kind: dropped` entry and its resolve note quotes the option, carves the fold out of the Ledger paragraph and the two removal properties, and adds a fold property."
        findings: [P2 2]
      - sha: dac2bf5f
        subject: Record a fold's per-job cost as a ledger decision
        detail: has the fold append a `decisions` entry for what it costs, such as an index rebuilt in every consumer job, and adds it to the scenario's expect.
        findings: [P3 1]
      - sha: 0bda0df8
        subject: Commit a STAR index fold fixture for implement, advance and repair
        detail: adds `repair-galaxy-draft-topology/examples/star-index-fold/` (draft, ledger entry quoted from the `rna_star` 2.7.11b+galaxy1 summary, folded draft, README), points the three cases at it, and adds a re-entry case and an advance routing case.
        findings: [P2 3]
      - sha: 2a399911
