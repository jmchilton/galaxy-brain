  - id: P3 6
    include: true
    title: Implement's old failure-ownership oracle overlaps the new blocking-entry property
    summary: Mold narrowed Failure ownership to wrappers that carry the plan; eval and case still covered output mismatches.
    issue: |
      The PR narrowed implement's Failure ownership prose to a wrapper that carries what the plan needs but could still fail at runtime. The "runtime failure ownership hint" property and its case still covered mismatches in "inputs, outputs, datatype, or collection support". The output mismatch now overlaps the new blocking-entry property. Because eval properties apply to every run, the STAR run would also be judged on writing an ownership hint.
    fix: |
      The property and its case are now scoped to a wrapper that carries the plan, where a datatype, parameter or collection shape could still fail at runtime.
    discovered_by:
      - {profile: generic_test_challenger, model: Claude Opus 5.5, effort: medium}
