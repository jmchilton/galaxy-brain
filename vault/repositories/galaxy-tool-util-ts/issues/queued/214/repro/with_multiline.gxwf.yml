class: GalaxyWorkflow
inputs:
  taxonomy: {type: data, format: tabular}
outputs:
  formatted: {outputSource: query/output}
steps:
  - id: query
    label: query
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/query_tabular/query_tabular/3.3.2
    tool_version: 3.3.2
    state:
      tables:
        - tbl_opts: {table_name: tax}
      sqlquery: |
        WITH RECURSIVE example AS (SELECT c1 FROM tax)
        SELECT c1 FROM example
      query_result: {header: 'no'}
    in: {tables_0|table: taxonomy}
    out: [{id: output}]
