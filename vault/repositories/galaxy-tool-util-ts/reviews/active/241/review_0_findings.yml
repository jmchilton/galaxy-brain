    head: db8154a4d88
    pr_title: Tolerant edge annotations, runtime_value label fix and shared step-reference resolution
    description: |
      `pr_241_round_0_rev_0` builds on `28e93b56`. It adds a `workflowEdgeAnnotations` helper in connection-validation that returns no annotations when a Format2 source resolves to no step, and uses it from the CLI annotate helpers, so `gxwf mermaid|cytoscapejs --annotate-connections` and gxwf-web edge annotations no longer crash on the shared `synthetic-labeled-step-id-ref` fixture. It stops the `runtime_value` shortcut from shadowing a real input or step with that label, and adds one `format2StepReferenceIndex` helper that conversion, lint and the frame check all use. The rest are tests: lint through a `/`-containing label on the shared fixture, a lint case for a step-`in` typo, and an exact `toEqual` in place of `toContain`.
    commits:
      - sha: 218a069cb5b
        subject: Resolve a real runtime_value label before the placeholder shortcut
        detail: "guards the `RUNTIME_VALUE_SOURCE` shortcut in `ConversionContext.stepOutput` with `!this.labels.has(value)` and adds a test that an input labelled `runtime_value` converts to `id: 0`."
        findings: [P3 1]
      - sha: a5dafc8d17e
        subject: Return no edge annotations when a Format2 source resolves to no step
        detail: adds `workflowEdgeAnnotations` to connection-validation, uses it in both CLI annotate helpers, and tests both helpers on the shared `synthetic-labeled-step-id-ref.gxwf.yml` fixture.
        findings: [P2 1]
      - sha: b09cb40fbd7
        subject: "Test lint accepts an outputSource through a label containing '/'"
        detail: lints the shared `synthetic-slash-in-step-label.gxwf.yml` fixture and expects no errors.
        findings: [P2 3]
      - sha: c6a8a7e454b
        subject: Test lint reports a step source naming no step or input
        detail: adds an exact `toEqual` lint case for `missing/out_file1` in a step `in:` source.
        findings: [P3 5]
      - sha: 7b626b16b10
        subject: Assert the exact lint errors for a step source named by id
        detail: replaces `toContain` with `toEqual([...])` in the step-source lint test.
        findings: [P3 6]
      - sha: db8154a4d88
        subject: Share Format2 step-reference resolution across conversion, lint and frames
        detail: adds `format2StepReferenceIndex` to `labels.ts` and uses it in `ConversionContext.stepId`, lint's `validateSources` and `unresolvedFrameReferences`.
        findings: [P3 2]
