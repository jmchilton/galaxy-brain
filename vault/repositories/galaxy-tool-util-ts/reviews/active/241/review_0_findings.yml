  - id: P3 1
    include: true
    title: "The `runtime_value` shortcut shadows a real label"
    summary: an input or step actually labelled runtime_value converted to id null; guarded the shortcut.
    implementation_verified: true
    issue: |
      `stepOutput` returns `NaN` for `RUNTIME_VALUE_SOURCE` before the label lookup. A workflow input or step that is actually labelled `runtime_value` now converts to `{"id": null}`; on base it resolved to its index. It's unlikely, but it's a silent regression in the exact bug class this PR closes.
    evidence: |
      `inputs: {runtime_value: data}; steps: {s: {in: {input1: runtime_value}}}` converted to `input_connections {"input1":[{"id":null,"output_name":"output"}]}`.
    fix: |
      Guarded the shortcut with `&& !this.labels.has(value)` and added a test that such an input converts to `id: 0`. The test fails before the change; `roundtrip.test.ts`, which covers the real placeholder, still passes. Lint's matching skip needs no guard, since a real label resolves either way.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 2
    include: true
    title: One step-reference rule, implemented three times
    summary: toNative, lint and the frame check each hand-rolled 'known label or all digits'; now share format2StepReferenceIndex.
    implementation_verified: true
    issue: |
      Conversion, lint and frames now share `format2StepLabelIndices` and `resolveSourceReference`, and agree on every edge case probed (labels with `/`, numeric refs, `1abc`, subworkflow-local labels, `$link`, multi-source lists, slashless refs, outputSource). But each hand-rolls the "known label or all digits" predicate: `ConversionContext.stepId` in `toNative.ts`, `unresolvedRef` in `lint.ts` and `unresolvedFrameReferences` in `comments.ts`.
    fix: |
      Added `format2StepReferenceIndex(ref, labels)` to `labels.ts`. It returns the order index of a known label, else of an all-digit ref, else `undefined`. All three call sites use it. `format2ShadowedStepIds` is still built separately in lint and toNative; folding both maps into one `Format2LabelIndex` would be the next step if more callers appear.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 3
    include: true
    title: Put the shadowed-id cases in the shared declarative fixtures, with Python lint parity
    summary: TS-only unit tests duplicate behaviour gxformat2 already shares; needs a gxformat2 PR (fixtures, expectations, step-in lint) then a sync.
    issue: |
      The new cases are TS-only `.test.ts` workflows, but most of the behaviour is shared. Python `ensure_native` raises on both shadowed-id cases (step `in` and `outputSource`), and Python lint already rejects an id-named `outputSource`, since `known_labels` is `s.label or s.id`. Python lint doesn't check step `in:` sources at all, so TS lint is now stricter than Python. The precedent is `synthetic-frame-step-id-shadowed-by-label.gxwf.yml`, which already has a `to_native` `expect_error: true` case for the frame version of this bug.
    fix: |
      A gxformat2 counterpart PR first, then a sync. It would add `synthetic-source-step-id-shadowed-by-label.gxwf.yml` (`to_native` `expect_error: true`) and `synthetic-output-source-step-id-shadowed-by-label.gxwf.yml` (`to_native` `expect_error: true`, `lint_format2` `error_count: 1`, `value_contains: "first"`). It would also add the step `in:` source check to Python lint, plus a descriptive error in `_ConversionContext.step_id` in place of the bare `int()` failure. The TS unit tests can then keep only TS-specific detail: exact message, error type, numeric ids, `runtime_value`, subworkflow scope. The connection-validation test could load the shared fixture instead of its inline copy. The PR body offers the gxformat2 change; this argues for doing it.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: generic_test_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P3 4
    include: true
    title: The synthetic connection-report entry bends the shared report model
    summary: unresolvedSourceReport puts a source string in step and invents step_type unresolved_source; frame errors still escape uncaught.
    implementation_verified: true
    issue: |
      `unresolvedSourceReport` returns a `ConnectionStepResult` whose `step` is a source string (`"first/out_file1"`), where everywhere else `step` is a step index. It also invents `step_type: "unresolved_source"` and counts `summary.invalid: 1` with zero connections. The CLI prints `step first/out_file1`. Only the first unresolved source is reported, because toNative throws on the first, while lint reports all of them. `ConnectionValidationReport` mirrors the Python and gxwf-web report model, so this is a shared contract. The catch is also class-specific: a frame-reference failure (#227, a plain `Error` from `_buildNativeComments`) still escapes `validateConnectionsReport` uncaught.
    fix: |
      Route conversion failures to a top-level report error field (#220's proposal) instead of a fake step result, mirrored in the Python models and gxwf-web OpenAPI. If the shim stays, document it in `report-models.ts` and give frame errors the same treatment.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
