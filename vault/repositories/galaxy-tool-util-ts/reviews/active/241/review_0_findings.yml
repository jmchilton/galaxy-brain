findings:
  - id: P2 1
    include: true
    title: Edge-annotation paths crash on an unresolved source
    summary: "--annotate-connections and gxwf-web edge annotations threw UnresolvedSourceError on the shared labeled-step-id fixture; now return no annotations."
    implementation_verified: true
    issue: |
      `validateConnectionsReport` catches `UnresolvedSourceError`, but the other `buildWorkflowGraph` callers don't. The CLI's `resolveEdgeAnnotationsWithCache` and `resolveEdgeAnnotationsAndSpecsWithCache` back `gxwf mermaid|cytoscapejs --annotate-connections` and gxwf-web's `operateEdgeAnnotations`, which turns the throw into a 500. Before this PR these paths got one `skip` edge. Now they throw on the shared fixture `synthetic-labeled-step-id-ref.gxwf.yml`, which gxformat2's `mermaid.yml` / `cytoscape.yml` expectations render with the edge. Plain `gxwf mermaid` on the same file renders fine.
    evidence: |
      ```console
      $ gxwf mermaid synthetic-labeled-step-id-ref.gxwf.yml --annotate-connections
      UnresolvedSourceError: Cannot resolve 'meme/out': step 'meme' has the label 'MEME', ...
      ```
      This was an uncaught Node stack trace, with exit 1.
    fix: |
      Added `workflowEdgeAnnotations(workflow, getToolInfo)` to connection-validation. It builds the graph, validates it and returns the annotations, or an empty map on `UnresolvedSourceError`. Both CLI helpers use it, which also covers gxwf-web. A parity test runs both helpers on the shared fixture and fails before the change. `gxwf mermaid --annotate-connections` on the fixture now renders.
    fix_details: |
      This doesn't fully restore base behaviour. On base such a workflow kept every annotation except the one skipped edge; now it gets none. gxwf-web's endpoint should go from 500 to an empty-annotation 200 through the same helper, but that path wasn't tested. `useClientEdgeAnnotations` in gxwf-ui is unchanged. It already catches the throw and shows the message, which seems right for an interactive view. The programmatic `validateConnections` still throws, like `toNative`.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P2 2
    include: true
    title: The new error steers map-form authors into a reference draft-validate rejects
    summary: in map form draft-validate resolves the dict key and rejects the label, which is exactly what the new message tells authors to use; needs gxformat2 first.
    implementation_verified: true
    issue: |
      `draft-checks.ts` keys map-form steps by dict key (`iterateSteps` → `Object.entries(steps)`) and list-form steps by `label ?? id`. After this PR, conversion and lint key every step by `label ?? id`. In map form no reference passes both, which is the table in foundry#754. The divergence predates the PR, but the PR's new message ("Reference it as 'First concatenation/out_file1'") now tells the author to write the one reference that `draft-validate` rejects. That is the Foundry draft → convert loop. The PR body doesn't mention draft-validate.
    evidence: |
      Map-form #229 repro, as `GalaxyWorkflowDraft`:

      | source | `draft-validate` | `lint` / `convert` (this PR) |
      |---|---|---|
      | `first/out_file1` (key) | resolves the step | error |
      | `First concatenation/out_file1` (label) | `references unknown step "First concatenation"` | resolves |

      Python `gxformat2/draft.py` on `origin/main` also iterates map-form steps by key (`steps.items()`), so the TS draft checks match Python today.
    fix: |
      Not fixed on the review branch. Changing TS draft-checks alone would break parity with Python draft validation. Instead, key map-form draft steps by `rawStepRenderIdentity(step, key)` (already in `labels.ts` and used by `resolveDraftOverlay`) in gxformat2 and here together, with a shared draft expectation. A key-only reference could then reuse the "has the label" hint from `format2ShadowedStepIds`. At minimum, note the gap in the PR body and open a follow-up issue.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P2 3
