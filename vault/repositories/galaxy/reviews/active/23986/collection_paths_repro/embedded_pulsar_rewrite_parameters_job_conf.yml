# Equivalent of the job_config the repro test builds inline (rewrite_parameters: true).
# Also set in galaxy.yml: object_store_store_by: uuid, outputs_to_working_directory: false.
runners:
  local:
    load: galaxy.jobs.runners.local:LocalJobRunner
  pulsar_embed:
    load: galaxy.jobs.runners.pulsar:PulsarEmbeddedJobRunner
    pulsar_app_config:
      tool_dependency_dir: none
      conda_auto_init: false
      conda_auto_install: false

execution:
  default: pulsar_embed
  environments:
    local:
      runner: local
    pulsar_embed:
      runner: pulsar_embed
      default_file_action: copy
      rewrite_parameters: true

tools:
- id: __DATA_FETCH__
  environment: local
