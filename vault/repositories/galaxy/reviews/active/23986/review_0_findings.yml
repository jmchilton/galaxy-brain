  - id: P3 5
    include: true
    title: No warning when Crypt4GH is enabled without a walltime limit
    summary: without a walltime the job margin silently assumes jobs finish within an hour of dispatch; now logs a warning at startup. No test.
    issue: |
      `DatasetProtectionManager.job_margin` is `1 day + 1 hour + (walltime or 0)`. Without a walltime limit, Galaxy's default, the margin silently assumes the job runs and has its outputs encrypted within an hour of dispatch, and a longer job on a grant near its expiration fails late with its outputs purged. The docs tell admins to configure a walltime, but nothing flags its absence.
    fix: |
      `DatasetProtectionManager` now logs a warning when `crypt4gh_enabled` is set and no walltime limit is configured. No test was written for the log line.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
