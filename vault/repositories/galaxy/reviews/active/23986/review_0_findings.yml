  - id: P2 8
    include: true
    title: Grant-manager unit tests fake the model instead of using Galaxy's test app
    summary: test_dataset_protection.py patches the ORM class with Bunch, uses a MagicMock session and replaces manager methods; suggests GalaxyDataTestApp rows. Not fixed, large rewrite.
    issue: |
      `test/unit/app/managers/test_dataset_protection.py` builds hand-rolled fakes (`_FakeDataset`, `_FakeOutput`, `_FakeObjectStore`, `Bunch` jobs, users and tools) with a `MagicMock` session. Nine tests patch the ORM class itself with `mock.patch("galaxy.managers.dataset_protection.DatasetProtectionGrant", Bunch)` and read the grant back from `sa_session.add.call_args`, several replace manager methods on the instance, and the concurrency test scripts `commit.side_effect`. These tests can't catch mapping or relationship errors and are tied to which methods the manager happens to call.
    evidence: |
      On the review branch, batching the output grant lookup into one `select(...)` broke eight of these tests: `select(Bunch)` raises `ArgumentError` once the ORM class is patched out. The branch had to stub the new `_get_grants` method in `_manager()` too.
    fix: |
      Build real `User`, `Dataset`, `HistoryDatasetAssociation` and `Job` rows on `galaxy.model.unittest_utils.data_app.GalaxyDataTestApp` and assert on queried `DatasetProtectionGrant` rows. Splitting the pure output classification in `finish_job` from purging and grant writing, and extracting the `Crypt4GHGrantData` construction in `_record_output_grants` into a pure function, would remove most remaining stubs.

