  - id: P3 11
    include: true
    title: Crypt4GHGrantData encodes a state machine in optional fields
    summary: extra_files_key fallback, _job_files_key/_extra_files_expiration/_extra_files_expire/_lacks_extra_files reconstruct which combination applies; suggests a JobFiles sub-record. Not fixed.
    issue: |
      A grant's job files (extra files, metadata files, copied extra files) may or may not carry their own `extra_files_key`, falling back to the grant's `key_ref` and `expires_at` (`_job_files_key`). Expiration is `None` unless both `extra_files_key` and `extra_files` are set (`_extra_files_expiration`). `_store_user_grant` and `_record_output_grants` each hand-maintain these combinations. That is five optional fields plus four helpers whose job is to interpret which combination is in effect.
    fix: |
      Model the job-created files as one optional sub-record that always carries its key (`key_ref`, `expires_at`, `extra_files`, `metadata_files`, `copied_extra_files`), so grant data becomes `compute_header` plus `job_files`, and re-authorizing keeps `previous.job_files`. Not fixed on the review branch: it changes the stored grant JSON and its readers, estimated at about 150 to 200 changed lines with tests.
    discovered_by:
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
