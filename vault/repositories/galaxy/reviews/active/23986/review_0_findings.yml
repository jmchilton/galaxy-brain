    head: f4c1a518d0c
    pr_title: Crypt4GH review fixes - grant lookups, tool refusals, binary inputs and test cleanup
    description: |
      `pr_23986_round_0_rev_0` builds on `ae37e517ebc`. It refuses to decrypt inputs for tools declaring credentials, passes encrypted datasets that match only as binary to tools encrypted, deletes a purged user's grants, looks up output grants in one query, skips the protected-input walk at submission when no input is encrypted, verifies metadata files of protected outputs from the object store backend, and warns when Crypt4GH is enabled without a walltime limit. It also shares the grant checks of submission and dispatch, narrows the generic Crypt4GH extensions to `c4gh` and `crypt4gh`, moves `iter_relpaths` to `galaxy.util.path`, and reworks the tests: integration helpers now authorize with the header the API exposes and call the protection API through `DatasetPopulator`, runner-independent refusal tests run once, failed outputs are checked to serve nothing but encrypted data, and new tests cover tool refusals, binary inputs and datatype redetection.
    commits:
      - sha: a95576c9c7c
        subject: Explain why the dispatch-time job cache search skips protected jobs
        detail: rewords the comment so it no longer contradicts the submit-time search reusing the same user's protected jobs.
        findings: [P3 4]
      - sha: fdf4b0caaae
        subject: Say why crypt4gh is imported inside functions
        detail: adds one module-level comment explaining that `crypt4gh` is a conditional dependency.
        findings: [P3 8]
      - sha: cd54e100736
        subject: Only treat c4gh and crypt4gh as generic Crypt4GH extensions
        detail: replaces the `c[^.]*4gh` pattern with an explicit set and extends the extension helper unit test.
        findings: [P3 6]
      - sha: 16452e13ed8
        subject: Refuse to decrypt inputs for tools receiving user credentials
        detail: makes `_can_decrypt_inputs` refuse tools with `tool.credentials` and updates the admin documentation.
        findings: [P3 2]
      - sha: 804af62f1ae
        subject: Warn when Crypt4GH is enabled without a walltime limit
        detail: logs a warning from `DatasetProtectionManager` when `crypt4gh_enabled` is set and no walltime limit is configured.
        findings: [P3 5]
      - sha: 5865f08ff09
        subject: Delete a purged user's dataset protection grants; drop redundant index
        detail: deletes the user's grants in `UserManager.purge`, drops the separate `user_id` index from the model and migration, and adds a purge unit test.
        findings: [P3 7]
      - sha: f95a4865a81
        subject: Look up the grants of a protected job's outputs in one query
