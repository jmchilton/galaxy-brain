      `UserManager.purge` deletes the user's addresses, authnz tokens and other rows, but left their `dataset_protection_grant` rows, which hold headers sealed to a compute key. Nothing removes expired grants or grants on purged datasets either: the `delete-orphan` cascade only fires on ORM deletes of `Dataset`, which purging doesn't do, so the table grows with every protected output. `UniqueConstraint("user_id", "dataset_id", "scheme")` already provides a `user_id`-leading index, so the separate `index=True` on `user_id` only adds write and storage cost.
