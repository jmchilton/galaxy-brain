  - id: P3 20
    include: true
    title: Metadata-file verification read Galaxy's cache, and could pull whole files into it
    summary: primary files were checked from the backend with get_data_head, metadata files via get_file_name() (cache, whole BAM index download); now read from the backend too.
    implementation_verified: true
    issue: |
      `_is_protected_as_recorded` reads the primary file's header from the object store backend with `get_data_head`, but checked metadata files with `check_crypt4gh(metadata_file.get_file_name())`. On caching object stores that can pull a whole metadata file, such as a BAM index, into the cache just to read its first bytes, and it reads the possibly stale cache the primary check avoids. Verification is also serial, one backend request per output, extra file and metadata file, which may matter for large protected collections on S3.
    fix: |
      `ObjectStore.get_data_head` now takes the object store location arguments, `MetadataFile.get_data_head` reads a metadata file's start from the backend, and verification uses it. A distributed object store unit test reads a metadata file by `alt_name` (it fails without the change), and the BAM index integration test passes. Measuring finish time for large protected collections on S3 remains a suggestion.
    discovered_by:
      - {profile: gx_performance_challenger, model: Claude Opus 5.5, effort: medium}
