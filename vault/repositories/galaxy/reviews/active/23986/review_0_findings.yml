  - id: P2 9
    include: true
    title: Protection API calls bypass populators and duplicate copy_hda
    summary: both integration modules called datasets/{id}/protection through their own raw helpers and repeated copy_hda; now DatasetPopulator helpers.
    implementation_verified: true
    issue: |
      `datasets/{id}/protection` was called through raw `_get`/`_put`: in `test_crypt4gh_grants.py` through `_protection`/`_grant` and inline in three places, and in `test_crypt4gh_execution.py` through separate `_ready`/`_authorize` helpers. `_copy_to_history` and the inline POST in `test_shared_copy_is_refused_before_any_service_call` repeated `DatasetPopulator.copy_hda`.
    fix: |
      Added `get_dataset_protection`, `get_dataset_protection_raw` and `set_dataset_protection_raw` to `DatasetPopulator` and used them, and `copy_hda`, in both modules. The whole grants module and the shared-copy test pass.
    discovered_by:
      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P2 10
    include: true
    title: Grant recording does one SELECT per protected output at job finish
    summary: _record_output_grants queried per output (10k-element collection = 10k SELECTs); now chunked IN queries. The duplicate-insert edge wasn't reproduced but can't happen anymore.
    issue: |
      `DatasetProtectionManager._record_output_grants` called `_get_or_create_grant`, and so `get_grant`, for every protected output. A protected job writing a 10k-element collection made 10k grant lookups in the handler's finish path, nearly all of them misses on fresh datasets.

      Galaxy's session doesn't autoflush, so a grant created earlier in the loop was also invisible to later lookups: two output instances of one dataset would insert duplicate rows and fail on the unique constraint at commit. I found no job that produces two output instances of one dataset, so that edge wasn't reproduced.
    fix: |
      `_record_output_grants` now loads the user's existing grants on all output datasets in `IN` queries chunked by 1000, and keeps grants it creates in the same mapping by dataset id, so a dataset shared by two outputs gets one grant. Integration tests recording output grants (`test_authorized_job_outputs_are_encrypted_for_the_user`, the BAM index test) pass.
    discovered_by:
      - {profile: gx_performance_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P2 11
    include: true
    title: Submission-time check_job_inputs walks and re-queries whole collections for every job
    summary: with the feature on, every non-cached job walked its parameters and re-ran collection queries; now an in-memory is_protected check over inp_data guards it.
    issue: |
      With the feature enabled, `DefaultToolAction.execute` ran `check_job_inputs`, and so `_protected_inputs`, for every non-cached job, whether or not any input was encrypted. For a collection input, `_dataset_instances(value)` re-ran the nested-collection query that `_collect_input_datasets` had already run in the same request. `_read_datasets` also looked up conversions for `<conversion>` inputs before checking `is_protected`. Dispatch already guards the same work with the in-memory `has_protected_inputs(job)`.
    fix: |
      `check_job_inputs` now only runs when `any(is_protected(data) for data in inp_data.values() if data)`, since `inp_data` already holds collection elements, and `_protected_inputs` skips unprotected inputs before looking up their conversions.
    discovered_by:
      - {profile: gx_performance_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P3 1
    include: true
    title: Decrypted inputs still report the wrapper extension to tools
    summary: "$input.ext, staging names and serialize() give fastqsanger.c4gh for plaintext; docs list it as a limitation. Optional, not fixed (behavior choice for the author)."
    issue: |
      `DatasetFilenameWrapper.file_ext` returns `fastqsanger.c4gh` for an input the job decrypts, so `get_staging_path()`, `name_and_ext` and the `serialize()` staging paths produce names like `sample.fastqsanger.c4gh` for plaintext. Tools often branch on `$input.ext` or link inputs as `input.$input.ext` so the program detects the format from the extension; they take the wrong branch or misdetect the format. The admin docs list this as a limitation, but it isn't a design decision in the PR description, and the compute environment already knows which inputs are decrypted and their inner extension (`ProtectedInput.ext`).
    fix: |
      Optional: have `file_ext` ask the compute environment for the decrypted extension, as path rewriting already does. Not fixed on the review branch because it changes what `$input.ext` means for these inputs, which the author documented deliberately. Estimated at about 30 to 60 changed lines with a test.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 2
    include: true
    title: Tools that receive user credentials could decrypt inputs, unlike tools given file sources
    summary: _can_decrypt_inputs refused file-source tools but not <credentials> tools, which can push data out the same way; now refused, with docs and an API test.
    implementation_verified: true
    issue: |
      `_can_decrypt_inputs` refused tools given a `FileSourceConfigFile` because they would send the decrypted data out of Galaxy. Tools declaring `<credentials>` receive the user's secrets for external services and can push data out the same way, but passed.
    fix: |
      `_can_decrypt_inputs` now also refuses tools with `tool.credentials`, and the admin docs say so. The API test added for P3 18 runs a new test tool declaring credentials and asserts the request is refused.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 3
    include: true
    title: Typed wrappers match binary-only inputs through class inheritance, and are then decrypted
    summary: fastqsanger.c4gh matched format="binary" via Crypt4GH(Binary) but the job decrypted it and demanded a grant; now the binary input gets the encrypted file. Red/green API test.
    implementation_verified: true
    issue: |
      `Crypt4GH` subclasses `Binary`, and `Crypt4GH.matches_any` first returns `isinstance(self, datatype_classes)`, so `fastqsanger.c4gh` matches an input with `format="binary"`. `_read_datasets` then decided to decrypt, because `binary` isn't a Crypt4GH extension: the binary-only tool needed an authorization and got plaintext FASTQ. The decisions to match and to decrypt came from two different rules.
    evidence: |
      On `ae37e517ebc`, running a `format="binary"` test tool on an unauthorized `fastqsanger.c4gh` dataset is refused with "You are not authorized to decrypt dataset ...".
    fix: |
      Added `_reads_encrypted`: an input is read encrypted when its parameter accepts a Crypt4GH format, or when the dataset's inner format doesn't match the parameter's formats (it matched through the wrapper class only). The admin docs mention binary inputs. The new integration test `test_binary_inputs_get_the_encrypted_file` runs a `crypt4gh_binary_input` test tool without authorization and gets `crypt4gh`; it fails on the PR and passes on the branch.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 4
    include: true
    title: Dispatch-time job cache comment contradicts same-user reuse
    summary: the prepare() comment said protected jobs are never reused while the submit-time search reuses the same user's; reworded.
    issue: |
      `Tool._may_reuse_job` deliberately reuses the same user's protected jobs, and the docs say so, but the second cache search in `MinimalJobWrapper.prepare()` skips every protected job with the comment "Outputs of protected jobs are encrypted for the job's user, never reuse them". The behavior is safe; the comment states a different rule.
    fix: |
      Reworded the comment to say only the submit-time search, which checks the cached job's user, may reuse protected jobs.
    discovered_by:
