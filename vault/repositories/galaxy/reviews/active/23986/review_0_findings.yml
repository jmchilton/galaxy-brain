findings:
  - id: P2 1
    include: true
    title: Collection paths and JSON-serialized inputs hand tools the encrypted files
    summary: "$collection.all_paths, data_style=paths config files and serialize() read stored paths, so decrypted jobs get ciphertext. Reproduced; root cause is pre-existing Galaxy bug #25040 (filed 2026-11-22); not fixed."
    implementation_verified: true
    issue: |
      `ProtectedInputsComputeEnvironment` points the tool at decrypted copies by overriding the compute environment's input path rewrites. That covers everything built from a `DatasetFilenameWrapper`: `$input`, `#for $e in $collection` and `$collection.paths_as_file`. Several established idioms read paths straight from the model instead:

      - `DatasetCollectionWrapper.all_paths` and `all_metadata_files` read `collection.element_identifiers_extensions_paths_and_metadata_files`, which calls `Dataset.get_file_name()`.
      - `data_collection_input_to_path` and `data_collection_input_to_staging_path_and_source_path` in `wrapped_json.py` back `$collection.serialize` and `<inputs data_style="paths"/>` or `data_style="staging_path_and_source_path"` config files for collection parameters.
      - For single datasets, `DatasetFilenameWrapper.all_metadata_files` feeds `serialize()`'s `metadata_files` from the stored, encrypted metadata files, while `$input.metadata.bam_index` returns the decrypted ones.

      The job still decrypts the element into `_protected/`, but the tool reads the ciphertext and the job ends `ok`. The admin docs say encrypted datasets are decrypted inside collections, and many IUC tools use JSON `inputs` config files or `all_paths`. No integration test passes an encrypted dataset as a collection element.
    evidence: |
      A throwaway test tool running `cat` over `$input1.all_paths` and, as a control, over `#for $e in $input1#`, on a list holding one authorized `fastqsanger.c4gh` dataset: the job ended `ok`, the control output decrypted to the FASTQ plaintext, and the `all_paths` output decrypted to the input's Crypt4GH ciphertext (`crypt4gh\x01...`).
    fix: |
      Have the collection wrapper's `all_paths`, `all_metadata_files` and `serialize`, and the single-dataset `all_metadata_files`, go through the compute environment per element, as the element wrappers do. Add an integration test with a collection input read through `all_paths` or a `data_style="paths"` config file, plus a `#for` loop as a control.

      The bypass predates this PR: on `dev`, Pulsar with `rewrite_parameters: true` hands these accessors Galaxy-side paths instead of the staged ones (#25040). So the fix belongs in Galaxy generally, routing these accessors through the compute environment for every job, rather than in a protected-only hook. This PR depends on it: fixing #25040 first, or alongside, makes collection inputs decrypt as the admin docs describe.

      Not fixed on the review branch. Estimated at about 100 to 150 changed lines with the test.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P2 2
    include: true
    title: Protected-job behavior is scattered as inline protection_scheme branches through MinimalJobWrapper
    summary: about nine job.protection_scheme checks across prepare/fail/finish/cleanup; suggests a per-job protection policy (null object for plain jobs). Not fixed, large refactor.
    issue: |
      `lib/galaxy/jobs/__init__.py` checks `job.protection_scheme`, or calls into `app.dataset_protection`, in at least nine unrelated places: `cleanup_job`, `protection_setup_failure()`, `clear_working_directory`, `_authorize_protected_job`, the job-cache reuse condition in `prepare`, `fail()` (twice), `_finish_dataset` and `finish()`. `JobLike.set_streams` adds a `getattr(self, "protection_scheme", None)` probe, and `BaseJobRunner._finish_or_resubmit_job` calls `protection_setup_failure()` from the `remote_tool_eval` error path.

      Each check is reasonable alone, but together a reader of `fail()` or `finish()` has to know the Crypt4GH lifecycle to follow the generic flow, and nothing reminds the next change to these flows of the protection rules. Some invariants are also enforced twice in different forms: tool output kept out of `dataset.info` in both `_finish_dataset` and `set_metadata.py`, and the job directory never kept in both `cleanup_job` and `clear_working_directory`.
    fix: |
      Have `DatasetProtectionManager` return a per-job policy object where the job is authorized: a real one for protected jobs and a null object for all others. `MinimalJobWrapper` holds it and calls it unconditionally at fixed lifecycle points (cleanup, clearing the working directory, job reuse, redacting info and streams, before import, on fail, on finish, setup failure). The `protection_scheme` column stays as the persisted discriminator used to rebuild the policy, and `JobLike.set_streams` takes an explicit redaction decision from its caller.

      Not fixed on the review branch: estimated at 300 to 500 changed lines across the job wrapper, runners and tests.
    discovered_by:
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
  - id: P2 3
    include: true
    title: set_metadata_portable gains about a dozen output_protector branches
    summary: nullable output_protector mode flag threaded through set_metadata, discover.py and output_collect; suggests an output-persistence strategy object. Not fixed, large refactor.
    issue: |
      `set_metadata_portable` threads `output_protector` through as a nullable mode flag. With a protector it skips validation, records `stored_from_discovery`, strips tool metadata from `file_dict`, swaps `collect_extra_files` for `persist_extra_files`, skips stdout and stderr in `dataset.info` (in two separate conditions), formats tracebacks differently in two places, installs a root logging filter, refuses unnamed outputs, forces `job.protection_scheme`, calls `output_protector.finish(...)`, flips `job.state` and skips `write_job_metadata`. The same optional protector is threaded into `ModelPersistenceContext` (`create_dataset`, `set_datasets_metadata`, `_persist_paths`) and `collect_primary_datasets`.

      Every branch is a place where plain and protected persistence can drift apart, and a step added later can't tell whether it needs a protected variant.
    fix: |
      Define a small output-persistence strategy built once from `metadata_params`: plain persistence by default, `OutputProtector`-backed for protected jobs. Pass it, not an `Optional[OutputProtector]`, to `set_metadata_portable`, `ModelPersistenceContext` and `JobContext`, so the conditionals become method calls. `OutputProtector` already holds most of the logic (`protect_declared`, `without_tool_metadata`, `finish`).

      Not fixed on the review branch: estimated at 250 to 400 changed lines.
    discovered_by:
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
  - id: P2 4
    include: true
    title: The keep-encryption rule for datatype changes is enforced at six entry points
    summary: keeps_encryption checks in datasets/library_datasets/history_contents/controller/PJA, generic modules import Crypt4GH; suggests one datatype-level policy at Registry.change_datatype. Not fixed.
    issue: |
      `keeps_encryption` and `ensure_datatype_change_keeps_encryption` are called from the dataset deserializer, `library_datasets.py`, the bulk change in `history_contents.py`, the legacy controller's datatype list, and `ChangeDatatypeAction` (which also wraps the new type and logs instead of raising), with `redetect_ext` preserving wrappers on top. Generic modules (`post.py`, `managers/datasets.py`) now import the `Crypt4GH` class for `isinstance` checks, against the PR's own boundary that the rest of Galaxy only talks about protected datasets. Any other datatype-change path stays unprotected unless someone remembers the rule.

      Galaxy already has a datatype-level hook, `Data.is_datatype_change_allowed()`, which the deserializer calls right next to the new check, and a single mutation point, `Registry.change_datatype`.
    fix: |
      Generalize the hook into a target-aware policy on the datatype (e.g. `datatype_change_refusal(target) -> str | None`, overridden by `Crypt4GH`), call it from `Registry.change_datatype` and from one shared check used by the API paths that need an early user-facing error, filter the UI datatype list on it, and move the post-job action's wrap-the-requested-type step into `Crypt4GH`.

      Not fixed on the review branch: estimated at about 200 to 300 changed lines.
    discovered_by:
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
  - id: P2 5
    include: true
    title: Destination checks reach across layers and are split between ProtectionDestination.check and command_factory
    summary: wrapper finds its runner via job_handler.dispatcher and a runner-name string compare; two refusals live in build_command. Suggests runner-described capabilities, one refusal stage. Not fixed.
    issue: |
      `MinimalJobWrapper._protection_destination` reaches its runner through `getattr(self.app.job_manager.job_handler, "dispatcher", None)`, then asks the dispatcher three new helpers (`runner_of`, `is_pulsar`, `splits_into_tasks`) and a new runner attribute. `is_pulsar` compares `runner.runner_name == "PulsarJobRunner"`. The wrapper assembles facts the runner already owns, through a back-reference the `getattr` default shows may be missing.

      Refusals are also split: `ProtectionDestination.check` runs while preparing, while `command_factory.build_command` raises for two more conditions (metadata not embedded in the job; Pulsar with remote tool evaluation). Runners therefore catch `ProtectionError` at two stages, with new `except ProtectionError` arms in `runners/__init__.py` and two in `pulsar.py`.
    fix: |
      Have each runner describe its own capabilities (e.g. `runner.protection_capabilities(job_wrapper) -> ProtectionDestination`, overridden by `PulsarJobRunner` instead of detected by name) and pass that into `prepare`. Fold the two `command_factory` conditions into `ProtectionDestination.check`, since both are known before the command is built.

      Not fixed on the review branch: estimated at about 150 to 250 changed lines across runners, the dispatcher and tests.
    discovered_by:
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
  - id: P2 6
    include: true
    title: No test checks the header the browser sends when authorizing
    summary: integration _authorize recrypted the test's own ciphertext, Vitest used a literal; now reads metadata_crypt4gh_header from the API and asserts its value.
    implementation_verified: true
    issue: |
      The key icon sends `metadata_crypt4gh_header`, read from the HDA detailed view (`getCrypt4ghHeader` in `client/src/composables/datasetProtection.ts`), to the user service. No test checked that the API exposes this field or that its value is the dataset's user header: the integration helper `_authorize` built the header from the test's own ciphertext, and the Vitest test passes the literal `"user-header"`. If the serialized metadata changed, every test would still pass while the key icon broke.
    fix: |
      Added `MockRecryptorService.user_recrypt_header`, which takes the base64 header the browser sends. `_authorize` now reads `metadata_crypt4gh_header` from the detailed dataset view and recrypts that, and `test_upload_is_protected_but_not_ready` asserts the field equals the base64 of the uploaded user header. The grants test and four execution tests using `_authorize` (own, shared-recipient, conversion and expiring-keypair cases) pass.
    discovered_by:
      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P2 7
