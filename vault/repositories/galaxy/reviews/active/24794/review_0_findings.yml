findings:
  - id: P3 1
    include: true
    title: Same ListHeader select-all control, two selectors
    summary: histories and zip wizard target the same ListHeader checkbox differently; review branch shares one scoped selector.
    implementation_verified: true
    issue: |
      `histories.select_all` now targets `#history-list .list-header-select-all .g-checkbox`, while `zip_import_wizard.select_all_checkbox` (`navigation.yml:2099`) targets the same `ListHeader.vue` control by its wrapper div, `.list-header-select-all`. The zip selector survived the GCheckbox switch only because it clicks the wrapper div. Four more ListHeader users (`WorkflowList`, `DatasetList`, `LibraryFolder`, `SelectionList`) have no selector yet, so the next select-all test would add a third copy. The next change to ListHeader's checkbox then turns into one CI failure per copy.
    evidence: |
      Grepping `client/src` and `lib` turned up only these two selectors for the control, used by `navigates_galaxy.py:1034` (`histories_purge_all`) and `upload_activity_helpers.py:869` (`select_all_files`). `HistoryList.vue` renders `ListHeader` inside `#history-list`, and `ZipFileSelector.vue` renders it inside `.zip-file-selector`; neither overrides the `select-all` slot. Loading the branch's `navigation.yml` with Galaxy's `Component.from_dict` resolves the new selectors to `#history-list .list-header .list-header-select-all .g-checkbox` and `.zip-file-selector .list-header .list-header-select-all .g-checkbox`. Neither `test_purge_all_histories` nor `test_archive_explorer.py` was run, because this environment has no Galaxy venv or client build.
    fix: |
      Add one `list_header` component in `navigation.yml`, scoped by the page that renders it, and point both callers at `list_header(scope=...).select_all`. This is optional. It's maintenance, not a bug in this CI fix.
