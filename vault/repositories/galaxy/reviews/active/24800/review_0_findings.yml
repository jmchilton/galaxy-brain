findings:
  - id: P3 1
    include: true
    title: No API-level test of the tool listing after an index reload
    summary: optional; the unit test proves the cache clear, but nothing checks that GET /api/tools serves the new name after a reload_tool_source_cache broadcast. Added an integration test.
    implementation_verified: true
    issue: |
      Optional. The bug is `GET /api/tools` serving stale names, labels, sections and versions after a `reload_tool_source_cache` broadcast. The new unit test drives a `CachedToolBox` with a mocked `_store.load_index`, so it shows the payload caches are cleared but not that the API listing picks up the change. The closest integration test, `test_reload_serves_edited_tool_version`, calls `reload_toolbox` (which builds a new toolbox with empty caches) and reads `/api/tools/{id}`, which doesn't go through the cached `to_dict` payloads, so it can't catch this regression.
    fix: |
      Added `TestCachedToolBoxIndexReloadRefreshesListing` to `test/integration/test_tool_source_storage.py`. It boots with `use_cached_toolbox` and a local probe tool, reads the probe's name from `/api/tools?in_panel=False` to warm the cache, renames the probe on disk, re-indexes it with `populate_store_inline`, calls the `reload_tool_source_cache` handler and asserts the listing shows the new name. With the PR's `_invalidate_tool_caches()` line removed, the test fails with `'Probe' == 'Renamed Probe'`.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: low}
