      Galaxy's format lint runs `black --check --diff .` with the pinned `black==26.10.1`. Both edited test files would be reformatted. In `test_dataset_collections.py`, the two wrapped `assert ... == [...]` lists fit on one line. In `test_workflows.py`, `rows={"sample1": [1, "short;long"],"sample2": [2, "--min=10 --max=50"],}` is missing a space and has a magic trailing comma.
