  - id: P3 1
    include: true
    title: Rejection loop only asserts status 400
    summary: control-character loop passes on any 400; pin it to the new error message.
    implementation_verified: true
    issue: |
      The `\n`, `\t` and `\x00` loop in `test_sample_sheet_validating_against_column_definition` only checks `assert_status_code_is(response, 400)`. The same test already expects 400s for other reasons, so an unrelated payload mistake would also pass. Today all three values are rejected by the new check, so the test is correct; it's just not pinned to it.
    fix: |
      Added `assert_error_message_contains(response, "Column 'db_type' contains control characters")` after each 400. The helper was already imported. The test passes for all three values.
    discovered_by:
