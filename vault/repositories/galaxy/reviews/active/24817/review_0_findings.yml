      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P3 2
    include: true
    title: No unit coverage for the control-character check
    summary: restore the unit-level control-character cases that b5b6fbd979c dropped.
    implementation_verified: true
    issue: |
      b5b6fbd979c ("Relax validation requirement for non-sample identifiers") turned this check into a call that discarded its result. The same commit deleted the tab case from `test_sample_sheet_validation_string_type` in `test/unit/data/dataset_collections/test_sample_sheet_util.py`, so nothing caught the no-op. That file already covers every other column-type rule and is the fast place for the per-character matrix. This is optional; the PR's API coverage is already a valid regression test.
