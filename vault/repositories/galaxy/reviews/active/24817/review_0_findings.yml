      Added a parametrized `test_sample_sheet_validation_string_rejects_control_characters` (`\n`, `\t`, `\r`, `\x00`, `\x7f`) and `test_sample_sheet_validation_string_allows_punctuation` (`;`, `--min=10`, `/`, quotes). All five rejection cases fail against the `dev` source and pass with the PR's change.
