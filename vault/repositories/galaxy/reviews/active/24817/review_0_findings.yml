  - id: P3 3
    include: true
    title: TSV export check piggybacks on the job-cache test
    summary: TSV assertions in the use_cached_job test make an export failure look like a caching regression.
    implementation_verified: true
    issue: |
      `test_run_workflow_use_cached_job_with_sample_sheet` is about `use_cached_job`. The PR swaps its row values for nf-core-style strings and adds `__SAMPLE_SHEET_TO_TABULAR__` output assertions in the middle of it. A failure in either now looks like a caching regression. The export check also passes on `dev`, so it's a regression lock, not coverage of the fix.
    fix: |
      Restored the job-cache test to its `dev` form and added `test_sample_sheet_to_tabular_preserves_punctuation` to `test_tools.py`, next to `test_convert_sample_sheet_to_list`. It uses `create_sample_sheet`, runs the tool directly, and asserts the exact output lines. The workflow-framework fixture (`collection_semantics_cat_sample_sheet`) can't host this. Its staging (`staging.py`, `cwl/util.py`) sends `rows` but not `column_definitions`, so it never declares a string column. Both tests pass.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P3 4
    include: false
    title: Column-definition strings still accept control characters
    summary: string default_value/restrictions/suggestions with control characters pass definition validation; optional.
    implementation_verified: true
    issue: |
      Row values are now rejected when they contain control characters, but a `string` column's `default_value`, `restrictions` and `suggestions` (`SampleSheetColumnDefinitionModel`) still accept them. The failure is loud, not silent: a row filled from such a default is rejected at create time. But a definition that carries a value that can never pass is unsupported input, and it's cheaper to reject it up front. This is optional and arguably out of scope.
    evidence: |
      `validate_column_definitions([{"type": "string", "name": "c", "optional": False, "default_value": "a\tb", "restrictions": ["x\ny"], "suggestions": ["p\x00q"]}])` succeeds. `validate_row(["a\tb"], ...)` against the same definition then raises "Column 'c' contains control characters".
    fix: |
      Apply the same `strip_control_characters(v) != v` check to `default_value`, `restrictions` and `suggestions` in a `model_validator` beside `check_nature_of_default`. Optional.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 5
    include: false
    title: New API cases appended to a heavily mutated payload
    summary: rejection/preservation cases reuse a payload mutated three times; a named API test would read better. Optional.
    issue: |
      The preservation and rejection blocks in `test_sample_sheet_validating_against_column_definition` reuse a payload that was mutated three times above them. A dedicated `test_sample_sheet_string_column_rejects_control_characters` would read better and name the regression. This is optional. The unit tests added on the review branch now carry the per-character matrix, so the API block works as an end-to-end check where it is.
    discovered_by:
