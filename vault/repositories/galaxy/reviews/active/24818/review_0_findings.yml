  - name: pr_24818_round_0_rev_0
    revision: 0
    head: 323625a69f8
    pr_title: Tighten secondary_files validation, errors and tests
    description: |
      `pr_24818_round_0_rev_0` builds on `efa3e7bbdaf`. It rejects `secondary_files` at tool creation on an input none of whose formats Galaxy indexes, makes a missing index a job rejection instead of an unexpected failure, and builds the index list from `SecondaryFileInternalJson` on both paths. The help now says when an input that doesn't opt in still gets the list. On the test side it adds API tests for `cram`, `bcf` and `vcf_bgzip` indexes and tool-request variants of the `multiple` and map-over tests, tests BAI/CSI detection on `Bam` with real indexes, follows a converted input through `adapt_dataset`, and drops unit cases the API tests already cover.
    commits:
      - sha: eb8a83cf2b5
        subject: Say when an input without secondary_files still lists the index
        detail: adds to the `authoringHelp.yml` sentence that an input without the option still gets the list when the job passes the same dataset to an input that sets it.
        findings: [P2 1]
      - sha: e92055a6167
        subject: Reject a job whose indexed input has no index as a job error
        detail: adds `MissingIndexError(ValueError)` to `galaxy.tools.runtime`, raises it from `secondary_files_json`, and adds it to the rejections `prepare_job` handles without a traceback.
        findings: [P3 2]
      - sha: 0e9b6ba866c
        subject: Build secondary files as SecondaryFileInternalJson
        detail: makes `secondary_files_json` return `list[SecondaryFileInternalJson]` and has `to_cwl` dump each with `by_alias=True`.
        findings: [P3 4]
      - sha: 8189c840546
        subject: Reject secondary_files on an input whose formats Galaxy never indexes
        detail: adds `_validate_secondary_files` to `create_unprivileged_tool`, walking conditionals, repeats and sections, plus an API test that a `[sam, fasta]` input is refused with a 400.
        findings: [P3 1]
      - sha: 9e7e00e7138
        subject: Test the index of a converted input through adapt_dataset
        detail: replaces the set-only unit test with one that follows an `unsorted.bam` converted to an indexed `bam` through `setup_for_runtimeify` and checks the index is listed.
        findings: [P2 2]
      - sha: 0e213e38be0
        subject: Test the index of cram, bcf and vcf_bgzip datasets end to end
        detail: adds a parametrized API test that links the index of `2.cram`, `bcf_index_metadata_test.bcf` and `test.vcf.gz`, checks `nameext` and compares the bytes with Galaxy's metadata file, and drops the `cram` unit case.
        findings: [P2 3]
      - sha: bab7e1f2096
        subject: Test BAI/CSI detection on the Bam datatype with real indexes
        detail: adds a `test_bam.py` test that builds BAI and CSI indexes of `1.bam` with pysam and checks `Bam.secondary_file_suffix`, and drops the hand-written CSI case from `test_runtime.py`.
        findings: [P3 5]
      - sha: c4942be0464
        subject: Drop unit cases the API tests already cover
        detail: drops the `datatype-without-index` case and the `/api/tools` assertions of the `to_cwl` unit test, keeping the non-user-tool case.
        findings: [P3 6]
      - sha: 323625a69f8
        subject: Test multiple and mapped-over inputs through tool requests too
        detail: runs the `multiple` and map-over tests through both `/api/tools` and tool requests, and maps over `1.bam` and `3.bam` so each element must link its own index.
        findings: [P3 7]
