  - id: P3 1
    include: true
    title: After-commit protocol is hand-threaded through each settle path
    summary: two parallel queues and a queue/run pair at every settle site; fine for 26.0, unify on dev via the follow-up issue.
    issue: |
      Every commit that settles a job must queue before and run after: `prepare` (job cache), `finish`, `fail`, `pause`, `enqueue`, `setup_fetch_data` and `JobHandlerQueue.__handle_waiting_jobs`. The handler keeps its own `settled_jobs` list, repeats `ActionBox.has_after_commit_actions(job)` at three sites and threads a `paused_jobs` out-param through `__filter_jobs_with_invalid_input_states`. `pause()` both queues on the wrapper and returns a bool, so the handler queues the job again and the wrapper's queue is dropped with it. That's harmless today, but any new settle path that forgets one half silently loses the email. The "run every PJA not in `deferred_actions`" loop is also copied in `prepare`, `finish` and the handler.
    fix: |
      Fine for 26.0 as is. On `dev`, collapse this into one mechanism: a small collector shared by `MinimalJobWrapper` and `JobHandlerQueue`, or a session `after_commit` hook, plus one helper for the copied PJA loop. See the follow-up refactor issue.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: thermo_review, model: Claude Opus 5.5, effort: low}
  - id: P3 2
    include: true
    title: Map-over integration test doesn't check collection names
    summary: summary test passed even if no output collection names were listed; now asserts the name.
    implementation_verified: true
    issue: |
      `test_map_over_sends_one_summary_email` checked only the prefix and `(3 ok)`. If `job.output_dataset_collection_instances` came back empty for real map-over jobs, the summary would list no collections and the test would still pass. The unit tests set that association by hand.
    fix: |
