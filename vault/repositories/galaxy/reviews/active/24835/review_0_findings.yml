  - id: P3 4
    include: true
    title: Settled check's plan can flip to a scan of the job table
    summary: synthetic 2.1M-job DB saw a seq scan on job for a 100k map-over; PR's 20M-job benchmark saw nested loop. Unverified on production.
    issue: |
      `ImplicitCollectionJobs.has_job_not_in_states` runs after every mapped-over job with an email PJA settles. On a synthetic Postgres 16 database with 2.1M jobs, a 10k-job map-over used the icjja index into the job primary key (about 11 ms). A 100k-job map-over switched to a sequential scan of `job` filtered by state, at 200–470 ms per check. That cost grows with the server's job table, not the map-over. The PR's own benchmark on 20M jobs always got the nested loop, so the flip seems to depend on the map-over's share of the job table. A small server with a very large map-over is the likely case.
    evidence: |
      `job.id = ANY(ARRAY(SELECT job_id FROM icjja WHERE icj_id = …))` kept the ICJ-side plan on the same data: about 105 ms at 100k and 1.4 ms at 10k.
    fix: |
      Optionally pin the plan to the ICJ side with an `any_(array(...scalar_subquery()))` form of the same filter, after confirming with `EXPLAIN (ANALYZE, BUFFERS)` on a production-sized database. Not changed on the review branch because it couldn't be checked against a real planner here.
    discovered_by:
      - {profile: gx_performance_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P3 5
    include: true
    title: After-commit run reloads every job's PJAs before deduping by map-over
    summary: handler batch lazy-loaded PJAs for every job before skipping duplicates; dedupe now runs first.
    issue: |
      `ActionBox.execute_after_commit` runs after a commit has expired the session. It loaded each job's `post_job_actions` and each `post_job_action` before skipping jobs whose map-over was already reported. When a whole map-over pauses in one handler pass, that's several lazy loads per job inside the handler loop for a single email.
    fix: |
      `execute_after_commit` now checks the map-over id before loading post job actions, and records the id only once the job has after-commit actions. The ICJ association is still loaded once per job; recording `(job_id, icj_id)` before the commit would avoid that too. `test_email_action.py` and `test_job_wrapper_finish.py` pass unchanged.
    discovered_by:
      - {profile: gx_performance_challenger, model: Claude Opus 5.5, effort: medium}
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 6
    include: true
    title: Paused map-overs now send SMTP inline in the handler loop
    summary: walltime and invalid-input pauses now send mail synchronously from the handler monitor loop, with no SMTP timeout. Optional.
    issue: |
      `JobHandlerQueue.__handle_waiting_jobs` calls `ActionBox.execute_after_commit`, which sends mail inline. `send_mail` builds `smtplib.SMTP(config.smtp_server)` with no timeout. Before this PR pausing never sent mail; now walltime and invalid-input pauses can, and they block dispatch for all users while SMTP responds. The copied-job case already did this before the PR. The impact is bounded: one email per map-over per pass, and only with email on. Optional on a release branch.
    fix: |
      Note it, or send asynchronously (Celery) on `dev`; see the follow-up refactor issue. A global SMTP timeout in `send_mail` would change every mail path, so it wasn't added on the review branch.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 7
    include: true
    title: New helpers are untyped
    summary: annotated the new EmailAction/ActionBox helpers; left their names alone to match the PR's merge-forward notes.
    implementation_verified: true
    issue: |
      `EmailAction._job_completed`, `_map_over_completed`, `_send` and `ActionBox.has_after_commit_actions`/`execute_after_commit` take untyped arguments, though `Job` is already imported into `post.py`. `_job_completed`/`_map_over_completed` also return a message, not a flag, so a name like `_completion_message` would read better at the `if completed:` call site. Cheap nit.
    fix: |
      Annotated `job: Job`, `implicit_collection_jobs: ImplicitCollectionJobs`, `jobs: Iterable[Job]` and `completed: str`. With `job` typed, mypy flags `job.history.name` as possibly `None`, so `_send` now asserts `job.history`; `execute()` logs the failure as before. The methods keep their names because the PR's "Merging forward" notes refer to them.
    discovered_by:
