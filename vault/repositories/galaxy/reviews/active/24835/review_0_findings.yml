findings:
  - id: P2 1
    include: true
    title: Cached-copy and pause settle paths have no test
    summary: new after-commit wiring in the handler copy path and pause paths was untested; added cached and failed-element integration tests.
    implementation_verified: true
    issue: |
      Several new after-commit call sites have no coverage: the handler's copied-job path, `MinimalJobWrapper.prepare`'s job-cache copy, the walltime and invalid-input pauses in `JobHandlerQueue`, and the over-quota pause in `enqueue()`/`setup_fetch_data`. Each needs its own `has_after_commit_actions`/run pairing, so these are the paths most likely to regress silently. The unit tests call `ActionBox.execute_after_commit` directly, and the wrapper test covers only `finish()` and `fail()`. No integration test covers a map-over with mixed outcomes or paused jobs.
    fix: |
      Added `test_cached_map_over_sends_one_summary_email`, which reruns a map-over with `use_cached_job` and asserts exactly one summary. With the handler's copied-job queuing disabled it fails, so it covers that path. Added `test_failed_element_sends_error_and_paused_summaries`, a two-step workflow where one element fails and its dependent pauses; it asserts one `(1 error, 2 ok)` and one `(2 ok, 1 paused)` summary. That checks `fail()` and paused jobs in the summary end to end, but an OK sibling settles last and sends it, so the test still passes with either pause path's queuing disabled. `prepare`'s job-cache copy and the invalid-input, walltime and over-quota pause paths are still untested; a test would need the paused job to settle last.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: low}
