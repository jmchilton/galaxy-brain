        subject: "mothur: return False for non-positive distance matrix counts instead of assert"
        detail: swaps `assert sequence_count > 0` for `return False`, drops the redundant `line_num == 0` guards and adds a `0` count sniff case.
        findings: [P3 1]
      - sha: 2725f5bab17
        subject: "mothur: move empty CountTable set_meta doctest to pytest"
        detail: removes the `Bunch`/lambda doctest and adds a blank-line case to the pytest CountTable test.
        findings: [P3 2]
