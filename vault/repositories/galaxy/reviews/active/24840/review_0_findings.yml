        subject: "mothur: add regression tests for empty/short-input fixes"
        detail: adds pytest cases for CountTable, GroupAbund, AlignCheck, DistanceMatrix and SffFlow `set_meta` and for the Pairwise, LowerTriangle and Square distance-matrix sniffers, using a `MockDataset` whose `has_data()` is size based.
        findings: [P2 2]
      - sha: 732565e6f45
        subject: "mothur: accept integer (phylotype) labels in Otu/Sabund sniffers"
        detail: allows plain integers in `MOTHUR_LABEL_RE`, applies the `<= 1` bound only to decimals, fixes the comment and doctest, and adds phylotype-style sniff cases.
        findings: [P2 1]
