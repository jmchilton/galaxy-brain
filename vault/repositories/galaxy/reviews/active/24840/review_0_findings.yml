      `pr_24840_round_0_rev_0` builds on `67d7e1ca88a`. It lets the Otu and Sabund sniffers accept integer labels again, so phylotype list/rabund/sabund outputs sniff as before. It replaces the distance-matrix `assert` with `return False`, and adds `test/unit/data/datatypes/test_mothur.py`, where each empty- or short-input fix gets a case that fails on `release_26.2`. The CountTable doctest moves into that module.
