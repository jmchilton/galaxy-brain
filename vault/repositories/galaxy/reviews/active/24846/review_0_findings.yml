findings:
  - id: P3 1
    include: true
    title: Comments still say `Filtering` drops free text
    summary: four comments in CuratedWorkflowList.vue and ToolsList.vue justify workarounds with the bug this PR fixes; reworded.
    implementation_verified: true
    issue: |
      After this change, `Filtering` keeps plain words when it rebuilds a query without an `autoFilterKey`. Several comments still give "drops free text" as the reason for a workaround. In `CuratedWorkflowList.vue`, a file this PR edits, those are `toggleRunnable()`, `searchText()` and `toggleCollection()`. In `ToolsList.vue`, `applyFilter`'s picker path says "`Filtering` would drop the free text". `ToolsList` builds its `Filtering` with no `autoFilterKey`, so this PR makes that comment false too. The workarounds are still justified for their other reasons: a leftover `c:` term, words after an unquoted filter folding into its value, and repeated filters merging. A comment that blames the fixed bug invites someone to remove the workaround, or to add a new one, for the wrong reason.
    fix: |
      Reworded the four comments to drop the free-text claim and keep the reasons that still hold.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 2
    include: true
    title: Wider effect on Grid lists, FilterMenu and ToolsList is undocumented
    summary: the fix also changes every Grid list search, FilterMenu advanced search and ToolsList tag toggling; docstring updated, description line optional.
    issue: |
      The PR description frames this as a workflow-list fix. The `filtering.ts` change applies to every `Filtering` that has no `autoFilterKey` and gets `sourceFilterText`. That covers every Grid config through `GridList.vue` `validatedFilterText()` and tag clicks, `FilterMenu.vue` advanced-search submit, and `ToolsList.vue`'s non-picker `setFilterValue` path. For example, a Grid search for `foo tag:bar` now sends `foo tag:bar` instead of `tag:bar`. These all look like improvements, and the existing Grid, FilterMenu and ToolsList tests pass. The `getFilterText` docstring for `sourceFilterText` still only mentions `autoFilterKey` and quoting.
    fix: |
      Added a sentence to the `sourceFilterText` docstring saying that without an `autoFilterKey`, its plain words are written first, as typed. Optionally, add a line to the PR description so release-branch reviewers know Grid list and advanced searches change too.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
