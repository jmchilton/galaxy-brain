    pr_title: Framework test and single decompression for checksum with decompress
    description: |
      `pr_24861_round_0_rev_0` builds on `15b1e13ac15`. It adds framework tool tests that check `checksum` with `decompress="true"` end to end from tool XML, and makes `verify()` decompress the output once for both assertions and checksums, so a corrupt compressed output raises the same labeled `AssertionError` either way. It also moves the new tests' `gzip`/`hashlib` imports to the module top and folds the message-only test into the parametrized cases.
    commits:
      - sha: f2a1053f1b7
        subject: Add framework tool tests for checksum with decompress
        detail: adds two `validation_tar_gz` tests, one checking the compressed and decompressed sha1 of the same gz output and one `expect_test_failure` test with the compressed sha1 plus `decompress="true"`.
        findings: [P2 1]
      - sha: 3411b0b9059
        subject: Move test imports to module top
        detail: hoists `gzip` and `hashlib` out of each new test in `test_verify_function.py`.
        findings: [P3 2]
      - sha: 32f07badc36
        subject: Decompress output once for assertions and checksum, with labeled error
        detail: decompresses once in `verify()` inside a single labeled `try`, passes the bytes to `verify_assertions` and `_verify_checksum`, and adds a corrupt-input test for the assertions path.
        findings: [P3 1]
      - sha: e8c3915dd10
        subject: Fold checksum message test into parametrized cases
        detail: replaces `expect_pass` with an `error_match` per case and drops `test_checksum_mismatch_says_it_is_over_decompressed_content`.
        findings: [P3 3]
