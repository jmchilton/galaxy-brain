      `galaxy.tool_util.linters.tests._cleanup_pydantic_error` already drops the `For further information visit https://errors.pydantic...` lines from the same `RequestParameterInvalidException(str(e))` text that `tool_util/parameters/model_validation.py` raises. The new private `_single_line_reason` in `workflow/modules.py` is a second copy of that logic, differing only in joining with `"; "` instead of newlines.
