findings:
  - id: P2 1
    include: true
    title: Select all can't unselect a folder of empty folders below a selected folder
    summary: Select-all icon shows SELECTED via ancestor but onSelectAll checks only selected files, so the click reselects and nothing changes; release_26.0 clears it.
    implementation_verified: true
    issue: |
      `onSelectAll` decides whether to unselect (non-paginated) from `selectionModel.value.pathExists(current.url)` alone, i.e. from selected files. The select-all icon now comes from `checkIfAllSelected` → `isDirectorySelected`, which counts a folder as selected through an ancestor. When the current folder's subtree has no selected files (e.g. a recursive listing that returns only empty subfolders), the box shows selected but clicking it takes the select path: each subfolder toggles off through `selectDirectoryRecursive`, the current folder is pushed into `selectedDirectories`, and its subfolders count as selected again through it. The click changes nothing on screen, while on `release_26.0` it clears the rows.

      `selectDirectoryRecursive` already decides with `isDirectorySelected(record) || pathExists(record.url)`, so the select-all toggle diverges from its sibling path.
    evidence: |
      The new spec (recursive listing returns only the `Directory` entries of `directory1RecursiveResponse`; click directory1, open directory1, open subdirectory1, select all) fails on `bd5821aac20` with `expected 'success' to be 'default'` and passes with the fix.
    fix: |
      Made `onSelectAll` unselect when `isDirectorySelected(urlTracker.current.value) || selectionModel.value.pathExists(urlTracker.current.value.url)`, matching `selectDirectoryRecursive`, and added `should unselect all in a folder of empty folders below a selected folder` to `FilesDialogRecursiveSelection.test.ts`. All 28 `FilesDialog` specs pass.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 1
    include: true
    title: Loose assertions in the recursive selection spec
    summary: not.toBe(SELECTED) passes on MIXED; toBeGreaterThan(0) and bare "success" don't pin the omitted file.
    implementation_verified: true
    issue: |
      In `should show a selected folder as mixed after unselecting a folder below it`, `expect(row(subDirectoryId)._rowVariant).not.toBe(SELECTED)` also passes on `MIXED`, although after the unselect the subfolder has no selected files and no selected folder above it. In `should not count a file the listing did not return as selected`, `toBeGreaterThan(0)` only says some file is unselected, and it compares against the bare string `"success"` where the rest of the file uses `SELECTION_STATES`. The test drops exactly `filesOnly[0]`, so it can check that file and the others by row.
    fix: |
      Asserted `SELECTION_STATES.UNSELECTED` for the subfolder, checked that the omitted file's row is `UNSELECTED` and every other file's row `SELECTED`, and asserted the select-all box is `MIXED` instead of not `SELECTED`.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: low}
