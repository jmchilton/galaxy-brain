    pr_title: Fix falsy rename values, share step input resolution, add rename tests
    description: |
      `pr_25002_round_0_rev_0` builds on `8dd9549cab9`. It makes `$(inputs.name)` render an unconnected tool parameter set to `0` or `false` instead of an empty string, extracts one step-input resolution helper shared by the `when` expression and the rename, and moves the collection-of-values check into a named predicate. It also adds framework tests for falsy values and for a connected tool parameter, a vitest for rename-reference ports offered by `validInputTerminals()`, a shared client predicate for names a step already owns, and a single Playwright `new_page` call. Finally, it passes the resolved values to the rename as an argument next to `replacement_dict` rather than on a transient `PostJobAction` copy.
    commits:
      - sha: 8c0bff7abbe
        subject: Rename from falsy tool parameter values, not an empty string
        detail: reads the step state directly when `replacement_for_input` drops a falsy value, with a framework test for `0`, a tool `false` and a connected `false` boolean input.
