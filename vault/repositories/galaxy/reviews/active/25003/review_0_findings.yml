        subject: Add populator helpers for history-subscriptions
        detail: adds `subscribe_history_viewer`/`unsubscribe_history_viewer` and uses them in the populator and in `test_invocation_sse.py` and `test_history_sse.py`.
        findings: [P2 4]
      - sha: 4612fea0ac8
        subject: Share SSE integration test scaffolding
        detail: adds `SSEIntegrationTestCase` to `integration_util` and `job_states_for`/`invocation_states_for` to `galaxy_test.base.sse`, used by both new integration files.
        findings: [P3 6]
      - sha: 8c63ea6a447
        subject: Cover a malformed id in the viewer subscription test
        detail: subscribes the viewer to `["notanid", published_history_id]` so the test shows a bad id doesn't drop the valid one.
        findings: [P3 11]
      - sha: b2233408aec
        subject: Document that viewer access is checked at subscribe time
