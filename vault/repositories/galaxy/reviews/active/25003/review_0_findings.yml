  - id: P3 1
    include: true
    title: "`_delete_jobs` uses `RETURNING` on SQLite versions that lack it"
    summary: With SSE on, invocation cancellation runs UPDATE ... RETURNING unconditionally; SQLite < 3.35 has no RETURNING, and Galaxy keeps a fallback for it elsewhere.
    implementation_verified: true
    issue: |
      With a publisher listening, `WorkflowInvocation._delete_jobs` always adds `.returning(Job.id, Job.user_id, Job.session_id, Job.history_id)`. Galaxy still supports SQLite older than 3.35, which has no `RETURNING`: `History._next_hid` falls back for it, and `JobHandlerQueue` checks `supports_returning()`. Enabling SSE on such an install makes `cancel_invocation_steps` fail. MySQL also lacks `UPDATE ... RETURNING` (`mysql.dialect().update_returning` is False), but `_next_hid` already requires it on every non-SQLite database, so that case is moot. This is narrower than the original P2: only old SQLite with SSE on.
    fix: |
      `_delete_jobs` now checks `sa_session.get_bind().dialect.update_returning`. SQLAlchemy sets it from the SQLite version, and checking it avoids the `supports_returning` probe, which opens a second connection mid-transaction. When it is False, `_delete_jobs` selects the affected rows with the statement's `whereclause`, then runs the bare `UPDATE`. Added `test_cancelled_invocation_steps_publish_their_jobs_deleting`, parametrized over `update_returning`. It asserts the `deleting` record and that no statement uses `RETURNING` in the fallback case, and the fallback case fails on the PR head.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 2
    include: true
    title: Viewer access is checked only at subscribe time
    summary: A viewer keeps receiving ids/states for a history made private after subscribing; small leak, worth documenting.
    issue: |
      Viewers now receive invocation and job ids and states, so the subscription endpoint checks access. The check only runs at `POST /api/events/history-subscriptions`, though. If the owner later makes the history private or unshares it, an existing subscription keeps receiving `history_update`, `invocation_update` and `job_update` for it until the viewer unsubscribes or disconnects. The leak is small: ids and states only, and refetching them is still access controlled. Optional.
    fix: |
      Added a sentence to `doc/source/admin/sse_updates.md` recording this behavior. Re-checking access at dispatch time is the alternative if the leak isn't acceptable.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 3
    include: true
    title: Anonymous job events reach nobody after the user logs in
    summary: Jobs keep user_id None and the invalidated session after login; job_update routes by those while history_update follows the history owner.
    implementation_verified: true
    issue: |
      `invocation_update` and `history_update` route by the history's owner, but `job_update` routes by `job.user_id`, falling back to `job.session_id`. When an anonymous user logs in, `handle_user_login` invalidates the session and `_associate_user_history` gives the anonymous history to the user. Its running jobs keep `user_id=None` and the old session, so their `job_update` events reach nobody, while `history_update` for the same history reaches the new owner. The new owner can refetch those jobs, since `JobManager._user_can_access_job` accepts access through the history.
    fix: |
      `_record_job` now falls back to `job.history.user_id` when the job has no user. This loads the history only for anonymous jobs. `_delete_jobs` keeps `Job.user_id`, because invocations always have a user. Added `test_anonymous_job_follows_its_history_to_the_user_who_logs_in`, which fails on the PR head, and updated the `JobUpdate` docstring and `sse_updates.md`. The PR description's routing sentence needs the same change.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 4
    include: true
    title: Each event-driven wait re-fetches the current user; jobs without a history request `histories/None`
    summary: users/current is fetched on every SSE wait (uncached); job_history_id can return None and the wait then GETs histories/None.
    issue: |
      Each `wait_on_sse` call with a history issues `GET histories/{id}` and `GET users/current`, and job waits add `GET jobs/{id}`, all to decide whether to subscribe as a viewer. `wait_for_jobs` and `wait_for_workflow` run many waits back to back. The PR reports SSE-enabled `test_jobs.py` at 4m27s against 3m16s polling. `job_history_id` also returns `None` for a job without a history, and `_subscribe_to_history_owned_by_others` then requests `histories/None`. Test framework only.
    fix: |
      `GalaxyInteractorHttpMixin._current_user_id` now caches the user id per API key, since tests switch users by swapping the interactor's key (`_different_user`). `wait_on_sse` skips the subscription when the history id resolves to `None`.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: gx_performance_challenger, model: Claude Opus 5.5, effort: medium}
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
