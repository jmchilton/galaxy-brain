findings:
  - id: P2 1
    include: true
    title: "`invocation_update` and `job_update` handlers copy the same fan-out"
    summary: Two ~40-line queue-worker handlers repeat the owner/session/viewer grouping; none of their routing branches had tests.
    implementation_verified: true
    issue: |
      `invocation_update` and `job_update` in `lib/galaxy/queue_worker/__init__.py` repeat one algorithm: encode each item, group by user (and for jobs, session) and history, track owners per history, and push to owners and then to history viewers, excluding owners. They differ only in event name, list key, id field, and the job resync lists. A third entity event would copy it again. No test reached owner exclusion, anonymous session delivery, or resync fan-out to users, sessions and viewers. The integration waits poll for anonymous users, and the publisher unit tests stop at the dispatcher call.
    fix: |
      Added `_push_routed_items(sse_manager, encode, event, list_key, routed, event_id)` taking `RoutedItem(item, user_id, session_id, history_id)` NamedTuples. Both handlers build items and call it, and `job_update` then sends its resync events. Added `test/unit/app/queue_worker/test_sse_entity_updates.py` with a real `SSEConnectionManager` and `IdEncodingHelper`. It covers an owner subscribed to their own history getting one event, viewers getting only that history's items, session delivery, resync to users, sessions and viewers, and `invocation_update` routing. The tests pass on both the PR's handlers and the refactor.
    discovered_by:
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P2 2
    include: true
    title: Pending changes are stored as positional tuples and rebuilt into TypedDicts
    summary: PendingChanges holds tuples with three adjacent int|None ids; the publisher unpacks them by position into TypedDicts defined in queue_worker.
    issue: |
      `PendingChanges.invocations` and `.jobs` hold positional tuples documented only by comments. The job tuple has three adjacent `int | None` ids (user, session, history), so swapped arguments at any `record_job_change` call site type-check. `_send_invocation_updates` and `_send_job_updates` unpack the tuples by position and rebuild `InvocationUpdate`/`JobUpdate`, which live in `queue_worker`. `_send_job_updates` also groups by stringly `("user", id)`/`("session", id)` keys. `record_invocation_change` sits in the 14k-line `galaxy/model/__init__.py` while `record_job_change` is in `pending_changes.py`.
    fix: |
      Moved `InvocationUpdate` and `JobUpdate` into `galaxy.model.pending_changes`, where `queue_worker`, `sse_dispatch` and the publisher import them. `PendingChanges` now stores them keyed by id. Both recorders now live there: `record_invocation_change` still takes the invocation, so the history owner is loaded only while a publisher listens, and `record_job_change` is keyword-only. `_send_invocation_updates` filters `pending.invocations.values()`, and `_send_job_updates` groups by `(user_id, session_id)`.
    discovered_by:
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P2 3
    include: true
    title: Event-driven test waits accrete onto `BasePopulator` in a 5.5k-line file
    summary: ~150 lines of SSE transport (listener lifecycle, viewer subscription, predicates) added to populators.py rather than galaxy_test/base/sse.py; not on the branch.
    issue: |
      `lib/galaxy_test/base/populators.py` gains `_sse_listener`, `wait_on_sse`, `_subscribe_to_history_owned_by_others`, `_current_user_id`, `wait_on_job_update`, `wait_on_history_update` and `wait_on_invocation`. That code is transport: it opens the stream, subscribes and unsubscribes as a viewer, and holds the event predicates. It belongs next to `SSELineListener` and `wait_on_events` in `galaxy_test/base/sse.py`. `wait_on_job_update(job_id: str | None, ..., history_id: str | None)` is also a nullable-mode API: `job_id=None` means "any job in this history", enforced by an `assert` inside a closure.
    fix: |
      Move this into an `SSEWaiter` in `galaxy_test/base/sse.py`, built from the interactor, that owns the enabled check, the listener lifecycle, viewer subscription and the job, invocation and history predicates. The populator would keep thin `wait=partial(...)` hooks into `wait_on_state`. Split `wait_on_job_update` into per-job and per-history waits. Not on the review branch: moving the code is over the size threshold. The branch's smaller fixes (P3 4, P2 4) touch the same methods.
    discovered_by:
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
