    head: 860a42132cc
    pr_title: Typed pending changes, shared SSE fan-out and test scaffolding, RETURNING fallback for invocation SSE events
    description: |
      `pr_25003_round_0_rev_0` builds on `e9fa3cda089`. On the producer side, it stores pending invocation and job changes as the `InvocationUpdate`/`JobUpdate` TypedDicts, now defined once in `galaxy.model.pending_changes` beside both recorders, and types the publisher's dispatcher as a two-method Protocol. It falls back from `UPDATE ... RETURNING` when cancelling invocation jobs on databases without it, and routes an anonymous job's events to its history's owner once that history has one. On the consumer side, it extracts the owner/session/viewer fan-out the `invocation_update` and `job_update` handlers copied, and applies the same owner de-duplication to `history_update` viewers, with unit tests against a real `SSEConnectionManager`. In the test framework, it caches the current user id for event-driven waits, adds populator helpers for history subscriptions, moves shared SSE integration scaffolding into `SSEIntegrationTestCase` and `galaxy_test.base.sse`, gives `SSELineListener` one wait primitive, and tightens three tests. It also documents subscribe-time access checks and updates the `enable_sse_updates` description.
    commits:
      - sha: 3eb490991b7
        subject: Store pending invocation and job changes as typed records
        detail: moves `InvocationUpdate`/`JobUpdate` and `record_invocation_change` into `galaxy.model.pending_changes`, stores the records keyed by id, makes `record_job_change` keyword-only, and groups job recipients by `(user_id, session_id)`.
        findings: [P2 2]
      - sha: 36adad65c9b
        subject: Share fan-out between invocation_update and job_update handlers
        detail: adds `_push_routed_items` and a `RoutedItem` NamedTuple in `queue_worker`, and unit tests for owner de-duplication, session delivery and resync fan-out.
        findings: [P2 1]
      - sha: 732339a1a99
        subject: Skip owners in history_update viewer fan-out too
        detail: passes each history's owners as `exclude_user_ids` in `history_update` and updates its docstring.
        findings: [P3 7]
      - sha: 69d92d1d2a6
        subject: Fall back from RETURNING when cancelling invocation jobs
        detail: checks `dialect.update_returning` in `_delete_jobs` and selects the affected jobs before a bare `UPDATE` when it is False.
        findings: [P3 1]
      - sha: ab7df80ed9f
        subject: Route anonymous job events to their history's owner
        detail: makes `_record_job` fall back to `job.history.user_id` when the job has no user.
        findings: [P3 3]
      - sha: a35765c0926
        subject: Type the publisher's dispatcher as a Protocol; name job dispatch fields in tests
        detail: "adds `ChangeEventDispatcher`, drops the `type: ignore` comments in the unit tests, and records a `JobDispatch` dataclass in `RecordingDispatcher`."
        findings: [P3 9]
      - sha: 7a460a3e7c3
        subject: Cover the job dispatch in the dispatch failure test
        detail: adds a job to the failing transaction and asserts its dispatch is attempted after the invocation dispatch fails.
        findings: [P3 10]
      - sha: 549631919ca
        subject: Give SSELineListener one wait primitive
        detail: reimplements `wait_for_event` and `wait_for_event_where` on `wait_for_matching_event_count_above`.
        findings: [P3 8]
      - sha: effbd99122f
        subject: Cache the current user id for SSE waits; skip subscribing for jobs without a history
        detail: caches `users/current` per API key on `GalaxyInteractorHttpMixin` and skips the viewer subscription when a job has no history.
        findings: [P3 4]
