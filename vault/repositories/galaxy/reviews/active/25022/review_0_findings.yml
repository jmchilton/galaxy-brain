findings:
  - id: P2 1
    include: true
    title: "Migration ignores Pulsar job ids that are not Galaxy ids (`assign_ids: uuid`)"
    summary: uuid-named entries were always reported as "no Galaxy job" and the admin told to delete them. Reproduced and fixed.
    implementation_verified: true
    issue: |
      `migrate_embedded_pulsar_persistence` treats each index entry name as `model.Job.id` (`session.get(model.Job, int(job_id)) if job_id.isdigit()`). Pulsar names the entry after its own job id, which equals the Galaxy id only with the default `assign_ids: galaxy`. With `assign_ids: uuid` every entry is a 32-character hex id, so the script reports every live job as "no Galaxy job with this id" and the closing message tells the admin to delete it. The test encoded this: its uuid entry was expected to be left with that reason.

      The runner already handles this case: `PulsarJobRunner.__async_update` resolves a 32-character id through `model.Job.job_runner_external_id`, which Galaxy sets from Pulsar's returned id for every Pulsar job (`set_job_destination(..., external_id=external_job_id)`).
    evidence: |
      With a running job whose `job_runner_external_id` is a uuid and an entry named after it, the migration on `5a5b2cc11c0` returns `reason='no Galaxy job with this id'` instead of moving it to `<source>/main/_default_-active-jobs/<uuid>`.
    fix: |
      Added `_job_for_pulsar_job_id`, which keeps the primary-key lookup for numeric names and looks other names up by `job_runner_external_id`. The migration test now adds a running job with a uuid external id and expects its entry to move; the random uuid entry stays as the unknown case. An entry written during setup, before Galaxy records the external id, still shows as unknown, which only matters for a job interrupted mid-submit.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P2 2
    include: false
    title: Point-release upgrade strands queued jobs unless the admin runs a manual script; each handler could adopt its own entries
    summary: design suggestion, not fixed on the branch; handler could move its own non-terminal entries at startup with the existing helper.
    issue: |
      After this lands in a 26.2 point release, every site using the default directory, including single-handler sites that never had the bug, moves to `<data_dir>/pulsar_persisted_data/<server_name>`. Entries left in the old directory are no longer recovered: as the PR description notes, a job queued at the upgrade restart stays queued, and jobs in postprocessing are not staged out again. The only runtime signal is a startup log warning, and point-release upgraders rarely read upgrade notes.
    fix: |
      The migration helper already does the hard part, and a handler can run it safely for itself in `__init_pulsar_app`, before `PulsarApp(**conf)` calls `recover_active_jobs`: move only entries whose job has `handler == self.app.config.server_name` and a non-terminal state. Each entry belongs to one handler, so concurrent handler startups never touch the same file, and a rename within `data_dir` is atomic. For example, add an optional `handler` filter to `migrate_embedded_pulsar_persistence`, call it from the default branch where the warning is now, and keep the warning for whatever is left (other handlers' or unrecoverable entries). The script then remains for explicit `persistence_directory` configs and cleanup. If you prefer to keep it manual, the upgrade note in the PR description should go into the 26.2 release notes, not only the sample config.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 1
    include: true
    title: Startup warning keeps firing after the migration script ran
    summary: script leaves missing/terminal entries in place, so the warning repeated forever with nothing to do. Reworded.
    issue: |
      The script deliberately leaves entries for missing or terminal jobs in the shared directory. `active_job_index_entries(base_directory)` still finds them, so every handler restart logs "Stop all job handlers and run scripts/migrate_embedded_pulsar_persistence.py" again, though running it changes nothing.
    fix: |
      Added a sentence to the warning saying that entries the script leaves in place belong to no active job and can be deleted.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 2
