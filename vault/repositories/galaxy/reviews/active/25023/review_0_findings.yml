branches:
  - name: pr_25023_round_0_rev_0
    revision: 0
    head: 391e46a8a1e
    pr_title: Single writer for remote evaluation files and stricter Pulsar remote evaluation tests
    description: |
      `pr_25023_round_0_rev_0` builds on `ff96b8bb47c`. It makes `prepare()` the only writer of `job_io.json` and `compute_environment.json`: compute environments now supply the `job_io` contents and unstructured paths through two `ComputeEnvironment` hooks, and Pulsar's `_setup_remote_tool_evaluation` rewrite is gone. It types the paths payload as a `TypedDict`, reads `remote_command_line` once per Pulsar queue and prepare step instead of querying per access, and returns False instead of asserting when a job has no tool. It documents that data table and select option paths aren't staged under remote evaluation. On the test side, it asserts the exact input size in the recorded command line and adds a test that `compute_environment.json` maps inputs under the Pulsar job's `inputs/`, which fails when this PR is merged with #25021's current head. It shares the input-size job helper and drops the `load_contents` unit test that `param_value_from_file` covers on Pulsar.
    commits:
      - sha: 7fc8f43c177
        subject: Share input-size job helper in Pulsar remote evaluation tests
        detail: adds `_run_input_size_job` to `TestPulsarRemoteToolEvaluation` and uses it in `test_command_line_recorded` and `test_object_store_configuration_not_sent`.
        findings: [P3 6]
      - sha: b0837690e28
        subject: Assert Pulsar remote evaluation records staged input paths
        detail: asserts `echo '4 4'` in the recorded command line and adds `test_evaluated_with_staged_input_paths`, which checks that the Pulsar-side `compute_environment.json` maps the input under the Pulsar job's `inputs/`.
        findings: [P2 2]
      - sha: 3a73bd17da8
        subject: Drop load_contents unit test covered by Pulsar integration tests
        detail: removes `test_load_contents_reads_galaxy_file_before_compute_path_exists` and keeps the `null` `expression.json` case.
        findings: [P3 5]
      - sha: e80dd614822
        subject: Report no remote evaluation for jobs without a tool instead of asserting
        detail: replaces `assert self.tool` in `remote_command_line` with a `self.tool is None` check that returns False.
        findings: [P3 2]
      - sha: ea842fac1d2
        subject: Read remote_command_line once per Pulsar queue and prepare step
        detail: hoists the property into a local in `queue_job` and `__prepare_job`, so the `JobExportHistoryArchive` query no longer runs once per input dataset.
        findings: [P3 1]
      - sha: e75919a9491
        subject: Document that remote evaluation does not stage data table paths
        detail: adds a paragraph to `doc/source/admin/jobs.md` saying data table and select option paths must be readable at the same path where the job runs.
        findings: [P2 3]
      - sha: 0dc2304a14f
        subject: Type remote evaluation paths as a TypedDict
        detail: turns `RemoteEvaluationPaths` into a `TypedDict` with the four keys and defines it above `RemoteComputeEnvironment`.
        findings: [P3 3]
      - sha: 391e46a8a1e
        subject: Write remote evaluation files once, from the compute environment
        detail: adds `ComputeEnvironment.remote_evaluation_job_io` and `remote_evaluation_unstructured_paths`, overrides them in `PulsarComputeEnvironment`, and removes `PulsarJobRunner._setup_remote_tool_evaluation`.
        findings: [P2 4]
