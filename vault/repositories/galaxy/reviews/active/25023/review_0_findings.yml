findings:
  - id: P2 1
    include: true
    title: "Semantic conflict with #25021: Pulsar `compute_environment.json` would record Galaxy-side paths"
    summary: "Merged with #25021's head 4369a2a4dcc, remote evaluation on Pulsar gets Galaxy object-store paths; merges cleanly as text."
    implementation_verified: true
    issue: |
      `remote_evaluation_paths()` builds the Pulsar `compute_environment.json` from `PulsarComputeEnvironment.input_path_rewrite`, `input_extra_files_rewrite` and `input_metadata_rewrite`, and relies on them returning Pulsar paths. #25021's current head (`4369a2a4dcc`, open) changes all three to return the Galaxy-side path and record the Pulsar path in `_evaluated_path_rewrites`, which only `ToolEvaluator._rewrite_evaluated_paths()` applies after a Galaxy-side `build()`. Remote evaluation never runs that on the Galaxy side, and `RemoteComputeEnvironment` has no rewrites, so whichever PR lands second sends the Pulsar evaluator Galaxy object-store paths for inputs, extra files and metadata files. That breaks every Pulsar destination that doesn't share Galaxy's filesystem.

      The description's claim that the `load_contents` commit "is the same commit as in #25021, so the two PRs merge cleanly" is also stale: #25021 has since reverted it.
    evidence: |
      `git merge-tree --write-tree ff96b8bb47c 4369a2a4dcc` merges without conflicts. With the merged `pulsar.py`, `compute_environment.py` and `evaluation.py` laid over this PR, the existing tests (`command_reads_input_size`, `inputs_as_json_with_staging_paths`, `test_command_line_recorded`) still pass, because embedded Pulsar with `copy` keeps Galaxy paths readable. The review branch's `test_evaluated_with_staged_input_paths` fails on that merge and passes on this PR.
    fix: |
      Whichever PR merges second needs the Pulsar mapping built from Pulsar paths. For example, have `remote_evaluation_paths()` map each result through `compute_environment.evaluated_path_rewrites()`, or give `PulsarComputeEnvironment` explicit remote-path accessors (#25021's `_local_and_remote_input_paths`) for this PR to call. Also update the description's merge claim. The review branch's `test_evaluated_with_staged_input_paths` catches the conflict.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P2 2
    include: true
    title: Integration tests can't tell staged paths from Galaxy paths
    summary: Embedded Pulsar with copy keeps Galaxy paths readable, so the tests pass with either; command-line regex accepts any equal pair.
    implementation_verified: true
    issue: |
      `test_pulsar_embedded_remote_tool_eval.py` uses embedded Pulsar with `default_file_action: copy` on the same host, so Galaxy object-store paths stay readable where the job runs. `command_reads_input_size`, `command_reads_configfile` and the `inputs_as_json_with_staging_paths` "every `source_path` exists" check therefore pass whether the evaluator gets Pulsar paths or Galaxy paths, which is exactly the regression in P2 1. `test_command_line_recorded` also asserts `echo '(\d+) \1'`, which passes for any equal pair although the input content is fixed.
    fix: |
      Added `test_evaluated_with_staged_input_paths`, which asserts that the Pulsar-side `compute_environment.json` maps the input under the Pulsar job's `inputs/` and not to its Galaxy path, and made `test_command_line_recorded` assert `echo '4 4'` (upload appends a newline to `abc`). Both pass on both metadata strategies; the new test fails on a merge with #25021's head.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: low}
  - id: P2 3
    include: true
    title: Data table and select option paths aren't staged under remote evaluation
    summary: "`$param.fields.path` rewrites happen lazily during template evaluation, which remote evaluation skips on Galaxy's side."
    issue: |
      With local evaluation on Pulsar, `$param.fields.path` (and other `PATH_ATTRIBUTES`) calls `PulsarComputeEnvironment.unstructured_path_rewrite` while the template is rendered. The collected `path_rewrites_unstructured` become `arbitrary_files` in the `ClientJobDescription`, which is how reference data paths get staged or rewritten for destinations without shared reference data. With remote evaluation, Galaxy only renders environment variable templates (`PartialToolEvaluator`), so the mapping stays empty unless an environment variable reads such a path. On the remote side `RemoteComputeEnvironment.unstructured_path_rewrite` returns `None` and the command silently gets the Galaxy-side path. That works with CVMFS-style shared reference data and fails at run time otherwise.
    fix: |
      Added a paragraph to `doc/source/admin/jobs.md` saying these paths aren't staged under remote evaluation and must be readable at the same path where the job runs. Pre-computing the rewrites for select and data table parameters on the Galaxy side, or failing loudly when one would need staging, would close the gap.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P2 4
    include: true
    title: "`job_io.json` and `compute_environment.json` are written twice for Pulsar"
    summary: prepare() writes both with the Pulsar compute environment, then Pulsar's _setup_remote_tool_evaluation rewrites them with duplicated path logic.
    implementation_verified: true
    issue: |
      `MinimalJobWrapper.prepare` writes both files, already with the `PulsarComputeEnvironment` (remote evaluation forces `rewrite_parameters`). `PulsarJobRunner._setup_remote_tool_evaluation` then rewrites both, re-deriving `metadata/outputs_new` and patching `job_io.to_dict()` field by field. The second write differs only in those `job_io` fields and `unstructured`. Two writers of one artifact will drift, and any other runner that stages elsewhere would have to copy the Pulsar override.
    fix: |
      Added `ComputeEnvironment.remote_evaluation_job_io()` and `remote_evaluation_unstructured_paths()`, with defaults matching the local runner's current output, overrode them in `PulsarComputeEnvironment`, and made `prepare()` the only writer. `_setup_remote_tool_evaluation` is removed.
    fix_details: |
      Ran `test_pulsar_embedded_remote_tool_eval.py` (all non-parametrized tests plus `job_properties`, `version_command_tool_dir`, `environment_variables`, `param_value_from_file`, `inputs_as_json_with_staging_paths`) on both metadata strategies, 9 passed each, and `test_remote_tool_evaluation_directory_metadata.py` (`test_command_line_built_in_job`, `job_properties`, `metadata_bam`), 3 passed.
    discovered_by:
      - {profile: thermo_review, model: Claude Opus 5.5, effort: low}
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 1
    include: true
    title: "`remote_command_line` runs a DB query on every access, now inside a per-dataset loop"
    summary: Property queries JobExportHistoryArchive each access; PR adds Pulsar call sites, one per input dataset.
    issue: |
      `MinimalJobWrapper.remote_command_line` runs `select(JobExportHistoryArchive)` each time. This PR adds five Pulsar call sites, one inside the `deferred_dataset_ids` comprehension, so the query runs once per input dataset. Optionally, the inline `tool_type in ("interactive", "set_metadata")` exclusion could become a class attribute on those tool classes, like `tool_type_local` and this PR's `job_directory_files`.
    fix: |
      Read the property once into a local in `queue_job` and `__prepare_job`. Not cached on the wrapper, since the destination, and with it the strategy, can change on resubmission. The class attribute idea is not on the branch.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: thermo_review, model: Claude Opus 5.5, effort: low}
  - id: P3 2
    include: true
    title: "`assert self.tool` turns a False into an AssertionError"
    summary: remote_command_line asserts a tool exists on remote destinations instead of returning False; no current caller reaches it without a tool.
    issue: |
      Before, `remote_command_line` evaluated to False without touching `self.tool`. Now a remote-strategy destination asserts `self.tool`. Wrappers without a tool do exist: at startup the handler builds one to `fail()` a job whose tool was removed. No current caller reaches the property on that path, so this is unlikely to fire, but returning False is just as short.
    fix: |
      Replaced the assertion with `self.tool is None or ...` returning False.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 3
    include: true
    title: "`RemoteEvaluationPaths` should be a `TypedDict`"
    summary: Untyped dict[str, dict[str, str]] accessed with four fixed keys; defined after its string-quoted use.
    issue: |
      `RemoteEvaluationPaths = dict[str, dict[str, str]]` is accessed with fixed keys (`datasets`, `extra_files`, `metadata_files`, `unstructured`) and is the JSON contract between Galaxy and the remote evaluator. It is also defined after `RemoteComputeEnvironment`, which references it as a string annotation.
    fix: |
      Made it a `TypedDict` with the four keys, defined above `RemoteComputeEnvironment`.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: thermo_review, model: Claude Opus 5.5, effort: low}
