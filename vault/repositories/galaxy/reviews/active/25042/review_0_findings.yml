findings:
  - id: P2 1
    include: true
    title: Text and select defaults written as numbers are dropped on an unrelated save
    summary: text default 7 / select default 1 never equals the decoded form "7" / "1", so the first unrelated editor save drops the default. Fixed with a round trip.
    implementation_verified: true
    issue: |
      `step_input_form_defaults` converts the default with `input.to_python`, but `ToolParameter.to_python` is the identity and `TextToolParameter` / `SelectToolParameter` don't coerce. The form side goes through `params_to_strings` and `params_from_strings`, and `safe_loads` keeps scalars as strings. A Format 2 text default of `7`, or a select default of `1` on options `"1"`/`"2"`, therefore comes back from the editor as `"7"` / `"1"`. `same_form_value("7", 7)` is `False`, so the default counts as changed in the form and is dropped on a save where the user touched nothing. The value that runs is the same, but the workflow is silently rewritten (export loses `in`, the value moves into `state`), contrary to the stated rule that a default is kept while the form still shows it.
    evidence: |
      The new unit test fails on `c29193e2b0f` with `same_form_value('7', 7)` returning `False` for the text parameter, and the new API test fails there with the step's `in` gone after an unmodified editor save.
    fix: |
      `step_input_form_defaults` now converts each default through `params_to_strings` and `params_from_strings`, the round trip the saved tool state takes, so the editor shows and compares the default the way the form decodes it. Integer, float and boolean defaults convert as before. Added `test_step_input_form_defaults_match_the_saved_form_state`, which shows text and select defaults in the form, round trips the state and checks both still match, and `test_update_from_editor_keeps_numeric_text_step_input_default`, which saves a `gx_text` step with `default: 7` unchanged through the editor path and checks the default is kept. Both fail on the PR head and pass on the branch.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 1
    include: true
    title: Step input defaults are gathered in two places
    summary: optional; `_add_step_in` and the editor dict both filter `step.inputs` on `default_value_set`. Fixed with `WorkflowStep.input_defaults`.
    issue: |
      `_add_step_in` and `_workflow_to_dict_editor` both build the name-to-default mapping from `step.inputs` filtered on `default_value_set`. A `WorkflowStep` property next to `inputs_by_name` / `get_input_default_value` would leave one place that knows what a set default is. Optional.
    fix: |
      Added `WorkflowStep.input_defaults` and used it in both places.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 2
    include: true
    title: Loose typing on the new helpers
    summary: "`dict[Any, Any]` and untyped inputs/state where `ToolInputsT` and `dict[str, Any]` fit. Fixed."
    issue: |
      `step_input_form_defaults` and the two `ToolModule` methods take `dict[Any, Any]` for defaults that are always keyed by prefixed input name, and `inputs` / `state_inputs` are untyped though `ToolInputsT` exists in `galaxy.tools.parameters`.
    fix: |
      Typed `inputs` as `ToolInputsT` and the state and defaults as `dict[str, Any]`. mypy reports no new errors in the changed modules.
    discovered_by:
