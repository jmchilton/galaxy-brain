  - id: P2 3
    include: true
    title: No E2E test for refactor undo in the editor
    summary: refactor undo/redo and save-after-undo had only stubbed vitest coverage; added a Selenium/Playwright test.
    issue: |
      The editor gains undo and redo for refactors the server has already applied, but the vitest tests stub `WorkflowGraph` and emit a hand-built one-step workflow. Neither checks the PR's stated save behavior: after an undo the editor stays on the newest version, and saving writes a new version with the earlier content. No Selenium or Playwright test covers upgrading a sub-workflow step in the editor, or undo of any kind.
    fix: |
      Added `test_undo_subworkflow_upgrade` to `test_workflow_editor.py`, with `upgrade_subworkflow` and `latest_change` selectors. It bumps the nested workflow of `WORKFLOW_NESTED_SIMPLE` through the API, upgrades the step in the editor, checks the server saved the new sub-workflow, undoes the upgrade from the Changes panel, saves, and checks the saved workflow holds the pre-upgrade sub-workflow again. It passes with the Playwright backend.
    discovered_by:
      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P3 1
    include: true
    title: Undoing or redoing a refactor overwrites tags, which are not part of undo history
    summary: restoreWorkflowState reapplied the snapshot's tags, reverting tags saved after the refactor. Fixed with a red-to-green vitest.
    implementation_verified: true
    issue: |
      `restoreWorkflowState` calls `applyWorkflowAttributes`, which sets `tags.value = data.tags`. Tags are kept out of undo history because `WorkflowAttributes` saves them on the server as they change (`setTags`). If tags are edited after a refactor and the refactor is then undone, the editor reverts to the snapshot's tags while the server keeps the new ones, and the next save sends the old tags back. License, creator and DOI go through undo actions, so they aren't affected.
    fix: |
      `restoreWorkflowState` now keeps the editor's current tags. Added a vitest test that sets tags after a refactor, undoes it and checks `WorkflowAttributes` still gets the new tags; it fails on the PR.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 2
    include: true
    title: Loose undo-stack count in the refactor undo test
    summary: toBeGreaterThanOrEqual(2) would pass with a stray or missing action; mounting adds none, so now exact counts.
    issue: |
      `Index.test.ts` asserts `expect(undoRedoStore.undoStackLength).toBeGreaterThanOrEqual(2)` after two refactors. `mountWithSteps` adds steps through `stepStore.addStep`, which records no undo actions, so the stack is exactly 2, and the loose check wouldn't catch a refactor that pushes no action or an extra one.
    fix: |
      Asserted `toBe(1)` after the first refactor and `toBe(2)` after the second.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: medium}
