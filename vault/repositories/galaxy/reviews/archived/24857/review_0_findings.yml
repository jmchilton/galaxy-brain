findings:
  - id: P2 1
    include: true
    title: Missing-tool sub-workflow upgrade drops connections and workflow outputs from outputs of missing tools
    summary: missing tools list no outputs, so the new fallback dropped downstream connections and outer workflow outputs fed by them. Reproduced and fixed.
    implementation_verified: true
    issue: |
      When the new sub-workflow uses a tool that isn't installed, `_apply_upgrade_subworkflow` now rebuilds the module and calls `_patch_step`. `SubWorkflowModule.get_all_outputs()` builds its outputs from `_workflow_to_dict_editor`, where a missing tool's `ToolModule.get_all_outputs()` is `[]`, so every sub-workflow output sourced from a missing tool is skipped. `_patch_step` then drops every downstream connection from those outputs and, after `93b224b00ea`, removes the outer step's labeled workflow outputs for them, reporting both as "no longer available". The PR says the step keeps the sub-workflow's inputs and outputs in this case, but the outputs that come from the missing tools are exactly the ones lost.

      The test can't show this, since `SUBWORKFLOW_WITH_MISSING_TOOL` declares no outputs and the test only asserts `subworkflow.id`.
    evidence: |
      With `outputs: {workflow_output: {outputSource: not_installed/out_file1}}` added to the fixture and `WORKFLOW_NESTED_OUTPUT` as the outer workflow, the upgrade on `93b224b00ea` reports three messages: two `connection_drop_forced` for `second_cat` and one `workflow_output_drop_forced` for `nested_output`.
    fix: |
      In the missing-tool fallback, the upgrade now also takes the new sub-workflow's output names from its workflow output labels (skipping input steps, as `_workflow_to_dict_editor` does) and passes them to `_patch_step`. The test now gives the replacement an output, uses `WORKFLOW_NESTED_OUTPUT` and `step_by_label`, and asserts that there are no messages, that `inner_input` stays connected from `first_cat`, and that `second_cat`'s connections and `nested_output` survive. It fails on the PR and passes on the branch.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P2 2
    include: true
    title: Reordered-inputs test checks stored connections, not the run-time swap
    summary: test only asserted input_subworkflow_step labels; now runs the workflow and checks cat1 output order. Red on base impl.
    implementation_verified: true
    issue: |
      `test_subworkflow_upgrade_keeps_connections_when_inputs_are_reordered` asserts that each connection's `input_subworkflow_step.label` matches its `input_name`. The bug the PR describes is that the datasets swap at run time, which the test doesn't exercise.
    fix: |
      Extended the test to invoke the upgraded workflow with `a` and `b` datasets for `outer_a` and `outer_b` and assert the `cat1` output is `a\nb\n`. With the merge-base `execute.py` the output is `b\na\n`.
    discovered_by:
