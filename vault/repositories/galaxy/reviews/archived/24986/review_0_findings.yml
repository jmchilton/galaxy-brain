        detail: adds `omitUnsetWorkflowInput` in `Workflow/constants.ts`, used by both run forms, with a WorkflowRunForm test that keeps a cleared parameter input as null.
        findings: [P2 2]
      - sha: 2aaa7db7e49
        subject: Share step input default serialization between editor and export
        detail: adds `WorkflowStep.input_defaults_dict()` and uses it in `_workflow_to_dict_editor` and the native export.
