  - id: P3 1
    include: true
    title: Each keystroke in the default-location field creates its own undo entry
    summary: FormDefault emits onUpdateStep per keystroke, each a separate UpdateStepAction.
    implementation_verified: true
    issue: |
      `FormDefault` emits `onUpdateStep` on every `update:modelValue`, which reaches `stepActions.updateStep` and applies a fresh `UpdateStepAction` each time. Typing a 40-character URL leaves about 40 "modify step" undo entries. Annotation and label edits merge keystrokes through `changeValueOrCreateAction` / `LazyMutateStepAction`.
    fix: |
      Added a lazy `setInputDefaults` step action, used by FormDefault like `FormOutputLabel` uses `setOutputLabel`. An actions test checks that three edits leave one undo entry.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: gx_performance_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P3 2
    include: true
    title: The simple form's help concatenation is unrelated and does nothing
    summary: longFormInput.help is always empty for input steps.
    implementation_verified: true
    issue: |
      `WorkflowRunFormSimple.vue` now builds `help` from `step.annotation` plus `longFormInput?.help`. The runtime inputs of input steps (`InputDataModule.get_runtime_inputs` and its siblings) set no `help`, so the change has no effect on this feature, which `FormData`'s status block renders. If it ever became non-empty it would change the help text of every input type.
    fix: |
      Reverted the line.
