      `input_step["tool_state"]["optional"] = "true"` carries the comment "preserve an optional input". It actually exercises the `modules.py` change that forces `optional=False` when a default exists, so the step can still build its `DataToolParameter` and run. The following `optional is True` assertion held either way because the manager forced it. The `data_input` step lookup is also repeated three times.
    fix: |
      Moved the case into `test_optional_data_input_with_default_file_location_runs`, which marks the input optional, checks the run model and invokes the workflow, and added an `_editor_data_input_step` helper.
    discovered_by:
