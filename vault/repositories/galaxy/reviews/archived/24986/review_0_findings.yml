findings:
  - id: P2 1
    include: true
    title: Changing the default location keeps metadata that describes the old file
    summary: FormDefault spreads the old File default, so basename and hashes survive a URL change.
    implementation_verified: true
    issue: |
      `FormDefault.vue` `onDefaultLocation` spreads the previous `File` default and replaces only `location`. `raw_to_galaxy` (`lib/galaxy/tools/parameters/basic.py`) also reads `basename` (the dataset name), every `HASH_NAMES` key (attached as `DatasetHash` and checked when the deferred dataset materializes), and `created_from_basename`. All of them describe the previous file. After an author points the input at a different URL in the editor, the run still names the dataset after the old file (the PR's own fixture has `basename: a file`), and an old `MD5`/`SHA-*` value makes materializing the new URL fail hash validation, with nothing in the editor showing why.
    fix: |
      Changing the location now drops `basename`, `created_from_basename` and the hash keys, and keeps location-independent keys such as `format`. A Vitest case with `basename` and `MD5` covers it.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P2 2
    include: true
    title: The long run form omits every null input, including parameter inputs
    summary: Long form deletes null for parameter_input too; simple form only for data/collection.
    implementation_verified: true
    issue: |
      `WorkflowRunForm.vue` `onDefaultStepInputs` deletes `inputs[stepId]` whenever `data.input == null`. This handler serves every input step, including `parameter_input`. The simple form deliberately omits null only for `data_input` / `data_collection_input`. The backend treats the two differently (`WorkflowProgress.set_outputs_for_input` and `_ensure_input_step_outputs_populated` in `lib/galaxy/workflow/run.py`): a missing key uses the step default, a present `None` runs with `None`. So an optional parameter with a default that the user cleared now runs with the default in the long form, but with null in the simple form.
    fix: |
      Added `omitUnsetWorkflowInput` in `Workflow/constants.ts`, used by both forms, so only unset data and collection inputs are omitted. A WorkflowRunForm Vitest test submits a null data input and a null parameter input and checks that only the parameter is sent; it fails on the reviewed commit.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P2 3
    include: true
    title: Default-file run-model handling is patched in the workflow manager instead of DataToolParameter
    summary: Manager re-reads the default, reports optional=True for a required parameter, and the history scan for an initial value is discarded.
    implementation_verified: true
    issue: |
      `WorkflowContentsManager._workflow_to_dict_run` takes `DataToolParameter.to_dict()` and then patches it for `data_input` steps (`optional = True`, `value = None`, `default_location`), re-reading the default through `step.get_input_default_value(None)` although the parameter already holds it as `default_object`. Consequences:

      - **Contract mismatch.** The client is told `optional: True`, while `InputDataModule.get_runtime_inputs` builds the same parameter with `optional=False`. The real state is "required, satisfied by a default".
      - **Sibling divergence.** Tool `<param type="data">` inputs can already declare a default (`default_object`). The tool form preselects a history dataset and offers no way to choose the default.
      - **Wasted history scan.** Because `optional=False` is forced, `BaseDataToolParameter.get_initial_value` skips its early return and pages through up to 500 HDAs plus a count of the current history, newest first, and the manager then overwrites the result with `None`. For inputs declared optional this is new per-request work. Code reading only, not measured.
    evidence: |
      Making `get_initial_value` return `None` for any File default is not a safe fix on its own. With that change, `tools/cat_default/build` still returned a selected dataset: `populate_state` passes the empty initial value through `from_json`, which calls `raw_to_galaxy` on the default and so appears to create a deferred dataset on each form build. The review branch therefore leaves the scan alone.
    fix: |
      `DataToolParameter.to_dict` now emits `default_location` for a File default. `FormData`, `FormElement` and `validateInputs` treat it as making an empty selection valid, so the manager only sets `value = None` for `data_input` steps and no longer reports the input as optional. Tool data parameters with an XML default get the same "Use default file" option. An API test checks `default_location` on `cat_default`'s build.
    fix_details: |
      The history scan remains. Skipping it needs an explicit flag that `InputDataModule.get_runtime_inputs` sets on the parameter it builds, rather than a change for every data parameter with a default, so that tool form builds don't start materializing defaults.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: gx_performance_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P2 4
    include: true
    title: The API round trip rewrites the default before saving, so metadata survival is not tested
    summary: Test strips the default to {class, location} before saving; tool-step inline defaults untested.
    implementation_verified: true
    issue: |
      `test_default_file_location_editor_round_trip_and_run` replaces the downloaded `in.input.default` with `{"class": "File", "location": ...}` before calling `_update_workflow`, dropping the fixture's `basename` and `format`. The test would still pass if the editor serializer or the update path lost those keys. The new `_workflow_to_dict_editor` code emits `in` for every step type, which also fixes inline tool-step defaults that open-and-save used to drop, and nothing tests that case.
    fix: |
      The round-trip test now saves the editor dict unchanged and asserts the reopened default equals the original exactly, including `basename` and `format`. Added `test_tool_step_default_file_survives_editor_round_trip` for `WORKFLOW_WITH_STEP_DEFAULT_FILE_DATASET_INPUT`.
    discovered_by:
      - {profile: gx_test_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P2 5
    include: true
    title: The expanded run form's submit path with a default is untested
    summary: Selenium test switches to the simple form before submitting, so the long-form omission never runs.
    implementation_verified: true
    issue: |
      `WorkflowRunForm.vue` `onDefaultStepInputs` now omits a null input instead of sending `null`. `test_dataset_default_location` selects "Use default file" in the expanded form but switches to the Simple Form before submitting. The Simple Form builds its own payload, so the changed code never runs in any test.
    fix: |
      Added `test_dataset_default_location_expanded_form_submit`, which picks a dataset, switches back to "Use default file", submits from the expanded form and checks the output contains `chr1`.
    discovered_by:
