  - id: P3 4
    include: true
    title: Loose typing for step `in` pushes runtime narrowing into the component
    summary: "NewStep.in typed with `default?: unknown`; FormDefault repeats type guards."
    implementation_verified: true
    issue: |
      `NewStep.in` is typed `Record<string, { default?: unknown }>`, so `FormDefault.vue` repeats `typeof value === "object" && "location" in value ...` and `previous.class === "File"` guards inline. A narrow `FileDefault` type with a guard would shorten both functions and make explicit which keys survive a location change.
    fix: |
      Added a `FileDefault` type and `isFileDefault` guard in `modules/defaultFile.ts`, and named the step `in` type `StepInputDefaults`.
    discovered_by:
