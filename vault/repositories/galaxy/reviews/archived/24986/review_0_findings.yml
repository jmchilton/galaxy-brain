    pr_title: Tighten default file locations for workflow inputs
    description: |
      `pr_24986_round_0_rev_0` builds on `be2b1655fc6`. In the editor, it moves the default-location logic into a typed `modules/defaultFile.ts` helper that drops the old file's basename and checksums when the location changes, and it merges keystrokes into one lazy undo entry. On the run side, `DataToolParameter.to_dict` now emits `default_location` and the client treats it as making an empty selection valid, so the workflow manager no longer reports the input as optional and tool data parameters with an XML default get the same option. The long run form omits only unset data and collection inputs, through a helper shared with the simple form. It also shares the `in` serialization between the editor and export dicts and reverts the no-op help change. On the test side, the API round trip now saves the editor dict unchanged and covers tool-step defaults, the optional-with-default case has its own test, a Selenium test submits from the expanded form, and the Simple Form toggle gets a navigation entry.
    commits:
      - sha: 7610d563e62
        subject: Drop file metadata bound to the old location when editing a default
        detail: removes `basename`, `created_from_basename` and the hash keys from the File default when the location changes, with a FormDefault test.
        findings: [P2 1]
      - sha: eae6ede045b
        subject: Move default file location editing into a typed helper
        detail: adds `modules/defaultFile.ts` with a `FileDefault` type, guard and `withDefaultFileLocation`, types `NewStep.in` as `StepInputDefaults`, and replaces the mount-based FormDefault test with a table test of the helper.
        findings: [P3 4, P3 6]
      - sha: c1b9f33b194
        subject: Merge default location keystrokes into one undo entry
        detail: adds a lazy `setInputDefaults` step action used by FormDefault, with an undo test.
        findings: [P3 1]
