    head: 49775ee05fd
    pr_title: Correct the security linter's model of Galaxy sanitization and reuse Galaxy and Cheetah helpers
    description: |
      `pr_1782_round_0_rev_0` builds on `2ffe63c3c57`. It drops the `SecurityDataColumn` and `SecurityGroupTag` checks, because Galaxy sanitizes those select values, and adds `SecurityRawParamValue` for the accessors that really do bypass sanitization (`.value` and loops over a select). A restrictive `<sanitizer>` now suppresses `SecurityUnquotedParam`. The sanitizer presets, booleans, Cheetah directive names, parameter indexing and validators now come from `galaxy.util`, `Cheetah.Parser` and the tool source input API instead of local copies. Escaped `\$` placeholders are skipped, and findings are routed by `Linter` class instead of string kinds. On the test side, the branch adds a macro fixture and table rows for the advertised but untested behaviors, broadens the clean fixture, moves skip coverage to the CLI with a `shed_lint --security` run, and drops a private-helper test. It does not restructure the lexer, the reference resolution or the test layout.
    commits:
      - sha: 986f7a1a861
        subject: Stop flagging data_column and group_tag values as unsanitized
        detail: removes the two checks and their `Linter` classes, and turns the column and tag fixture test into a stays-quiet test.
        findings: [P1 1]
      - sha: a2153b06137
        subject: Flag .value and select loops that bypass parameter sanitization
        detail: adds `SecurityRawParamValue` for `$param.value` on text, hidden and dynamic select params and for loop variables bound to a select, `data_column` or `group_tag`, with a parametrized test.
        findings: [P2 1]
      - sha: b7928b7915c
        subject: Let a restrictive sanitizer suppress SecurityUnquotedParam
        detail: skips the unquoted finding when the param's own sanitizer can only output safe filename characters, unless the tool sets `<options sanitize="false"/>`.
        findings: [P2 2]
      - sha: 90c9e9b9969
        subject: Mirror Galaxy's sanitizer preset and boolean parsing
        detail: takes the default preset from `galaxy.util.valid_chars`, splits comma-separated valid and mapping presets as Galaxy does, and parses booleans with `string_as_bool`.
        findings: [P2 3]
      - sha: 37ec5c3e0d8
        subject: Build the Cheetah directive pattern from Cheetah's parser
        detail: replaces the hand-copied directive list with `Cheetah.Parser.directiveNamesAndParsers`, with a test for a `#elif` line inside a quoted span.
        findings: [P3 1]
      - sha: 84306dbab78
        subject: Skip backslash-escaped placeholders
        detail: adds a `(?<!\\)` lookbehind to every reference pattern through a shared `_PLACEHOLDER` prefix.
        findings: [P3 3]
      - sha: 28eb24edcca
        subject: Route security findings by Linter class instead of string kinds
        detail: makes `emit` take the reporting `Linter` class and each `lint` keep the findings whose class is itself, leaving the eight `lint` bodies in place.
        findings: [P3 5]
      - sha: 7cc8d674061
        subject: Index params and validators through the tool source input API
        detail: walks `parse_input_pages()` input sources, reads regex validators as `RegexParameterValidatorModel` objects and tool-wide sanitization from `parse_sanitize()`, and adds tests for conditional, section and argument-named params.
        findings: [P3 4, P2 8]
      - sha: acdc3449356
        subject: Drop the security test of private loop-binding helpers
        detail: removes `test_security_loop_bindings_persist_after_their_loop`.
        findings: [P3 6]
      - sha: 4de08ca1fcd
        subject: Cover security skips and shed_lint --security through the CLI
        detail: replaces the module-skip unit test with a per-class skip assertion in `test_lint_security` and adds `test_shed_lint_security`.
        findings: [P3 7]
      - sha: c6c5cef5087
        subject: Exercise every advertised mitigation in the clean security fixture
        detail: adds unquoted params guarded by a restrictive sanitizer and by a safe validator, and an unquoted `shlex.quote` call.
        findings: [P3 8]
      - sha: 91fa49f4914
        subject: Test the security behaviors the PR advertises but did not pin
        detail: adds a macro fixture and table rows for the other condition directives, sanitizer add/remove actions, validator ranges and negation, and `re.sub` edge cases.
        findings: [P2 8]
