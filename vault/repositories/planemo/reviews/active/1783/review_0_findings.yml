    pr_title: Rewrite test data mirror URLs in tools/fetch payloads
    description: |
      `pr_1783_round_0_rev_0` builds on `431a1bf5`. It first replaces the mock-patched `stage_in` tests with tests that stage jobs through the real `PlanemoStagingInterface` and assert the fetch payloads posted to Galaxy. It then moves the mirror lookup from a copy of galaxy-tool-util's job traversal into `PlanemoStagingInterface._post`, rewriting only `tools/fetch` elements with `src: url`, an http(s) `url` and declared `hashes`; `stage_in` passes `job_path` again and the contract tests pass unchanged. Two smaller commits stop a single read timeout from disabling a mirror for the rest of the run and key the hash table on galaxy-util's `HashFunctionNameEnum`. `tests/test_test_data_mirrors.py` and `tests/test_galaxy_activity.py` pass (21 tests), and flake8, black, isort and ruff are clean on the changed files.
