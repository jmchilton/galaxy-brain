      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
  - id: P3 2
    include: true
    title: Overriding assign_ids silently reuses EngageQueue submission keys across attempts
    summary: the key hashes the script path, so a non-uuid job directory can hand back an earlier attempt.
    implementation_verified: true
    issue: |
      `assign_ids` was only defaulted to `uuid`. `EngageQueue.submission_key` hashes the resolved script path and relies on UUID directories. With `assign_ids: galaxy` or `galaxy_prefixed`, a resubmitted Galaxy job, or a re-setup after `clean`, gets the same key. EngageQueue's idempotent submit then returns the earlier attempt, for example the failed one being resubmitted with more memory.
    fix: |
      The plugin now declares `required_assign_ids = "uuid"`. `CliQueueManager` raises `ValueError` at construction when a different `assign_ids` is configured. Added a parametrized test.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P3 3
    include: true
    title: _kill_external now raises for every CLI plugin
    summary: Slurm/PBS/Torque now log a traceback whenever `scancel`/`qdel` exits nonzero.
    implementation_verified: true
    issue: |
      `CliQueueManager._kill_external` raises `RuntimeError` on any nonzero delete status. Only the EngageQueue cancel-retry path needs that, but `ExternalBaseManager.kill` is shared. Slurm, PBS and Torque now emit `log.exception` tracebacks for routine cases such as deleting a job that already finished.
    fix: |
      The raise is now limited to `confirms_cancellation` plugins. Others log a one-line warning with the delete stderr. Added a Slurm test that fails before the change.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
