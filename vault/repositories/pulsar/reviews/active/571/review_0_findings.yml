  - id: P3 11
    include: true
    title: Remaining test hygiene in engagequeue_cli_test.py
    summary: Bunch fakes, duplicated executor teardown, inline child scripts, and a name the unit env doesn't exclude.
    issue: |
      - `Bunch(returncode=..., stdout=..., stderr=...)` fakes stand in for command results.
