findings:
  - id: P1 1
    include: true
    title: EngageQueue capabilities reach generic managers through getattr probes and a plugin-name check
    summary: undeclared duck-typed hooks plus `job_plugin == "EngageQueue"` in the generic CLI manager; declare them on the base classes.
    implementation_verified: true
    issue: |
      `CliQueueManager.__init__` hard-codes `if kwds.get("job_plugin") == "EngageQueue": kwds.setdefault("assign_ids", "uuid")`. The new behavior is then wired in through attributes no base class declares:

      - `getattr(job_interface, "idempotent_submission", False)` appears 5 times in `queued_cli.py`.
      - `getattr(job_interface, "confirms_cancellation", False)` gates a second `get_status`.
      - `_recover_active_job` probes `recover_submission`, then calls `submission_missing` and `parse_return_code` unguarded. These are methods only `EngageQueue` defines, so the code works only because the two flags happen to be set together.
      - `StatefulManagerProxy` probes `getattr(self._proxied_manager, "recoverable_submission", False)` 3 times.
      - `require_collection_ack` and `acknowledge_collection` were added to `BaseManager` and `ManagerProxy` but not to `ManagerInterface`.
    fix: |
      Declared the capabilities on `BaseJobExec` with defaults: `idempotent_submission`, `confirms_cancellation`, `required_assign_ids`, and no-op `recover_submission`, `submission_missing` and `parse_return_code` hooks. `CliQueueManager` now resolves the plugin class to apply its assign_ids and reads typed attributes. `ManagerInterface` declares `recoverable_submission` (default `False`) and the two ack methods, and `ManagerProxy` forwards `recoverable_submission`. `stateful.py` reads it directly.
    fix_details: |
      Not done on the branch, and optional: moving the recoverable launch and status flow into a `CliQueueManager` subclass or a strategy chosen at construction, so the legacy path keeps its original shape.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
  - id: P2 1
    include: true
    title: Collection ack opt-in is self-confirmed on local-setup clients, and MQ, relay and CLI clients have no ack path
    summary: local setup echoes its own confirmation; message clients forward the opt-in but can never ack or clean server-side.
    implementation_verified: true
    issue: |
      `BaseJobClient.setup` raises unless the response has `require_collection_ack: True`. But `LocalSetupHandler.setup` writes that key into the `job_config` it builds itself, so the check only means something on the `RemoteSetupHandler` (HTTP, no `job_directory`) path. Elsewhere:

      - **MQ, relay and CLI clients** (`MessageJobClient`, `RelayJobClient`, `MessageCLIJobClient`) always set up locally, so `setup(require_collection_ack=True)` succeeds. `_setup_params_from_job_config` then forwards the flag, and the server marks the job ack-required. But `BaseMessageJobClient` has no `acknowledge_collection`, its `clean()` only drops the client-side cache, and `bind_amqp`/`bind_relay` have no ack message. The staging directory is retained with no way to release it.
      - **HTTP `JobClient` with a local `job_directory`**: confirmation is again local. Against a server that predates this PR, `submit` ignores the opt-in and `clean()` deletes staging before import, which is what the protocol says it prevents.

      Before this round no test exercised the local-setup chain: removing either the `preprocess_and_launch` opt-in call or the `LocalSetupHandler` echo left every test green. No test pins what an opted-in MQ job does.
    evidence: |
      `BaseMessageJobClient` (`pulsar/client/client.py:449`) defines `clean` but no `acknowledge_collection`, and nothing under `pulsar/messaging/` handles an ack. With the `LocalSetupHandler` echo removed, the new local-setup test fails in `client.setup` with "did not confirm", which shows the confirmation is generated client-side.
    fix: |
      Added `test_local_setup_client_opt_in_reaches_server_through_launch`, which sets up through `LocalSetupHandler`, launches with the returned config, cleans (directory retained) and acknowledges (directory gone). It fails with either mutation applied.

      The protocol gaps are not fixed on the branch. Only a server response should count as confirmation. `BaseRemoteConfiguredJobClient.setup` should reject `require_collection_ack` until a message type exists. Local-setup HTTP clients should either be rejected or get confirmation through the `submit` response. If the echo is removed, the new test needs to change with it. This belongs in the separate, generic collection-ack PR maintainers asked for on #550. Estimate: about 40 to 60 lines plus a `memory://` MQ test.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
      - {profile: generic_test_challenger, model: Claude Opus 5.5, effort: medium}
  - id: P2 2
    include: true
    title: A submit the executor rejected becomes "uncertain" and the job stays queued forever
    summary: any nonzero submit goes to lookup, gets "missing", and is retained as QUEUED; stderr is discarded.
    implementation_verified: true
    issue: |
      For an `idempotent_submission` plugin, `CliQueueManager.launch` sends any nonzero submit to `_recover_active_job`. If the executor rejected the submission, the lookup returns 3 and the code raises `SubmissionUncertain`. The proxy then marks the job preprocessed and leaves it active, and every later `get_status` re-runs lookup and returns `QUEUED`. The submit stderr is never logged, because the `log.warning` sits after the early return.

      The PR keeps a missing lookup nonterminal because the original submit process might still accept later. That only holds when the submit was timed out or killed. Acceptance in EngageQueue is a synchronous store transaction inside the submit CLI process, so once that process exits on its own nothing can accept later.
    evidence: |
      With `engagequeue==0.1.1`, `submit --pool nosuchpool` and `submit --cpus abc` both exit 2 ("Unknown execution pool", argparse error), and `lookup` then exits 3. A new test using an unknown pool reported `queued` before the fix.
    fix: |
      Added a `submission_rejected(result)` hook on `BaseJobExec` (default `False`); `EngageQueue` returns `result.returncode == 2`. Lookup now raises a `SubmissionMissing` subclass when nothing is found. `launch` turns that into an ordinary failure carrying the submit stderr only when the plugin says the submit was rejected. Timeouts, ssh 255 and EngageQueue's 124 stay uncertain. Submit stderr is always logged. `test_rejected_submission_fails_with_executor_error` asserts `FAILED`, the executor message in stderr, and deactivation.
    fix_details: |
      Lookup still runs first, because EngageQueue also exits 2 for `OSError`, which could happen after the acceptance transaction commits.
    discovered_by:
      - {profile: default, model: Claude Opus 5.5, effort: medium}
  - id: P2 3
    include: true
    title: Per-job resource override allowlist is hard-coded in the generic manager
    summary: EngageQueue's option names live in `queued_cli.launch`, gated on idempotency.
    implementation_verified: true
    issue: |
      `queued_cli.launch` copies `("cpus", "memory_mb", "timeout", "output_limit")` from `submit_params` into `job_interface.params` when the plugin is idempotent. Those are EngageQueue's option names, and per-job resource passing has nothing to do with idempotent submission. Other CLI plugins (for example Slurm's `argmap`) can't use the mechanism without adding more lists here.
    fix: |
      Added `submit_param_overrides` to `BaseJobExec` (default empty) and set it on `EngageQueue`. `launch` now applies whatever the plugin declares, unconditionally.
    discovered_by:
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
  - id: P2 4
    include: true
    title: queued_cli.get_status re-implements ExternalBaseManager.get_status as a parallel path
    summary: a 45-line flag-gated status method duplicates the base template and writes `return_code` from a getter.
    issue: |
      The `confirms_cancellation` branch of `CliQueueManager.get_status` re-does external-id lookup, cancel redelivery, the status command, return-code reconciliation and the cancelled mapping. The base `get_status` → `_get_status_external` template still exists for the other plugins. The new path also changes the base ordering: the base returns `CANCELLED` as soon as a cancel is recorded, while the new one polls until the executor confirms. It writes `return_code` as a side effect inside a status getter and calls `self._was_cancelled(job_id)` twice.
    fix: |
      Keep one template in `ExternalBaseManager.get_status`, with small overridable steps. For example: `_resolve_external_id(job_id)` (default: current LOST behavior; recoverable: lookup, else QUEUED), `_cancelled_status(job_id, external_id)` (default: CANCELLED; recoverable: redeliver and keep polling), and `_get_status_external` reconciling the return code. Not done on the branch: the right shape, template hooks or a dedicated subclass, depends on how the PR is split. Estimate: about 100 lines, covered by the existing EngageQueue tests.
    discovered_by:
      - {profile: thermo_review, model: Claude Opus 5.5, effort: medium}
  - id: P2 5
    include: true
    title: Launch handling and recover_active_jobs gain flag-gated branches
    summary: a pre-dispatch block inlined in the busiest proxy method, and an identical metadata write in both try and except.
    implementation_verified: true
    issue: |
      `_handling_of_preprocessing_state` gained a `recoverable_submission` local and a pre-dispatch lock/activate/marker block. It also gained a conditional re-activation after launch, a new `except SubmissionUncertain` arm and a conditional `deactivate_job`. `recover_active_jobs` writes `store_metadata(JOB_FILE_PREPROCESSED, True, atomic=True)` identically in the `try` and the `except` arm, each behind its own `getattr`.
    fix: |
      Extracted the pre-dispatch block into `_begin_recoverable_dispatch(job_id, job_directory) -> bool`. `recover_active_jobs` now reads `recoverable_submission` once and writes `preprocessed` once after the try/except.
