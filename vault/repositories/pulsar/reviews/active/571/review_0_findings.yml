  - id: P3 1
    include: true
    title: Hand-rolled boolean parsing instead of asbool
    summary: '`str(x).lower() == "true"` in stateful and the adapter rejects "yes"/"1" that `asbool` accepts.'
    implementation_verified: true
    issue: |
      The PR imports `galaxy.util.asbool` in `client.py`, `setup_handler.py` and `routes.py`. It hand-rolls `str(...).lower() == "true"` in `stateful.py` (`preprocess_and_launch`) and in `engagequeue.py` for `attach_only`, `require_hard_limits` and `cancel_wait`. Those checks reject `"yes"`, `"1"` and `"True "`, which `asbool` accepts.
    fix: |
      Switched all four to `asbool`, and added a parametrized adapter test for truthy values. It failed for `"yes"` and `"1"` before the change.
    discovered_by:
