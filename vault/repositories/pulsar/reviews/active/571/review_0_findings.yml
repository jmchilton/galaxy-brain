    pr_title: Declare EngageQueue CLI capabilities and fail rejected submits
    description: |
      `pr_571_round_0_rev_0` builds on `a08303706ea`. It replaces the `getattr` capability probes and the `EngageQueue` name check with hooks declared on `BaseJobExec` and `ManagerInterface`, and moves the per-job resource allowlist onto the plugin. It also fails submits the executor rejected instead of leaving them queued, rejects non-uuid `assign_ids`, and keeps the raise on a failed delete for confirmed-cancel plugins only. Smaller commits switch to `asbool`, drop the unread `submission_uncertain` marker, and tidy `stateful.py`, the collection-ack keys and the tests. A new test covers collection-ack opt-in through local setup and launch. No MQ or relay collection-ack support is added.
    commits:
      - sha: 8a12c64dd45
        subject: Declare recoverable-submission hooks on BaseJobExec and ManagerInterface
        detail: adds class defaults and no-op hooks to `BaseJobExec`, declares the ack methods and `recoverable_submission` on `ManagerInterface` and `ManagerProxy`, and resolves the plugin class instead of comparing `job_plugin == "EngageQueue"`.
        findings: [P1 1]
      - sha: 890eb8d7118
        subject: Reject non-uuid assign_ids for EngageQueue
        detail: turns the plugin's assign_ids default into `required_assign_ids` and raises `ValueError` at manager construction on a mismatch, with a parametrized test.
        findings: [P3 2]
      - sha: b02206c32f1
        subject: Fail EngageQueue submits the executor rejected
        detail: adds a `submission_rejected` hook and a `SubmissionMissing` exception so a submit that exits 2 with nothing found on lookup becomes `preprocessing_failed` with its stderr, and always logs submit stderr.
        findings: [P2 2]
      - sha: bcaa28a1ad6
        subject: Raise on failed delete only for confirms_cancellation plugins
        detail: logs a warning for other CLI plugins instead of raising, with a Slurm test.
        findings: [P3 3]
      - sha: 13c70036b1d
        subject: Use asbool for EngageQueue options and launch opt-in
        detail: replaces the four `str(...).lower() == "true"` checks and adds a truthy-values test.
        findings: [P3 1]
