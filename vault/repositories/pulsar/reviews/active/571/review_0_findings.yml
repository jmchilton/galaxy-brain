        detail: removes the write-only metadata key and takes the `status` lock for the `preprocessed` write in the `SubmissionUncertain` branch.
        findings: [P3 4]
      - sha: 1686a6f1f0f
        subject: Simplify recoverable branches in stateful launch and recovery
        detail: moves the locked cancel check, activation and `submission_started` marker into `_begin_recoverable_dispatch`, and writes `preprocessed` once after the try/except in `recover_active_jobs`.
        findings: [P2 5]
      - sha: 10c68d1adc8
        subject: Move per-job submit param allowlist onto the CLI plugin
        detail: adds `submit_param_overrides` to `BaseJobExec` (default empty) and sets it on `EngageQueue`.
        findings: [P2 3]
