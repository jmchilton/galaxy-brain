  - id: P3 4
    include: true
    title: Use the existing `MockTool` instead of a `SimpleNamespace` tool
    summary: Optional, cosmetic. The integration test's SimpleNamespace tool duplicates pulsar.client.test.check.MockTool. Replaced.
