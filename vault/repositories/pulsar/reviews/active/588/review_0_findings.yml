    pr_title: Don't chmod hardlinked tool files and decide execute bits in one place
    description: |
      `pr_588_round_0_rev_0` builds on `44de4be5`. Its first commit stops `remote_hardlink` from adding execute bits to Galaxy's original tool file: actions now declare `shares_source_inode`, the client sends no `executable` flag for them, and `preprocess` ignores the flag. The staged tool files test gains `hardlink` and `remote_hardlink` cases with a `0744` helper. The next commit moves the tool-and-executable decision into `TransferTracker.handle_transfer_source`, which hands it to `put_file` and the remote staging entry. After that, `copy` stages tool files the same way `transfer` and the remote actions do. The last two commits fix the `preprocess` type hint and reuse `MockTool` in the test. The wire format is unchanged. `ruff`, `isort` and all of `client_staging_test.py`, `transfer_action_test.py` and `client_test.py` pass.
