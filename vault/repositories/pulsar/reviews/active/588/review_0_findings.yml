        subject: Don't chmod hardlinked tool files
        detail: adds `shares_source_inode` to the actions (true for `hardlink` and `remote_hardlink`), skips the `executable` staging flag for those actions in `up.py` and `pre.py`, and adds `hardlink` and `remote_hardlink` cases to the integration test with a `0744` helper whose source mode must stay unchanged.
